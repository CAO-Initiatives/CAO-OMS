  {rev:63,date:'2026-09-07',summary:'Rev 63 (export any grid; the Key Dates period has no upper limit). Tasks, Calendars, SOPs, Cadence and the Admin directory each gained an Export button that writes a spreadsheet of the rows the screen shows, following the current filter and sort, with a second sheet recording the screen, the filter, who exported it, when, and the canonical revision it was exported at. The Calendar exports its list whichever view is showing. The filtered calendar and SOP lists moved into omsCalItems and omsSopRows so the screen and the export read one list and cannot drift apart; Tasks already had omsTaskRows. Read-only accounts may export what they can read; the directory export is admin-only because the Admin Console is. This answers OMS-026. Separately, on Hossam\'s instruction of 7 Sept 2026, the Key Dates period picker Rev 57 introduced no longer refuses a period longer than two years: the period is whatever the sheet covers, and the outside-the-period count already says if the range was wrong.'},
  {rev:62,date:'2026-09-07',summary:'Rev 62 (four corrections from the review of Rev 61). A Dashboard counter pressed with Mine on used to open a task list filtered by the signed-in display name, while the counter itself had resolved owners through the staff directory, so the number and the list disagreed for anybody whose tasks carry a short-form owner such as Hossam or Maggie; the Tasks Owner filter now offers Mine (owned by you), resolved the same way, and the counters send it there. The Mine tooltip claimed the cards below the counters narrow too; only the three task counters do, and the tooltip and User Guide now say so. Copy creates and saves the record before its dialog opens, so Cancel does not remove it; the control, the toast and the guide now say that instead of saying nothing is sent. The five-counter row set its width inline and so ignored the 900 and 600 pixel breakpoints; it now collapses with the other grids.'},
  {rev:61,date:'2026-09-07',summary:'Rev 61 (five efficiency changes for the people using it daily). The Dashboard counters became buttons that open the list they counted, and a fifth was added for work due within three days, which is the work that can still be finished on time; Everyone and Mine scope the Dashboard to your own work through the staff directory rather than by spelling. Tasks can be selected and given a status together, in one save, which Rev 60\'s batching made cheap. Copy makes a second record from one that already exists, for work that comes round again. OMS reopens on the tab and filters you left, per browser, validated against what the account may open. At risk is deliberately a separate predicate from the reminder path, which excludes owners with no email address and would have hidden unassigned work from the counter.'},
  {rev:60,date:'2026-09-07',summary:'Rev 60 (architecture). One request per save: a change touching several records goes to the gateway as one batch, one inbox file and one consolidator run, where a task with an owner used to be three of each in series (gateway OMS-064, data OPS-040); an older gateway is fallen back to one by one. Every poll asks for the canonical revision - a few hundred bytes - and reads the state only once it has moved, and the consolidator\'s own status for the shared record now reaches the Connected banner (D-12). The dialog footer stays in view while a long form scrolls (OMS-060).'},
  {rev:59,date:'2026-09-07',summary:'Rev 59 (FAB-39, found in the live viewer lane). A save refused for a reason no wait or retry can cure - a read-only account, or an initial password not yet changed - used to arm the local pending copy as well, so a viewer who typed into a form was asked \'Leave site?\' about work that could never be saved, and the next sign-in reported it as lost work. The pending copy is for work that could still land; those two refusals no longer write it. An ordinary failure to reach the gateway still does. User Guide updated.'},
  {rev:58,date:'2026-09-07',summary:'Rev 58 (found live on Rev 57). The Key Dates year scan read the first six rows and took the first 20xx it met. On a year-less copy of the real workbook that was the \'/2027\' inside a date lead in row six, so the whole sheet was silently filed in 2027 and the period picker Rev 57 added never appeared. Only the title and header rows can state a sheet\'s year now, and a cell that is itself a date expression is never read as one. The preview also separates the two reasons a row can be dropped - an unreadable date cell, or a date outside the period you gave - into two counts. User Guide updated.'},
  {rev:57,date:'2026-09-07',summary:'Rev 57. Hossam\'s decisions of 7 Sept 2026 after the review, plus the four items the review had left alone on purpose.\n\n(1) A KEY DATES SHEET THAT STATES NO YEAR IS ASKED FOR ITS PERIOD. Rev 53 refused such a file. The Import screen now asks for the start and end of the period the sheet covers, with two calendar pickers, reads the dates into that period, refuses a period longer than two years, and reports how many rows the sheet placed outside it. A sheet that states its year is read as before.\n\n(2) INCOMING, FOR REVIEW, BOARD AND DEADLINE ROWS CAN BE EDITED. Rev 54 added Delete and said the status set at entry was the status the row kept. Each row now has Edit beside Delete; the dialog is the one used to add the row, prefilled and escaped, and the save merges over the existing record, keeping its id, row number and date added. A row that vanished while the dialog was open is refused, not re-created.\n\n(3) THE BOOTSTRAP ROSTER IS ONE ADMINISTRATOR. seedPeople, which runs only when canonical holds no people at all, invented a five-person office that had drifted from the real one - a departed colleague still listed, an address in the wrong form, no email for anyone else. It now seeds the one administrator; everyone else is added from the Admin Console against canonical.\n\n(4) buildSeed AND THE SEED CALENDAR ARRAYS ARE GONE. Nothing had called them since canonical state existed; they were a large block of stale 2026 calendar data inside a Dean-facing artifact. Canonical is the only source of records.\n\nAlso: REV17.md in this repository no longer promises the Outlook calendar sync that was never built and that Rev 47 removed from the interface. User Guide updated.'},
  {rev:56,date:'2026-09-07',summary:'Rev 56 (found by the live QA lane). Reactivating a person from the Admin Console restored their sign-in and lost the directory flag. The function found the person\'s record, awaited the gateway, then set the flag - and during that wait a confirming sync had replaced the shared state wholesale, so the flag was set on a record no longer in the state and never saved. The same shape sat in Deactivate, in the Edit User save path after a role change, and in the Create sign-in dialog after the account was issued. Each now re-resolves the record by id after the await. The suite reproduces it by replacing the state inside the stubbed gateway call. User Guide updated.'},
  {rev:55,date:'2026-09-07',summary:'Rev 55 (found by the live QA lane). Three defects that only operating the deployed application showed, on the evening of 6 Sept 2026.\n\n(1) CREATE SIGN-IN ALWAYS RAN AS A PASSWORD RESET. openAccountModal set the dialog\'s mode and then called openModal, which replaced the dialog state wholesale and lost it, so Create sign-in for an existing person answered \'That person has no sign-in account.\' every time. The only way an account could ever be issued was the Add User form. openModal now keeps a caller\'s mode when it is opening the same dialog.\n\n(2) THE SOP LINK FIELD WAS THE ONE SITE REV 51 MISSED. Three save paths normalized a link and refused an unsafe scheme; the SOP branch stored the field verbatim, so a javascript: link was saved and only the render-side filter stood between it and a click. The SOP branch now goes through the same check, and the suite asserts that every read of the link field does.\n\n(3) A STALE PENDING COPY OUTLIVED THE WORK IT DESCRIBED. The local copy written when a sync could not be confirmed was never cleared by a later reload that adopted canonical, so a Connected page kept asking \'Leave site?\' about work that had landed long before - and work that had NOT reached the gateway was discarded on reload with nothing said. Boot now clears the copy and, when its operations never reached the gateway, says so in the banner with the time of the work that was lost. User Guide updated.'},
  {rev:54,date:'2026-09-07',summary:'Rev 54 (correctness and accessibility). Thirty-six findings from the Fable 5.1 pass of 6 Sept 2026 (A-04 to A-21, C-02 to C-16, R-03, R-04, R-07, R-10, R-11, R-12), plus one defect found live during the QA lane. Every behavior change carries a guide or tooltip correction and a text-to-code binding; every fix is asserted in the smoke suite.\n\nFOUND LIVE. A save made while an earlier CREATE was still confirming raised the conflict alert for the user\'s own record: the diff regenerated the create with base version 0, canonical now held it at version 1, and the version check treated a create as a plain mismatch. An operation already in canonical - a landed create, an update whose fields already hold their values, a delete whose record is gone - is now recognized as applied and neither refused nor re-sent.\n\nDATES. dFrom rounded up across a fall-back clock change and put every future date one day out (C-02). Four places took today from UTC, so after 8 pm Eastern a review due today read Overdue and the printed checklist was dated tomorrow (C-14, R-12); one todayISO() derived from the noon-anchored TODAY serves them all. The Weekly Brief filtered events on start date only, so a multi-day event that began before the week was missing (C-08).\n\nRETIRED. Retired SOPs were still counted in SOP Reviews Due (R-03); a Retired task rendered on the calendar as an ordinary pill (C-07); linked-task counts on event pills included Retired tasks (A-19); the status hint promised strike-through that only the badge had (R-10).\n\nSAVE PATHS. The task branch rebuilt the record instead of merging it, dropping every field the form does not show (A-04); a save whose record had vanished was silently discarded rather than refused (A-14); a new task was pre-assigned to the first person in the directory and a notification queued to them (A-06); a person added from the task dialog was created before the task validated, so abandoning the task left the person (A-07); a deactivated person was invisible to owner resolution, so editing their task prompted for an email on every save and could mint a duplicate (A-05); a two-task dependency cycle was creatable and displayed as Blocked forever (A-17); the four intake sections were create-only with no way to remove a typo (A-08).\n\nNOTIFICATIONS. The reminder idempotency key ignored the recipient, so a reassigned task kept a pending draft to the previous owner (A-10); a first assignment to an existing unowned task was worded as a reassignment (A-15); re-marking a sent notification rewrote its timestamp (A-16); retiring a prerequisite unblocked its dependents silently (A-18).\n\nVIEWS AND SORTING. Descending sorts put blank dates first (C-04); a saved calendar view dropped the Standing and Out-of-office filters, and a saved view naming a category nothing carries any more showed All over an empty table on Tasks and SOPs (C-05, R-07); renaming a category skipped SOPs and the categories dialog counted them as nothing (R-04, A-12).\n\nACCESSIBILITY. Labels are associated with their inputs; filter chips and calendar pills are keyboard-operable; the dialog carries a dialog role and moves focus in and out (C-09).\n\nALSO: the Weekly Brief week picker no longer marks every collection dirty and queues a sync to page a report (C-15); the nav highlight keys on the button, not its position (C-16); three dead functions removed and the unread task-status constant now drives the status lists (C-10, C-11); a version number written into the admin guide prose removed (C-13); cross-links inside a dialog confirm before discarding typed edits (A-20); the read-only hiding now also covers buttons that carry no-print themselves. User Guide updated.'},
  {rev:53,date:'2026-09-07',summary:'Rev 53 (importer). Sixteen defects in the workbook importer, from the Fable 5.1 pass of 6 Sept 2026 (B-02 to B-16, R-02, R-05, R-06, R-08, R-09, R-13). Every one was read in the code before it was fixed, and every fix is asserted in the smoke suite.\n\n(1) A RE-IMPORT REBUILT EVERY ROW FROM SCRATCH. Each replacement row got a fresh id and a literal that carried the workbook\'s fields and nothing else. So re-importing Ari\'s or Maggie\'s workbook un-retired every Retired event of that source (R-02), erased End Date and End Time set by hand, orphaned every task linked to an event by breaking its source-event id, and wrote a title-derived false for Standing as though somebody had decided it (R-06), after which the title rule could never apply again. A row that still matches a prior event by date and title now keeps that event\'s id, status, end date, end time and notes; Standing is stored only when it is on or was decided by a person. The preview and the confirm prompt say exactly what is carried forward and how many linked tasks the rows that do NOT match would orphan.\n\n(2) IDS COULD COLLIDE ON A BULK IMPORT. uid() carried three random characters after the millisecond; a 182-row import in one or two milliseconds had about a one-in-three chance of a collision, and OMS_MAP silently drops the second record. Eight characters now.\n\n(3) THE SHEET SKIP-LIST SKIPPED NOTHING. It compared a lower-cased sheet name against entries with capitals. Both sides are lower-cased.\n\n(4) THE KEY DATES YEAR WAS A HARD-CODED 2026. A 2027 workbook imported as 2026, silently. The year now comes from the sheet name or its first rows, rolls forward when a column\'s month goes backwards, and the import refuses rather than guesses when no year can be established.\n\n(5) DATES THAT WERE NOT DATES GOT IN. Slash dates were split without calendar validation, so 13/45/2026 passed the ISO gate and rendered NaN; a zero or time-only numeric cell became 1899-12-30; text around a date was taken as the date. Every parsed date now round-trips through a real Date, a failure is dropped and counted in the preview, and month abbreviations and ordinals are accepted.\n\n(6) THE PROTECTED-COLLECTION CHECK COULD NOT FAIL AND DID NOT ROLL BACK. It excluded events and ran after the write. It now snapshots everything, verifies before the write, and restores on failure, so \'Replacement was not saved\' is true when it prints. The Events path gains the size guard the Key Dates path had: replacing more than half of a source\'s events needs a typed REPLACE naming both numbers.\n\n(7) SMALLER: confirmImport no longer clears pending unsent work in other collections; numeric workbook cells are stringified; the duplicate check needs two shared words and knows more stop-words; cadence carry-forward normalizes quotes and whitespace and takes a second chance on date plus title prefix (R-05); the Standing chip counts selected rows only (R-09); the cadence words match the guide and gain daily, biweekly and bimonthly (R-08); one word, Standing, replaces Cadence, Recurring and Standing across the importer and the event form (R-13). User Guide updated.'},
  {rev:52,date:'2026-09-07',summary:'Rev 52 (Admin Console). The console\'s controls now do what their labels say. Found by the Fable 5.1 pass of 6 Sept 2026 (A-01, A-02, A-03, A-09, A-11, C-01, D-01, D-05, D-08); the gateway half shipped as OMS-063.\n\n(1) ACCESS LEVEL WAS A BADGE. The Edit User dialog offered viewer / editor / admin and wrote a directory field the gateway never reads; there was no role-change action in the gateway at all, so demoting somebody changed what the console displayed and nothing about what they could do. The gateway now has one, and the dialog calls it before the directory moves. The level shown is the sign-in account\'s own, since that is the one enforced. A refusal - your own account, or the last active administrator - leaves everything as it was and says why.\n\n(2) DEACTIVATE DID NOT DEACTIVATE. The confirm said the person would lose access on next login; authentication never read the flag it set. If the person has a sign-in account it is blocked first, through the gateway; the directory flag follows only if that succeeded. Reactivate restores both.\n\n(3) DELETE LEFT THE SIGN-IN BEHIND. omsRemoveSignIn had existed since Rev 30 and was called from nowhere. Delete removed the directory row, the account stayed live, and with no row to hang a button on it could no longer be reached from any screen. The account goes first now, and the row only if that succeeded. The administrator guard reads the account\'s real role, not the directory field any editor can write.\n\n(4) SMALLER: creating a sign-in from the console records the chosen level on the directory row; Add User refuses somebody already in the directory by name or address and mints ids by the same slug convention as everywhere else; a key a record did not have is sent with an explicit null base value so the consolidator can verify it (pairs with OPS-038). Nav tooltip, button tooltips and three User Guide sentences corrected; five text-to-code bindings added, three of them reachability bindings on the exact orphan shape found here.'},
  {rev:51,date:'2026-09-07',summary:'Rev 51 (client security). Defensive hardening from the Fable 5.1 security review of 6 Sept 2026. Nothing here changes what a signed-in editor can do; all of it changes what a stored string, a workbook cell or a walk-up at a shared machine can do.\n\n(1) esc() ESCAPED THREE CHARACTERS OF FIVE. It is used in attribute position throughout - value, href, title, data-cat - and it never touched quotes, so a double quote in any free-text field closed the attribute and the remainder became markup. Every one of the roughly forty attribute sites is fixed by the one function. It also no longer throws on a number, which is how a numeric room number in a workbook cell blanked the Calendar tab.\n\n(2) STORED LINKS WERE FOLLOWED WITHOUT A SCHEME CHECK. Thirteen anchors rendered a free-text link field straight into href. Only http, https and mailto links are followed now; a bare address gets https on save, anything else is refused with a message, and old values of another shape render as text. All thirteen anchors also carry rel=noopener.\n\n(3) THE INITIAL-PASSWORD FORMULA WAS PUBLISHED IN THIS FILE. omsSuggestedPassword returned surname plus a fixed suffix, and this artifact is served from a public repository, so anyone could compute the initial password of every account not yet changed - and, by signing in first, set the new one and own the account. Rev 43 took the sentence off the sign-in page; the generator was still here. The suggestion now carries six random digits, still dictatable over the phone, no longer derivable from a name.\n\n(4) SIGN-OUT LEFT THE WHOLE SHARED STATE ON THE MACHINE. Every save wrote canonical state to localStorage twice - once under a key nothing ever read again - and Sign Out removed only the session. Sign Out now clears the local copy too. The unread second copy is no longer written and the dead loader that once read it is gone.\n\n(5) THE ROLE CAME FROM A STORED BLOB. The client took its role from the sign-in response saved in sessionStorage and never asked again; the forced password change was enforced only on the sign-in page and skipped by going straight to oms.html. Boot now asks the gateway who this is and sends an account that still has to set its password back to do so.\n\n(6) SMALLER: the import preview, two Deliverables dates and three date inputs were interpolated unescaped; the Outlook draft decoded entities through a detached textarea\'s innerHTML and now uses a lookup; the email prompt accepts only something shaped like an address; the read-only hiding of editor controls is re-applied after every re-render instead of only on a tab change, and now covers the outline buttons; the guard for a Reset control removed in Rev 9 is gone; a missing spreadsheet reader now says so instead of naming a variable. User Guide updated.'},
  {rev:50,date:'2026-09-07',summary:'Rev 50 (client). Four defects in the sync path, all reproduced before they were fixed, and the gate loophole that let a real release skip its own checks. Found by the Fable 5.1 QA, architecture and security pass of 6 Sept 2026; reproductions are in docs/review-2026-09-06-qa-security/repro-sync-path.mjs and every case is now asserted in the smoke suite.\n\n(1) THE IDLE REFRESH NEVER RAN. Rev 44 promised that a visible tab looks for other people\'s work about once a minute. It could not: the boot-time migration calls save(), which marks all fifteen collections dirty while OMS_SYNC_READY is still false, nothing cleared them, and OMS_WATCH_SAFE() refuses while anything is dirty. Live-verified: 348 seconds after sign-in, 15 collections dirty, zero state reads. Boot now clears the dirty set when the migration changed nothing.\n\n(2) FIELD-LEVEL MERGE WAS UNREACHABLE. Rev 44 made a save send only the changed keys so two people editing different fields of one record both survive - and the consolidator does apply such an update. But OMS_ASSERT_CURRENT refused any update whose record version had moved at all, before anything was posted, so the merge ran only inside the few seconds between that check and the fold. Colleague edits the title, you edit the notes with the dialog open: conflict alert, note gone. The client now asks the consolidator\'s own question - did any of MY fields move underneath me - and rebases the operation onto the current version when none did. Same-field edits are still refused, and the message now names the record and the fields.\n\n(3) AN EDIT MADE WHILE A SAVE WAS CONFIRMING WAS LOST, AND THE SCREEN SAID SAVE SUCCESSFUL. Confirmation adopted canonical wholesale, overwriting the newer edit, then cleared its dirty flag so the chained sync found nothing to send. Adoption now replays local operations not yet in canonical on top of the confirmed state and marks them dirty again, so the next sync sends exactly them. The guide line that said not to make an edit again while confirming was true of the SAME edit and misleading about any other; it now says you can keep working.\n\n(4) ONE STALE RECORD DISCARDED THE WHOLE BATCH. A conflict on any record threw before any operation was posted, and the conflict handler adopted canonical wholesale - dropping every other edit in the save, brand-new records included. The handler now sets aside only the conflicting record, keeps the rest, and sends them.\n\n(5) RELEASE GATE. Checks 7 and 8 were skipped for any change adding five lines or fewer, which is how Rev 47 shipped with the guide, badge and rev-log checks all skipped. The threshold is now zero: every change to the artifact is checked. Four text-to-code bindings added so these four promises cannot drift silently again. User Guide updated.'},
  {rev:49,date:'2026-09-06',summary:'Rev 49 (OMS-028, OMS-049). Retirement, on one predicate. Events and SOPs can now be set to Retired from a Status box on their own form, reusing the field, the word and the behavior tasks have had since Rev 17 rather than each growing a vocabulary of its own: the record stays visible and marked, keeps its history, and drops out of the 30-day dashboard count and the Weekly Brief. Delete remains the only thing that destroys a record. SOPs also gain a category, drawn from the SAME list events and tasks use, with a filter on the SOPs table and search reaching it; the shared list is now derived from SOPs too, so a category used by nothing but a procedure cannot vanish from it. User Guide updated.'},
  {rev:48,date:'2026-09-06',summary:'Rev 48 (OMS-041). Cadence can now reach the events that lack it. Ticking Standing on an event is carried forward when that source workbook is re-imported - before this, a replacement rebuilt every row from the workbook and erased it. The import preview gains a Cadence column showing what was worked out for each row, from the carry-forward or from a title reading Weekly, Monthly, Quarterly or Standing, with a per-row toggle so nothing is decided silently. Annual is deliberately not treated as cadence: on the live workbook every annual match is a once-a-year event, not a standing meeting. User Guide updated.'},
  {rev:47,date:'2026-09-06',summary:'Rev 47 (OMS-041). Two places in the interface promised that an Outlook calendar sync fills in an event Cadence automatically. There is no calendar sync - the Outlook integration is a mailto draft, deliberately, to avoid Graph - so both sentences told users not to tick a box that nothing else was going to tick. Both now say cadence is set by hand, and warn that re-importing a source workbook replaces that source\'s events and clears it. Gate check 12 gained a tripwire that fails if either claim is written again.'},
  {rev:46,date:'2026-09-06',summary:'Rev 46 (OMS-028, OMS-047). SOP reviews now surface on the Dashboard: the function that finds them shipped in Rev 34 and had never been called from anywhere, so a lapsed review was visible only to somebody already on the SOPs tab. SOP search now reads the notes the table already displays. Gate check 12 gained three bindings that chain reachability through the new card, and text_claims.py now refuses a command-line argument instead of silently ignoring it. User Guide updated.'},
  {rev:45,date:'2026-09-06',summary:'Rev 45 (client). The one script OMS loads from outside itself is now verified before it runs, and an interpolation that was not escaped is.\n\nSUBRESOURCE INTEGRITY ON SHEETJS. The spreadsheet reader is the only code this application loads from anywhere but its own origin, and it was loaded with no integrity attribute at all. It runs with full access to the page, which includes the session token in sessionStorage. A compromise of that CDN, or of DNS in front of it, would have read every signed-in user\'s credential, and nothing in this system would have noticed or been able to tell afterwards. The tag now pins the exact 951,904-byte build by SHA-384; the browser refuses to execute anything else, and the comment beside it records how to recompute the hash when the version moves.\n\nAN UNESCAPED INTERPOLATION. The Weekly Brief\'s conflict rows wrote ${e.source} and ${e.time} straight into innerHTML while escaping the title beside them. The interface constrains source to a fixed list, so this is not reachable by pointing and clicking - but any editor can set any field through the API, and the artifact has 153 esc() calls precisely because that is not a defense. Both are escaped now.\n\nNeither of these is a defect anybody would have seen. Both were found by the Fable 5.1 security pass reading the file rather than using it, which is the point of asking somebody else to look.\n\nSTILL OPEN, and deliberately not done here: neither page carries a Content-Security-Policy. One would meaningfully narrow where a successful injection could send data, but this application uses inline scripts and inline event handlers throughout, so a policy has to be written around them and tested against a real browser rather than the headless harness. Shipping an untested CSP would risk breaking the whole application for everyone to close a hole that is currently theoretical. It belongs in the QA pass, with a browser.'},
  {rev:44,date:'2026-09-06',summary:'Rev 44 (client). Two people can now edit the same record at once, and other people\'s work arrives without a save or a reload. Both are the sync path, both were found by the Fable 5.1 security and QA pass, and neither was in the architecture review.\n\n(1) THE CLIENT WAS DEFEATING THE CONSOLIDATOR\'S FIELD-LEVEL MERGE. consolidate.py raises a same-field conflict only when a key appears in BOTH baseValues and changes and canonical has moved underneath it. OMS_DIFF sent the WHOLE record as changes and the whole prior record as baseValues, so every key overlapped and ANY two edits to one record collided - even when they touched nothing in common. Reproduced against the real consolidator: A edits the title, B edits the notes, B is rejected with "same-field conflict: title" and B\'s note is gone. Send only the changed keys and both apply cleanly.\n\nRev 34\'s guide line - two people writing on the same record no longer overwrite one another - was true of the attributed-note control and false of everything else, for exactly this reason. It is true now.\n\nA create still sends the whole record, because there is nothing to diff against. A key REMOVED from a record is still not removed in canonical: the consolidator merges with dict.update(), which cannot delete, and that was equally true before. Setting a field empty works; making it vanish does not. It also shrinks what the operation log keeps forever, which is the retention problem approached from the other end.\n\n(2) OMS NEVER LOOKED AGAIN ONCE IT WAS IDLE. Shared state was fetched at sign-in, during a save, and while the reconciler chased an unconfirmed one. That is all. Measured against the previous artifact: an hour sitting on a Connected session made ZERO calls to /api/state and left no timer pending, while canonical moved five revisions ahead. A colleague\'s new task was invisible until you happened to save something or reload the page.\n\nThat is the other half of "it does not refresh itself". Rev 36 fixed the half where your own save sat unconfirmed. This is the half where everybody else\'s work does not arrive.\n\nA visible tab now looks about once a minute and adopts anything newer. It never adopts while there is unsaved work, a batch with the gateway, a save running, the reconciler already owning the outcome, or a dialog open - somebody typing into a form has not marked anything dirty yet, and the page changing underneath them would be worse than being a minute out of date. The check is repeated after the fetch, because a save can begin while it is in the air. A hidden tab costs nothing.\n\nSixty reads an hour per open tab, against an installation limit of five thousand shared with sign-in, every save and the consolidator. Asserted in the suite, because Rev 39 exists to remind everyone what an unbounded poll costs.'},
  {rev:43,date:'2026-09-06',summary:'Rev 43 (client, text). The initial-password pattern is no longer spelled out in prose on the two public pages - and this is a partial measure, which the entry says plainly rather than claiming a fix.\n\nWHAT WAS PUBLIC. CAO-OMS is a public repository and GitHub Pages serves both files from it. A source comment in index.html, immediately beside the live sign-in form, read "Initial passwords are <lastname>-OMS-2026!". The User Guide in oms.html said the same in two more places. Five of the six live accounts still carry mustChangePassword, and their surnames are discoverable. Anyone who read the sign-in page could work out five sign-ins.\n\nWHY THIS IS NOT THE FIX, and must not be mistaken for one: omsSuggestedPassword is in the same public artifact and returns surname+\'-OMS-2026!\' in as many words. The shape is derivable from the code whatever the prose says. Deleting the sentences narrows casual discovery and nothing more.\n\nTHE ACTUAL EXPOSURE is that /api/state requires only a valid session, so an account that has never replaced its initial password can still READ everything OMS holds - every event, task, SOP and directory entry with email addresses. Gateway OMS-053 refuses WRITES from such an account and deliberately left reads open, on the reasoning that somebody must be able to reach the screen that tells them to change their password. That reasoning is wrong: the screen is index.html, and it needs /api/login and /api/password, neither of which is affected. The gateway change that closes it is prepared and is a decision rather than a detail, because it stops those five accounts using OMS at all until each password is set.\n\nTwo further options belong with that decision and are not taken here: resetting the five to random values delivered out of band, and giving omsSuggestedPassword a random element so a name no longer determines a password. The second would need care - Rev 31 made the suggestion dictatable on purpose, because these are read out over the phone, and a random string is not dictatable. Something like a four-digit suffix keeps both properties.\n\nFound by the Fable 5.1 security pass. The architecture review saw the write-only scoping and accepted it.'},
  {rev:42,date:'2026-09-06',summary:'Rev 42 (client, text). The User Guide had been made false by a gateway change shipped four hours after it, and the release gate was enforcing the false version.\n\nWHAT HAPPENED, IN ORDER. requireSession returned the role FROM THE SESSION TOKEN and never read auth/users.json, so disabling somebody changed nothing for a session already open - up to eight hours. Rev 40 wrote that limitation into the guide, truthfully, because the guide had previously claimed the opposite. Gateway OMS-051 then made requireSession resolve the account against the file behind a sixty-second cache, which fixed the defect and made the Rev 40 sentence wrong the same afternoon. Nobody revisited the text, and the text-claims binding added alongside it REQUIRED the now-false sentence: check 12 was enforcing a lie.\n\nThat is the standing instruction\'s own failure mode, running backwards. The mechanism that is supposed to stop text drifting from code was holding the text still while the code moved. It happened because check 12 reads only oms.html and cannot see the gateway at all, which is a structural limit worth naming rather than a slip.\n\nFound by the Fable 5.1 security pass, not by the review, and not by the session that shipped both halves.\n\nWHAT THE GUIDE SAYS NOW. Disabling, deleting or moving somebody to read-only ends their session within about a minute - on their next action, not at their next sign-in - because the service checks the account rather than trusting the pass issued at sign-in. No need to ask anyone to sign out; no need to rotate the session key.\n\nThe binding is renamed and repointed so it now pins the true statement, and its note records why the previous one existed and how it went stale, because that is the more useful thing for whoever reads it next.'},
  {rev:41,date:'2026-09-06',summary:'Rev 41 (client). A refused save says which refusal it was. Ships BEFORE the gateway change it prepares for, so nobody meets the new rule without an explanation.\n\nTHE PRE-EXISTING DEFECT, found while wiring the new one. OMS_POST reported every 403 as auth:true - "Your session expired. Local work remains on this browser." Only a 401 means that. A read-only account trying to save has been refused by the gateway since the role check went in, and for all of that time the screen told them their session had expired: untrue, and signing in again would have changed nothing. The banner now reads Read only and says plainly that nothing was saved and who to ask.\n\nTHE ONE THIS PREPARES FOR. Gateway OMS-053 refuses writes from an account that has not yet replaced its initial password. Without this release that refusal would have been reported as an expired session too, or worse - had the 403 fallen through - as the generic Unsynced message, which tells people to press Save again. Save can never work until the password is set, so that would have been the Rev 35 mistake again: an instruction to keep doing something that cannot succeed.\n\nThe banner now reads Password change required and says what to do about it, which is not obvious: the box that sets a password lives on the SIGN-IN page, not inside the application, so somebody already signed in has to sign out and sign in again. The edit stays on screen in both cases and neither starts the reconciler, because waiting fixes neither.\n\nIT BRANCHES ON THE GATEWAY\'S CODE, NOT ITS WORDING. handleError now returns a stable `code` alongside the human `error`. Matching on prose would break the moment somebody improved the sentence, and the sentence is written to be improved.\n\nWHY THIS IS SAFE TO SHIP FIRST. Nothing returns password_change_required yet, so the new branch is unreachable until the gateway pull request merges. The read-only correction is live immediately, which is the right way round: it fixes a message that has been wrong for every read-only save attempt so far.\n\nAgainst the previous artifact three of these assertions fail - both 403s reported Authentication required, and the code branch did not exist.'},
  {rev:40,date:'2026-09-06',summary:'Rev 40 (client, text). The User Guide stops promising something the system does not do: disabling an account does not end a session that is already open.\n\nWHAT THE GUIDE SAID. "Disable sign-in blocks access without deleting anything." An administrator dealing with a departure reads "blocks access" as access ending now. It does not.\n\nWHAT ACTUALLY HAPPENS. requireSession in the gateway verifies the signed session token and returns the role FROM THE TOKEN. It never reads auth/users.json. There is no jti, no token version and no denylist anywhere in CAO-OMS-Gateway - checked across lib/core.js and all six endpoints. The role is stamped into the token when the person signs in and the token is minted for eight hours. So disabling, deleting or demoting somebody rewrites auth/users.json correctly, the admin screen shows the change correctly, the next sign-in is correctly refused - and the person keeps exactly the access they already had, including writes through /api/operation, until the token expires or they sign out.\n\nTHE TOOLTIP WAS ALREADY RIGHT. The control\'s own tooltip reads "Block sign-in without removing the account", which is accurate. Only the guide overreached, and the two now agree: the guide says "stops the next sign-in", with a new line stating plainly that a session already open is unaffected, how long that lasts, and what to do about it - ask the person to sign out, or have the session key rotated, which signs everybody out.\n\nWHY TEXT RATHER THAN CODE, FOR NOW. Closing the gap properly means checking the account on every request. Measured before choosing: /api/state and /api/operation make exactly one GitHub call each today, and a per-request check makes it two - on a path where the reconciler already polls and GitHub\'s documented floor for an installation is 5,000 requests an hour, which this organization sits at. Doubling that to close an eight-hour window in a six-account Dean\'s Office, where every write is stamped with its author and revertible in git, is the wrong trade in that order. The right shape is the caching pattern this gateway already uses for its installation token - a short-lived module-scope cache around the auth file read, which turns eight hours into about a minute at a bounded cost. That is a gateway change and goes by pull request; it is agreed as a follow-up and is not in this release.\n\nNOT ADDRESSED HERE, and recorded so it is not lost: makeSession also stamps mustChangePassword into the token as mcp, and no endpoint reads it. The forced password change is enforced by the client alone, so the initial surname-OMS-2026! pattern can be kept by calling the API directly. That is a larger hole than the eight-hour window and belongs with the same follow-up.\n\nThe binding for this claim is attached to the client\'s session accessor, because check 12 reads only oms.html and the mechanism it describes lives in the gateway.'},
  {rev:39,date:'2026-09-06',summary:'Rev 39 (client). The self-healing watch is made affordable: 20 checks in an hour instead of 1,200, and it still never gives up.\n\nA DEFECT INTRODUCED BY REV 36, found while measuring the cost of something else. Rev 35 wrote a flat three-second reconcile interval and it cost nothing, because the reconciler could never fire. Rev 36 made it fire. That turned the interval into real load which had never been paid before, and nothing capped it: the tick reschedules unconditionally, so a client sitting in Unsynced polled /api/state every three seconds for as long as the tab stayed open.\n\nWHY THAT MATTERS MORE THAN IT SOUNDS. Every /api/state is one GitHub contents read on the gateway\'s installation token. GitHub\'s documented floor for an installation is 5,000 requests an hour and this organization is at that floor - three repositories, six users, no scaling. One stuck client burned 1,200 an hour. Four would have exhausted the budget for the entire system, and that budget is shared with sign-in, with every save, and with the consolidator\'s own pushes. The failure would not have presented as a polling problem. It would have presented as OMS being down, for everyone, with no obvious cause.\n\nTHE FIX IS A BACKOFF, NOT A LIMIT. 3s, 3s, 5s, 8s, 13s, 21s, 30s, 60s, then five minutes from there on. The first two minutes stay fast enough that an ordinary twenty-to-thirty-second fold still feels immediate; after that the watch continues indefinitely at a rate that costs nothing. Measured against the real artifact: 20 polls in the first hour where the previous shape made 1,200, and the previous shape is what the negative control still measures at 1,200 so the number is read rather than claimed.\n\nDELIBERATELY NOT A HARD STOP. Giving up after a fixed window would put back exactly the terminal Unsynced that Rev 36 exists to remove, and a confirmation arriving late is precisely the case this whole mechanism was built for. The suite proves it both ways: an hour of an unmoving canonical leaves a timer still pending, and a confirmation arriving after that hour is still noticed and still clears the banner.\n\nTHE BANNER CHANGES PACE WITH IT. When the watch reaches its slow rate it says so, and adds the one thing that is now worth knowing: the change was accepted by the gateway, so reloading is safe if you would rather look than wait. That advice is only true on this branch - the branch for operations that never left the browser still says not to reload, because there it would discard the edit.\n\nONE MORE SOURCE-TEXT ASSERTION RETIRED. The suite checked that the reconciler rescheduled by matching setTimeout(tick in its source, which broke when the scheduling moved into a named function. That is the third assertion in this suite to fail for a rename rather than a regression. It is now a cheap structural check pointing at the executable one that actually drives the clock.'},
  {rev:38,date:'2026-09-06',summary:'Rev 38 (client). Add Workstream gives the new row an id, which is the difference between a workstream existing and a workstream existing only on the computer that typed it.\n\nTHE DEFECT. The Cadence grid\'s save branch pushed {ws,cells,st} with no id at all. OMS_MAP keeps a record only when id != null and BOTH sides of the sync diff use it, so a new workstream emitted no operation in any direction - no create, no update, no delete. It never reached canonical, it disappeared on the next reload, and because the row sat in ST until then, the Rev 15 guard correctly held the whole session in Unsynced naming rob, on every subsequent save in every other collection.\n\nWHY IT SURVIVED THE MIGRATION. The 5 Sept 2026 direct commit gave ids to the gw and rob rows that existed, and RECOVERY.md records why that had to be a direct commit rather than an operation. It could not give an id to a row that did not exist yet. The data was repaired; the code that makes new rows was not, and nothing connected the two. gw is unaffected - the client has no ST.gw.push, so CAO Visibility rows cannot be created here at all.\n\nA SECOND FAULT IN THE SAME LINE. The Add-versus-Edit condition read `id===0 || id!==null`, which is true for every value except null - including undefined, which would have indexed ST.rob by undefined and thrown. It now uses Number.isInteger, the same test openRobWsModal already uses to decide which modal to open.\n\nIDS FOLLOW THE DOCUMENTED CONVENTION. rob-<slug of workstream>, as CLAUDE.md records, with -2, -3 and so on when a slug is taken, the same way person ids handle a collision. slug() falls back to a generated id on a name with no letters or digits, so a bare rob- is not reachable. The seven migrated ids are truncated to 32 characters and new ones are not: the documented rule says nothing about truncation, and a length difference in an identifier no user ever sees is not worth inventing a second convention for.\n\nTHE TEST IS THE GENERAL ONE, NOT THE SPECIFIC ONE. Asserting that rob now assigns an id would catch rob and nothing else. The suite now sweeps every ST.<collection>.push site in the artifact and requires an id in each, so the next collection to acquire a create path cannot repeat this quietly. There are two such sites today, people and rob; against the previous artifact the sweep fails on rob, which is the only reason to believe it works.'},
  {rev:37,date:'2026-09-06',summary:'Rev 37 (client). A save no longer re-sends work that is already with the gateway, and Connected no longer appears while any of it is outstanding.\n\nTHE DEFECT. OMS_BASE advances only when a sync is CONFIRMED. save() marks every collection dirty. OMS_DIFF compares OMS_BASE to ST. So while a batch was outstanding, the next save recomputed the diff against the same stale base and re-emitted every operation in that batch, plus the new one. Each resend carried the same baseVersion, so the first application won and the rest were filed as same-field conflicts.\n\nTHE EVIDENCE, from canonical rather than from reasoning. On 5 Sept a ten-operation batch went to the gateway three times in forty-one seconds - 16:02:00, 16:02:29, 16:02:41 - each time with identical changes, identical baseValues and the identical baseVersion, under three different operation ids. Tasks and deadlines, same ten records, same order. The first set applied; the other two are in conflicts/unresolved. That pattern accounts for 51 of the 53 records in that directory, a month of them.\n\nWHY IT MATTERED EVEN THOUGH NOTHING WAS LOST. A resend always wanted what canonical already held, so no edit was destroyed. But it doubled and tripled gateway writes exactly when the consolidator was already behind, every extra write was another chance to lose the push race that OPS-025 exists to absorb, and it filled the one log that would show a GENUINELY lost edit with 96 percent noise.\n\nTHE FIX. An operation already with the gateway and not yet resolved is not sent again. Identity is the whole payload - entityType, entityId, action, baseVersion and the changes themselves - so two edits to the same record with different values remain two intentions and both still go. Outstanding operations are carried forward rather than dropped, and confirmation waits for ALL of them: a fold that lands the first save but not the second is no longer reported as Connected.\n\nONE MORE BRANCH CLOSED. A diff of nothing does not mean everything has landed. If a change is undone by hand while it is still in flight, OMS_DIFF returns empty and the old code reported Connected - the Rev 15 defect again, in the very branch written to prevent it. That path now hands back to the reconciler instead.\n\nREV19-001 IS STILL DEFERRED and the guard that says so was rewritten rather than removed. It matched the post loop by exact string and Rev 37 renamed the variable, so it would have failed for a spelling change alone; it now tests the property - one await per operation, serial, no Promise.all on the post path - and was checked against a deliberately parallelised artifact to confirm it still fails when it should.\n\nThe tests for all of this execute the clock rather than reading the source, the way Rev 36 established.'},
  {rev:36,date:'2026-09-06',summary:'Rev 36 (client). Unsynced heals itself for real, and a confirmation now means the change is actually there. Shipped alone, like Rev 21, because this is the sync path.\n\n(1) THE RECONCILER NEVER RAN. Rev 35 added a reconciler so that a save left showing Unsynced would resolve itself, and told users on screen not to reload because OMS was checking. It never checked once. Reaching the catch that starts it REQUIRES OMS_DIFF to have produced operations; OMS_DIFF produces operations only for collection types in _dirty; OMS_SYNC_ONCE clears _dirty only after OMS_WAIT_FOR returns, and on that path it threw. So _dirty was guaranteed non-empty at the only call site and the tick guard if(!_dirty.size) blocked every time. Measured, not inferred: forty scheduled ticks over two simulated minutes made zero calls to /api/state while canonical sat one revision ahead. The rule the guard was written for is right - adoption replaces ST wholesale and must never run over work in progress - but _dirty conflates edits NOT YET SENT with edits SENT AND AWAITING CONFIRMATION, and this path is always the second. OMS_EDIT_SEQ counts the paths that mark state dirty, OMS_INFLIGHT captures its value when the gateway accepted the batch, and equality means nothing has been typed since.\n\n(2) A REVISION BUMP IS NOT A CONFIRMATION. OMS_WAIT_FOR returned as soon as canonical revision exceeded the one it started from. consolidate.py increments the revision ONCE PER BATCH, in its own words including conflicts and invalid operations. So the revision moves when an operation is REJECTED, and when somebody ELSE is folded in first. In both cases OMS adopted canonical wholesale, cleared the dirty set, deleted the local pending copy and reported Save successful, while the screen reverted to the value just changed. That is the Rev 15 defect at the other end of the pipe: a save that did nothing reporting that it had. OMS_OPS_LANDED now asks whether the operations are VISIBLE - a create present, a delete gone, an update holding the fields it asked for - and answers applied, pending or rejected. Both OMS_WAIT_FOR and the reconciler use it.\n\n(3) WHY THESE SHIPPED TOGETHER rather than one then the other. Fixing (1) alone would have moved (2) into a loop running every three seconds, where any unrelated save by anybody ends the watch and overwrites the screen while calling it a confirmation. Strictly worse than the inert version.\n\n(4) THE BANNER SAYS WHICH SITUATION YOU ARE IN. Two different states wore one message. If the gateway accepted the batch, waiting genuinely works and reloading is harmless. If the operations never left the browser, waiting resolves nothing and reloading DISCARDS the edit, because OMS_BOOT adopts canonical wholesale. The old text told both do not reload, OMS keeps checking - false comfort in the second case, and in the first it steered people away from the only recovery that worked while the reconciler was inert.\n\n(5) THE TESTS NOW RUN THE CLOCK. Every previous assertion about the reconciler was a regex over source text, and one of them asserted the presence of the exact condition that disabled it. It could not have been otherwise: the smoke harness stubs setTimeout to a no-op, so no timer-driven code in this artifact had ever been executed by any test. The suite now loads the artifact a second time into its own context with a drivable clock and a scriptable gateway. Against the previous artifact the new assertions fail rather than pass, which is the only reason to trust them.\n\nNOT FIXED HERE, and named so it is not forgotten: any save made while a batch is unconfirmed re-sends that whole batch, because OMS_BASE advances only on a confirmed sync. That is what produced 51 of the 53 records in conflicts/unresolved - the 5 Sept 16:02 cluster is the same ten operations twice, thirteen seconds apart, in identical order. No data was lost, but it doubles gateway writes exactly when the consolidator is already struggling. Next.'},
  {rev:35,date:'2026-09-06',summary:'Rev 35 (client). Unsynced now resolves itself, Add note reaches the form people actually use, and out-of-office stops crowding the calendar. (1) A SAVE THAT SAYS UNSYNCED NO LONGER NEEDS A RELOAD: OMS_WAIT_FOR polled for canonical confirmation for 24 seconds and then threw. The catch set Unsynced and nothing checked again, so a confirmation arriving even a second later went unnoticed until somebody reloaded the page by hand. On 6 Sept a consolidator that was not triggered for eight minutes left a real save showing Unsynced while the work was already in canonical - never at risk, but there was no way to learn that from the screen. The 24-second wait is now the first attempt rather than the only one: whenever a sync ends in Unsynced a reconciler keeps checking every three seconds until canonical catches up, then adopts it, clears the banner and reports Save confirmed on its own. It NEVER adopts canonical while unsaved edits exist, because adoption replaces state wholesale and would destroy work in progress; it waits and lets the next save own the outcome. It stops the moment a new sync begins so the two cannot race, and an expired session ends it rather than retrying forever, because waiting cannot fix that. The banner now says so instead of leaving people to guess. (2) ADD NOTE IS ON THE TASK FORM: Rev 34 shipped the attributed-note control on SOPs only while the User Guide described it as though it were everywhere, so the form where notes are actually written did not have it. Gate check 12 passed because the function existed and the text existed; it ties text to code and cannot see that a control is unreachable from the screen the text describes. Smoke now asserts reachability on both forms, which is the layer that can. (3) OUT OF OFFICE IS NOT A MEETING: fifteen EB OOO rows, one per day, cover a multi-week absence and sat among the meetings. They are hidden by default with a chip to bring them back, and the guide says so rather than leaving the calendar looking wrong. Also replaced a brittle smoke assertion that matched a distance rather than a structure and failed when an unrelated function grew. Smoke is 458 assertions, up from 444.'},
  {rev:34,date:'2026-09-06',summary:'Rev 34 (client). The four remaining register items, each built on what already existed rather than on a new collection. (1) OMS-041 STANDING VERSUS BESPOKE: the register asked for a filter taxonomy. It is not a taxonomy - a Chairs meeting is both functional-category Chairs and cadence-standing, so folding cadence into category would have doubled twelve categories to twenty-four and made the Other backlog worse. The recurring flag has carried this axis since Rev 17 and nothing surfaced it. Calendars now has Standing only and One-off only chips that filter on it; click the same chip again to go back to everything. No new field, no new category. (2) OMS-028 SOP REVIEW DATES AND OWNERS: SOPs carried process, owner, link and notes, and only five of thirty-two had ever been edited in OMS - it was working as a link list. A Review due date now shows in the SOPs table and anything past its date is flagged Overdue, because a review date nobody sees is a field nobody fills in. The owner runs through the same resolution ladder tasks use, so a name matching two people is refused rather than guessed at; display and email names diverge at Advocate and a wrong guess sends a review reminder to the wrong person. No status field was added: all thirty-two lack one and nobody has asked. (3) OMS-015 NOTES STOP OVERWRITING EACH OTHER: notes is a single string replaced on save, so two people working one record silently lost one of the two - the conflict check sees one field change, which is exactly what it expects. Threaded comments were rejected: a new collection is a new sync surface and another place for records to arrive without ids, the failure that hid in gw and rob for eleven revisions. Add note appends a line stamped with your name and the date and touches nothing already there. A first cut called omsActorName() with no argument, which always returns empty, so every stamp read as an attribution with no attributor; omsMe now resolves the signed-in person and no name means no claim rather than a dangling separator. (4) OMS-029 LOG A COMMUNICATION OMS DID NOT SEND: most of this already existed - OMS drafts an email, opens it and records that a person sent it. The gap was the call, the forwarded thread, the corridor conversation, which left no trace. The Notification Queue now takes a logged entry with who, how, when and what, inline in that dialog because a second modal would destroy the first. Logged entries offer no draft button, having already been sent. Smoke is 444 assertions, up from 424; four new check-12 bindings.'},
  {rev:33,date:'2026-09-06',summary:'Rev 33 (client). One category vocabulary, shared by both calendar importers, plus a plain statement of what access levels do and do not control. (1) IMPORTED EVENTS ARE CATEGORIZED: Ari\'s Dean\'s Office Events workbook has a Category column with a validation list, and it is 80 percent blank - 145 of 182 rows, and 18 of the 37 that are filled say \'Other\'. Only 19 rows carried a usable category, which is why 183 of 255 events in canonical sat in Other and the calendar filters filtered almost nothing. A title-based deriver already existed but ran for Maggie\'s Key Dates import only, because that sheet is a twelve-month text grid with no category column at all. The same deriver now runs on Ari\'s blanks, extended with rules for CAO Rounds, HA/HS, out-of-office and observed holidays. Measured by running this build\'s own code over her real workbook: 121 of 182 rows (66 percent) are now categorized without anyone typing anything, leaving 61 that need a human. (2) THE WORKBOOK VOCABULARY IS TRANSLATED, NOT COPIED: the spreadsheet offers \'School of Medicine Events\' and \'Chair Meetings\'; OMS stores \'SOM Events\' and \'Chairs\'. The importer passed the cell straight through, so the moment that column was filled in properly OMS would have gained both spellings side by side - the overlapping-taxonomy problem OMS-016 is named after, manufactured by the tool meant to fix it. The User Guide already listed those exact two pairs as examples of near-duplicates to merge by hand. An alias table now maps them on the way in, tolerant of case, padding and curly apostrophes, and an unrecognized category is kept exactly as typed rather than forced to Other, because a category nobody has used yet is legitimate. (3) ONE READ TIER, SAID PLAINLY: editing and admin actions are enforced at the gateway, not merely hidden - a read-only account\'s changes are refused with 403 whatever the screen shows. Reading is not segmented: every account that can sign in receives all of canonical state. The guide now says so, and says what follows - anything a read-only colleague must not see does not belong in OMS at all. Smoke is 424 assertions, up from 401; three new check-12 bindings tie the derivation, the alias table and the read-tier statement to the code behind them.'},
  {rev:32,date:'2026-09-06',summary:'Rev 32 (client). The Add User button now issues a sign-in account, and the release gate ties descriptive text to the code it describes. (1) ADD USER CREATES A WORKING ACCOUNT: the button wrote a directory entry and stopped, so somebody could be added and still be unable to sign in - the sign-in had to be issued afterwards from a separate control. Add User now offers \'Also create a sign-in account\', ticked by default, with an initial password that fills in from the name and can be typed over. The account is created FIRST and the directory entry only if that succeeds, so a failure leaves nobody half-added. The credential is shown once, in clear, to be read out; the holder must change it before they can use OMS. Unticking the box still adds a directory-only person for somebody who needs to be assignable and nothing more. Editing an existing person never mints a second account. (2) GATE CHECK 12 - TEXT MUST MATCH CODE: the guide check hashes the User Guide, which proves it changed, not that it became true. Check 12 binds declared phrases to the code behind them in three directions: text requires code, code requires text, and text forbidden while code exists. It found three live false claims on its first run - the Admin nav tooltip and the Add User tooltip both still said sign-in accounts were issued elsewhere, and the guide had no description of what Add User does. All three are fixed here. (3) A VACUOUS GUARD REMOVED: the negative suite proved one binding was satisfied by a comment recording the deleted function\'s removal, not by an implementation; binding values on the code side are now code-shaped. Smoke is 401 assertions, up from 376, and the new ones are mutation-tested: reordering the account and directory writes, swallowing a gateway failure, or dropping the lowercase on the sign-in id each break the suite.'},
  {rev:31,date:'2026-09-06',summary:'Rev 31 (client). A suggested password that can be read out loud.\n\nClare Il\'Giovine yielded Il\'Giovine-OMS-2026!, which cannot be dictated over the phone without spelling the punctuation. The surname behind a suggested password is now reduced to plain letters with a single leading capital, so it becomes Ilgiovine-OMS-2026! and Anne-Marie O\'Brien would become Obrien-OMS-2026!.\n\nEvery other surname in the directory is unchanged by this - Elsaie, Scirica, Ball, Woodside, Ozokwelu, Darling, Westgate - because they are already plain letters. Verified across all of them rather than assumed. Anybody whose password is already set is unaffected either way; this only shapes what a new account is suggested.\n\nTHE POINT OF DOING IT AS A NAMED FUNCTION. The same derivation exists in the gateway\'s make-users.mjs, which is the other route by which an account can be issued. If the two drift, the same person gets a different password depending on which one issued it. So the client\'s copy is now a named function rather than an expression buried in a template, its expected output is asserted for six names including both apostrophe cases, and the two implementations were run side by side against ten names to confirm they agree. That check is a one-off rather than part of the suite, because the two live in different repositories - which is itself the weakness, and is recorded as such.\n\nThis is a suggestion in an editable field, not a rule. An administrator can type whatever they like; the twelve-character minimum is enforced by the gateway either way.'},
  {rev:30,date:'2026-09-06',summary:'Rev 30 (client). Sign-in accounts in the Admin Console, and the directory kept in step with them.\n\nThe console has always managed the People DIRECTORY - who work can be assigned to and where notifications go. It now also manages sign-in accounts, through the gateway endpoint added alongside this. The two remain different things, and the screen says which is which: somebody can be assignable without being able to log in, and usually should be.\n\nA new Sign-in column reads Can sign in, Must set password when they have not yet changed the one issued to them, Sign-in disabled, or No sign-in for a directory entry with no account. Until the account list has loaded it reads unknown rather than No sign-in, because guessing would be worse than waiting.\n\nCreate sign-in requires an email address, since that address IS the sign-in id. The first password is set by the administrator and shown once in clear so it can be read out; the holder must change it before they can use OMS. Reset password re-arms that requirement, because a password an administrator chose is a password an administrator knows.\n\nTHE PART THAT MATTERED MOST. Deactivating somebody in the directory now blocks their sign-in, and removing them removes it. Previously deactivate flipped a directory flag and nothing else, so a person marked Deactivated could still log in - which reads as revoked access and was not. Offering account creation without fixing that would have been a worse trap than offering neither.\n\nThe lockout guards live in the gateway and are tested there: an administrator cannot disable or delete their own account, and the last active administrator cannot be disabled or deleted, with a disabled admin not counting as cover. Each of those leaves nobody able to undo the mistake.\n\nThe client never sees a salt or a hash - the listing endpoint does not return them - and it cannot set mustChangePassword, which only the gateway writes.\n\nAlso corrects a line in the admin guide added in Rev 29 which said issuing a password was not something the console could do. That was true when written this afternoon and is false as of this release. Caught before shipping this time rather than after.\n\nTesting is 365 smoke assertions and 125 render assertions on the client, plus 60 on the gateway credential and account paths.'},
  {rev:29,date:'2026-09-06',summary:'Rev 29 (client). Tooltips and guide text that had stopped being true.\n\nTooltips were written once and never maintained across eleven revisions. Most had simply gone incomplete. Three actively misled, and one of those instructed the exact action that caused the most severe defect this system has had.\n\nTHE DANGEROUS ONE. The Cadence nav tooltip still read Single-click a cell to cycle status. That behavior was REMOVED in Rev 14 because a double-click fires two single clicks first, so following the on-screen instruction advanced the status twice before the editor opened - OMS-003, which corrupted status on every documented edit across 84 live cells. The tooltip was still teaching it. The User Guide contradicted itself on the same point: its screen-by-screen section said single click cycles status while its troubleshooting section said the opposite. Both now say what the code does.\n\nTWO CONTROLS THAT CLAIMED THINGS THAT WERE FALSE (OPS-027). The Admin Console offered Temp PW, whose tooltip promised the user must set a new password on next login. It did nothing of the kind: it wrote a plaintext password onto a People DIRECTORY record while authentication reads OMS_USERS_JSON in the gateway and never consults that collection, so the password it produced could not sign anybody in. Three faults in one control - it did nothing, it put a password-shaped secret into shared state that every signed-in user can read through /api/state, and it generated that secret with Math.random(). It is DELETED rather than relabeled, along with the plaintext field on the add-user path. The add-user form now says plainly that it creates a directory entry and not a sign-in account, which is the truth.\n\nMERELY STALE, now current: the task tooltips omitted Category and Waiting on, both of which exist; the event tooltip omitted End Date, End Time and the Cadence flag from Rev 17; the Categories tooltip said renaming updates every event, understating it since Rev 23 made a rename move tasks too; the Tasks tab tooltip listed only status and owner filters.\n\nTwo controls added in Rev 23 had no tooltip at all: the category filter used a bare title attribute rather than the tooltip system, and the sortable column headers said nothing about what a click does.\n\nA guard now fails the build if anything reintroduces the single-click instruction or a live tempPassword reference. Writing that guard took two attempts: the first matched the word tempPassword in a comment explaining its removal, which is exactly how a guard earns a reputation for crying wolf and gets switched off.'},
  {rev:28,date:'2026-09-06',summary:'Rev 28 (client). The sign-in half of the forced password change, and the guide for it.\n\nINERT UNTIL THE GATEWAY LANDS, and safe to ship first. The client acts only when the sign-in service reports mustChangePassword. Until CAO-OMS-Gateway PR #6 is deployed that field does not exist, the value is undefined, and sign-in behaves exactly as it does today. Nothing here can lock anybody out on its own.\n\nWHY IT MATTERS. Initial passwords are issued as surname-OMS-2026!, which anyone who knows the pattern can guess. That is acceptable only because the holder must change it before using OMS, so the forced change is the control that makes the scheme safe rather than a convenience.\n\nWHAT IT DOES. A flagged account is held at a change-password screen with no way past it. The new password must be at least twelve characters, must match its confirmation, and must differ from the one issued. On success the session and stored user are cleared and the person signs in again with the new password - deliberately, because it proves the new password works before anyone depends on it.\n\nAn existing session carrying the flag is cleared rather than honored, so a session opened before the change cannot be used to skip it. The password issued is held in memory only for the length of the exchange, because the gateway requires the current password: a stolen session alone must not be enough to lock the real owner out of their own account.\n\nUSER GUIDE, all three levels. Everybody signs in, so the read-only and editor guides gain a plain-language section saying the password is temporary, what to choose, and that nobody can look up an existing one. The admin guide additionally records that issuing a new temporary password is NOT something the Admin Console can do - the user list there is the People directory, and sign-in accounts are separate.\n\nTesting is 355 smoke assertions and 104 render assertions on the client, plus 24 on the gateway credential path in its own PR. One en-GB spelling of my own was caught by the artifact\'s guard before release.'},
  {rev:27,date:'2026-09-06',summary:'Rev 27 (client). One source of truth for the OMS email subject line, and a defect it was hiding.\n\nRev 19 set the standard: OMS | HIGH PRIORITY | Due date | kind | task | owner, with HIGH PRIORITY inserted only when the task is high priority and the due date placed before the title because mail clients cut the subject after roughly sixty characters.\n\nRev 24 added handoff and reminder drafts and built their subjects INLINE rather than through notificationSubject. That put the standard in three places, and both new ones silently dropped the HIGH PRIORITY marker. The consequence was not cosmetic: an urgent task could be nudged, or handed off, with a subject that looked routine, which is precisely the case the marker exists for. Found by printing every subject the shipped build can produce rather than by reading the code.\n\nAll four kinds now come from one builder, omsSubject(kind, task). notificationSubject remains for its existing callers and delegates rather than duplicating. A guard asserts that exactly ONE place in the artifact constructs a subject, so the three-copy drift cannot recur.\n\nOne visible change beyond the fix: handoff and reminder subjects now place the kind after the due date, matching assignment subjects. They previously read OMS | Ready to start | Due ..., which was a fourth variation on the standard.\n\nNot on the sync path: OMS_SYNC_ONCE and OMS_SANITIZE both verified byte for byte unchanged. Testing is 355 smoke assertions plus 104 across four render harnesses. Two of my own assertions were corrected in the process - one encoded the older inconsistent subject order, and one assumed a fixture task was high priority when it is medium.'},
  {rev:26,date:'2026-09-06',summary:'Rev 26 (client). A User Guide that matches the reader\'s access level, and one identity on every draft.\n\nROLE-AWARE USER GUIDE (OMS-044, new). There are now three guides rather than one with sections hidden, chosen by the signed-in role. The distinction that matters: a read-only account being shown how to add a task, or how to recover from a failed save it can never cause, is not merely noise - it teaches steps the reader will be refused when they try them. So the read-only guide omits Sync pending, Unsynced, the Admin Console and every Add path, and instead says plainly what the account can do, which is see everything and print anything. The editor guide is written for somebody who has never heard of a revision or a sync state and does not need to: it covers adding and changing, assigning an owner, what the save indicator actually means, categories, dependencies, reminders and notifications, in plain language. The admin guide keeps every technical detail unchanged, because an admin is the person who needs it.\n\nThe guide cache is now keyed on role. It was a single global, which after this change would have served one role the other role\'s guide - asserted against.\n\nMAIL IDENTITY (OMS-031, DEC-016). Display name CAO-OMS and Reply-To hossam.elsaie@advocatehealth.org were agreed. One constraint is worth stating rather than papering over: with the relay closed as Won\'t Do (DEC-014), every OMS email is a manual draft composed in the sending mailbox, so the From name belongs to Exchange and the client cannot set it - a literal CAO-OMS display name needs a shared mailbox or a Send As grant from Advocate IT. The body is the part OMS does control, so every draft now closes with a block naming CAO-OMS, Dean\'s Office as the sender and giving the reply address explicitly. A recipient can tell a system message from the Dean writing personally, and knows where to reply. Assignment, reassignment, handoff and reminder drafts all share one sign-off constant rather than four copies of the text.\n\nNot on the sync path: OMS_SYNC_ONCE and OMS_SANITIZE are both verified byte for byte unchanged before the file is written. Testing is 345 smoke assertions plus 102 across four render harnesses.'},
  {rev:25,date:'2026-09-06',summary:'Rev 25 (client). Two register items that were sized L and were actually S, because the data already existed and nothing read it.\n\nEDITOR ATTRIBUTION (OMS-022). Records now say who last edited them. Open a Task or an Event and a line under Notes reads Last edited by name on date. This was never new information: the consolidator has stamped _updatedBy and _updatedAt on every record it writes since the collection existed, and they are present on 256 of 256 events and 17 of 18 tasks. OMS_SANITIZE strips them from the sync payload, which is correct because they are server-owned and must never round-trip back as a client edit, but ST keeps them, so this was always one render away. The patch verifies OMS_SANITIZE is byte for byte unchanged, so displaying the stamp cannot have started sending it back.\n\nResolution is written to survive OMS-043. Today the account id is a slug that happens to match a person id; after the move to email sign-in it becomes an address, so both forms are checked, and the email case-insensitively because the directory stores Margaret.Scirica and Ariana.Ball with capitals. An actor that cannot be resolved shows the raw account id rather than a blank, deliberately: a blank would suggest nobody edited the record, which would be false.\n\nEDIT HISTORY (OMS-021). assignmentHistory has been written on every owner change for the life of the collection and read by absolutely nothing - zero references in the shipped artifact. A Task that has changed owner now shows its full trail inside its own dialog: when, whether it was a first assignment or a reassignment, and to whom. The Admin Console carries the same trail across every task, next to the Revision Log. The history is sorted on a COPY, because assignmentHistory is a synced collection and reordering it in place would show as an edit to every record in it.\n\nThe task dialog renders history INLINE rather than in a second dialog, because openModal replaces #mbody and a second overlay would destroy the task being edited.\n\nNeither item adds tracking. Both are a read of what was already stored. Not on the sync path: OMS_SYNC_ONCE and OMS_SANITIZE are both verified unchanged before the file is written. Testing is now 331 smoke assertions plus 52 render assertions across two harnesses.'},
  {rev:24,date:'2026-09-06',summary:'Rev 24 (client). Three register items that are really one theme: what happens next.\n\nDEPENDENCIES (OMS-013). A task can now wait on another task. While the prerequisite is open the dependent shows as Blocked rather than Not Started, so it is visible that nobody can start it yet - the visible-but-blocked model, per DEC-003. Blocked outranks Overdue in the badge when both apply, because the actionable fact is that the work cannot begin; the due date cell still renders red so lateness is not hidden. Only the DIRECT prerequisite is consulted, which makes a dependency cycle structurally impossible rather than merely unlikely - there is no recursion to run away, and a chain still behaves correctly because completing the middle task unblocks the last. A prerequisite that is Retired counts as closed exactly like Complete, so work that was dropped cannot freeze whatever was waiting on it for ever; a deleted prerequisite is treated the same way, and deleting a task now clears the reference from its dependents the way deleting an Event clears sourceEventId.\n\nHANDOFF (OMS-014). Completing a task queues a notification draft for the owner of anything that was waiting on it. This is the remarks-to-slides handoff DEC-003 asked for. It fires on the TRANSITION into Complete, not on the state, so re-saving a finished task does not send the same handoff again.\n\nREMINDERS (OMS-006). A Remind button on Tasks shows how many tasks are due in the next three days and queues a draft for each, after listing what it will create. Deliberately NOT run on load: creating notifications when somebody merely opens OMS is a write on a read - it would sync on every page view, and two people opening it at once would race to create the same reminder. Already-overdue work is excluded because it has its own surface and a reminder about it would be noise, and an owner with no address is excluded because no notification could be created for them. Reminders are keyed on task AND due date, so clicking twice creates nothing while moving a due date earns a fresh one.\n\nConsistent with DEC-002 throughout: everything here creates a reviewed draft, nothing sends itself. Not on the sync path - OMS_SYNC_ONCE is byte for byte unchanged and the patch verifies that before writing. Testing is now 304 smoke assertions plus a separate render harness that reads the markup the code actually produces. That harness caught two of my own assertions being wrong before they could mislead: both matched the words Overdue and Blocked in the filter chips, which always render, rather than in the table body.'},
