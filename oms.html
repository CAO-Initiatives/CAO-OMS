/* ─── REVISION LOG ─── */
const OMS_REV_LOG=[
  {rev:34,date:'2026-09-06',summary:'Rev 34 (client). The four remaining register items, each built on what already existed rather than on a new collection. (1) OMS-041 STANDING VERSUS BESPOKE: the register asked for a filter taxonomy. It is not a taxonomy - a Chairs meeting is both functional-category Chairs and cadence-standing, so folding cadence into category would have doubled twelve categories to twenty-four and made the Other backlog worse. The recurring flag has carried this axis since Rev 17 and nothing surfaced it. Calendars now has Standing only and One-off only chips that filter on it; click the same chip again to go back to everything. No new field, no new category. (2) OMS-028 SOP REVIEW DATES AND OWNERS: SOPs carried process, owner, link and notes, and only five of thirty-two had ever been edited in OMS - it was working as a link list. A Review due date now shows in the SOPs table and anything past its date is flagged Overdue, because a review date nobody sees is a field nobody fills in. The owner runs through the same resolution ladder tasks use, so a name matching two people is refused rather than guessed at; display and email names diverge at Advocate and a wrong guess sends a review reminder to the wrong person. No status field was added: all thirty-two lack one and nobody has asked. (3) OMS-015 NOTES STOP OVERWRITING EACH OTHER: notes is a single string replaced on save, so two people working one record silently lost one of the two - the conflict check sees one field change, which is exactly what it expects. Threaded comments were rejected: a new collection is a new sync surface and another place for records to arrive without ids, the failure that hid in gw and rob for eleven revisions. Add note appends a line stamped with your name and the date and touches nothing already there. A first cut called omsActorName() with no argument, which always returns empty, so every stamp read as an attribution with no attributor; omsMe now resolves the signed-in person and no name means no claim rather than a dangling separator. (4) OMS-029 LOG A COMMUNICATION OMS DID NOT SEND: most of this already existed - OMS drafts an email, opens it and records that a person sent it. The gap was the call, the forwarded thread, the corridor conversation, which left no trace. The Notification Queue now takes a logged entry with who, how, when and what, inline in that dialog because a second modal would destroy the first. Logged entries offer no draft button, having already been sent. Smoke is 444 assertions, up from 424; four new check-12 bindings.'},
  {rev:33,date:'2026-09-06',summary:'Rev 33 (client). One category vocabulary, shared by both calendar importers, plus a plain statement of what access levels do and do not control. (1) IMPORTED EVENTS ARE CATEGORIZED: Ari\'s Dean\'s Office Events workbook has a Category column with a validation list, and it is 80 percent blank - 145 of 182 rows, and 18 of the 37 that are filled say \'Other\'. Only 19 rows carried a usable category, which is why 183 of 255 events in canonical sat in Other and the calendar filters filtered almost nothing. A title-based deriver already existed but ran for Maggie\'s Key Dates import only, because that sheet is a twelve-month text grid with no category column at all. The same deriver now runs on Ari\'s blanks, extended with rules for CAO Rounds, HA/HS, out-of-office and observed holidays. Measured by running this build\'s own code over her real workbook: 121 of 182 rows (66 percent) are now categorized without anyone typing anything, leaving 61 that need a human. (2) THE WORKBOOK VOCABULARY IS TRANSLATED, NOT COPIED: the spreadsheet offers \'School of Medicine Events\' and \'Chair Meetings\'; OMS stores \'SOM Events\' and \'Chairs\'. The importer passed the cell straight through, so the moment that column was filled in properly OMS would have gained both spellings side by side - the overlapping-taxonomy problem OMS-016 is named after, manufactured by the tool meant to fix it. The User Guide already listed those exact two pairs as examples of near-duplicates to merge by hand. An alias table now maps them on the way in, tolerant of case, padding and curly apostrophes, and an unrecognized category is kept exactly as typed rather than forced to Other, because a category nobody has used yet is legitimate. (3) ONE READ TIER, SAID PLAINLY: editing and admin actions are enforced at the gateway, not merely hidden - a read-only account\'s changes are refused with 403 whatever the screen shows. Reading is not segmented: every account that can sign in receives all of canonical state. The guide now says so, and says what follows - anything a read-only colleague must not see does not belong in OMS at all. Smoke is 424 assertions, up from 401; three new check-12 bindings tie the derivation, the alias table and the read-tier statement to the code behind them.'},
  {rev:32,date:'2026-09-06',summary:'Rev 32 (client). The Add User button now issues a sign-in account, and the release gate ties descriptive text to the code it describes. (1) ADD USER CREATES A WORKING ACCOUNT: the button wrote a directory entry and stopped, so somebody could be added and still be unable to sign in - the sign-in had to be issued afterwards from a separate control. Add User now offers \'Also create a sign-in account\', ticked by default, with an initial password that fills in from the name and can be typed over. The account is created FIRST and the directory entry only if that succeeds, so a failure leaves nobody half-added. The credential is shown once, in clear, to be read out; the holder must change it before they can use OMS. Unticking the box still adds a directory-only person for somebody who needs to be assignable and nothing more. Editing an existing person never mints a second account. (2) GATE CHECK 12 - TEXT MUST MATCH CODE: the guide check hashes the User Guide, which proves it changed, not that it became true. Check 12 binds declared phrases to the code behind them in three directions: text requires code, code requires text, and text forbidden while code exists. It found three live false claims on its first run - the Admin nav tooltip and the Add User tooltip both still said sign-in accounts were issued elsewhere, and the guide had no description of what Add User does. All three are fixed here. (3) A VACUOUS GUARD REMOVED: the negative suite proved one binding was satisfied by a comment recording the deleted function\'s removal, not by an implementation; binding values on the code side are now code-shaped. Smoke is 401 assertions, up from 376, and the new ones are mutation-tested: reordering the account and directory writes, swallowing a gateway failure, or dropping the lowercase on the sign-in id each break the suite.'},
  {rev:31,date:'2026-09-06',summary:'Rev 31 (client). A suggested password that can be read out loud.\n\nClare Il\'Giovine yielded Il\'Giovine-OMS-2026!, which cannot be dictated over the phone without spelling the punctuation. The surname behind a suggested password is now reduced to plain letters with a single leading capital, so it becomes Ilgiovine-OMS-2026! and Anne-Marie O\'Brien would become Obrien-OMS-2026!.\n\nEvery other surname in the directory is unchanged by this - Elsaie, Scirica, Ball, Woodside, Ozokwelu, Darling, Westgate - because they are already plain letters. Verified across all of them rather than assumed. Anybody whose password is already set is unaffected either way; this only shapes what a new account is suggested.\n\nTHE POINT OF DOING IT AS A NAMED FUNCTION. The same derivation exists in the gateway\'s make-users.mjs, which is the other route by which an account can be issued. If the two drift, the same person gets a different password depending on which one issued it. So the client\'s copy is now a named function rather than an expression buried in a template, its expected output is asserted for six names including both apostrophe cases, and the two implementations were run side by side against ten names to confirm they agree. That check is a one-off rather than part of the suite, because the two live in different repositories - which is itself the weakness, and is recorded as such.\n\nThis is a suggestion in an editable field, not a rule. An administrator can type whatever they like; the twelve-character minimum is enforced by the gateway either way.'},
  {rev:30,date:'2026-09-06',summary:'Rev 30 (client). Sign-in accounts in the Admin Console, and the directory kept in step with them.\n\nThe console has always managed the People DIRECTORY - who work can be assigned to and where notifications go. It now also manages sign-in accounts, through the gateway endpoint added alongside this. The two remain different things, and the screen says which is which: somebody can be assignable without being able to log in, and usually should be.\n\nA new Sign-in column reads Can sign in, Must set password when they have not yet changed the one issued to them, Sign-in disabled, or No sign-in for a directory entry with no account. Until the account list has loaded it reads unknown rather than No sign-in, because guessing would be worse than waiting.\n\nCreate sign-in requires an email address, since that address IS the sign-in id. The first password is set by the administrator and shown once in clear so it can be read out; the holder must change it before they can use OMS. Reset password re-arms that requirement, because a password an administrator chose is a password an administrator knows.\n\nTHE PART THAT MATTERED MOST. Deactivating somebody in the directory now blocks their sign-in, and removing them removes it. Previously deactivate flipped a directory flag and nothing else, so a person marked Deactivated could still log in - which reads as revoked access and was not. Offering account creation without fixing that would have been a worse trap than offering neither.\n\nThe lockout guards live in the gateway and are tested there: an administrator cannot disable or delete their own account, and the last active administrator cannot be disabled or deleted, with a disabled admin not counting as cover. Each of those leaves nobody able to undo the mistake.\n\nThe client never sees a salt or a hash - the listing endpoint does not return them - and it cannot set mustChangePassword, which only the gateway writes.\n\nAlso corrects a line in the admin guide added in Rev 29 which said issuing a password was not something the console could do. That was true when written this afternoon and is false as of this release. Caught before shipping this time rather than after.\n\nTesting is 365 smoke assertions and 125 render assertions on the client, plus 60 on the gateway credential and account paths.'},
  {rev:29,date:'2026-09-06',summary:'Rev 29 (client). Tooltips and guide text that had stopped being true.\n\nTooltips were written once and never maintained across eleven revisions. Most had simply gone incomplete. Three actively misled, and one of those instructed the exact action that caused the most severe defect this system has had.\n\nTHE DANGEROUS ONE. The Cadence nav tooltip still read Single-click a cell to cycle status. That behavior was REMOVED in Rev 14 because a double-click fires two single clicks first, so following the on-screen instruction advanced the status twice before the editor opened - OMS-003, which corrupted status on every documented edit across 84 live cells. The tooltip was still teaching it. The User Guide contradicted itself on the same point: its screen-by-screen section said single click cycles status while its troubleshooting section said the opposite. Both now say what the code does.\n\nTWO CONTROLS THAT CLAIMED THINGS THAT WERE FALSE (OPS-027). The Admin Console offered Temp PW, whose tooltip promised the user must set a new password on next login. It did nothing of the kind: it wrote a plaintext password onto a People DIRECTORY record while authentication reads OMS_USERS_JSON in the gateway and never consults that collection, so the password it produced could not sign anybody in. Three faults in one control - it did nothing, it put a password-shaped secret into shared state that every signed-in user can read through /api/state, and it generated that secret with Math.random(). It is DELETED rather than relabeled, along with the plaintext field on the add-user path. The add-user form now says plainly that it creates a directory entry and not a sign-in account, which is the truth.\n\nMERELY STALE, now current: the task tooltips omitted Category and Waiting on, both of which exist; the event tooltip omitted End Date, End Time and the Cadence flag from Rev 17; the Categories tooltip said renaming updates every event, understating it since Rev 23 made a rename move tasks too; the Tasks tab tooltip listed only status and owner filters.\n\nTwo controls added in Rev 23 had no tooltip at all: the category filter used a bare title attribute rather than the tooltip system, and the sortable column headers said nothing about what a click does.\n\nA guard now fails the build if anything reintroduces the single-click instruction or a live tempPassword reference. Writing that guard took two attempts: the first matched the word tempPassword in a comment explaining its removal, which is exactly how a guard earns a reputation for crying wolf and gets switched off.'},
  {rev:28,date:'2026-09-06',summary:'Rev 28 (client). The sign-in half of the forced password change, and the guide for it.\n\nINERT UNTIL THE GATEWAY LANDS, and safe to ship first. The client acts only when the sign-in service reports mustChangePassword. Until CAO-OMS-Gateway PR #6 is deployed that field does not exist, the value is undefined, and sign-in behaves exactly as it does today. Nothing here can lock anybody out on its own.\n\nWHY IT MATTERS. Initial passwords are issued as surname-OMS-2026!, which anyone who knows the pattern can guess. That is acceptable only because the holder must change it before using OMS, so the forced change is the control that makes the scheme safe rather than a convenience.\n\nWHAT IT DOES. A flagged account is held at a change-password screen with no way past it. The new password must be at least twelve characters, must match its confirmation, and must differ from the one issued. On success the session and stored user are cleared and the person signs in again with the new password - deliberately, because it proves the new password works before anyone depends on it.\n\nAn existing session carrying the flag is cleared rather than honored, so a session opened before the change cannot be used to skip it. The password issued is held in memory only for the length of the exchange, because the gateway requires the current password: a stolen session alone must not be enough to lock the real owner out of their own account.\n\nUSER GUIDE, all three levels. Everybody signs in, so the read-only and editor guides gain a plain-language section saying the password is temporary, what to choose, and that nobody can look up an existing one. The admin guide additionally records that issuing a new temporary password is NOT something the Admin Console can do - the user list there is the People directory, and sign-in accounts are separate.\n\nTesting is 355 smoke assertions and 104 render assertions on the client, plus 24 on the gateway credential path in its own PR. One en-GB spelling of my own was caught by the artifact\'s guard before release.'},
  {rev:27,date:'2026-09-06',summary:'Rev 27 (client). One source of truth for the OMS email subject line, and a defect it was hiding.\n\nRev 19 set the standard: OMS | HIGH PRIORITY | Due date | kind | task | owner, with HIGH PRIORITY inserted only when the task is high priority and the due date placed before the title because mail clients cut the subject after roughly sixty characters.\n\nRev 24 added handoff and reminder drafts and built their subjects INLINE rather than through notificationSubject. That put the standard in three places, and both new ones silently dropped the HIGH PRIORITY marker. The consequence was not cosmetic: an urgent task could be nudged, or handed off, with a subject that looked routine, which is precisely the case the marker exists for. Found by printing every subject the shipped build can produce rather than by reading the code.\n\nAll four kinds now come from one builder, omsSubject(kind, task). notificationSubject remains for its existing callers and delegates rather than duplicating. A guard asserts that exactly ONE place in the artifact constructs a subject, so the three-copy drift cannot recur.\n\nOne visible change beyond the fix: handoff and reminder subjects now place the kind after the due date, matching assignment subjects. They previously read OMS | Ready to start | Due ..., which was a fourth variation on the standard.\n\nNot on the sync path: OMS_SYNC_ONCE and OMS_SANITIZE both verified byte for byte unchanged. Testing is 355 smoke assertions plus 104 across four render harnesses. Two of my own assertions were corrected in the process - one encoded the older inconsistent subject order, and one assumed a fixture task was high priority when it is medium.'},
  {rev:26,date:'2026-09-06',summary:'Rev 26 (client). A User Guide that matches the reader\'s access level, and one identity on every draft.\n\nROLE-AWARE USER GUIDE (OMS-044, new). There are now three guides rather than one with sections hidden, chosen by the signed-in role. The distinction that matters: a read-only account being shown how to add a task, or how to recover from a failed save it can never cause, is not merely noise - it teaches steps the reader will be refused when they try them. So the read-only guide omits Sync pending, Unsynced, the Admin Console and every Add path, and instead says plainly what the account can do, which is see everything and print anything. The editor guide is written for somebody who has never heard of a revision or a sync state and does not need to: it covers adding and changing, assigning an owner, what the save indicator actually means, categories, dependencies, reminders and notifications, in plain language. The admin guide keeps every technical detail unchanged, because an admin is the person who needs it.\n\nThe guide cache is now keyed on role. It was a single global, which after this change would have served one role the other role\'s guide - asserted against.\n\nMAIL IDENTITY (OMS-031, DEC-016). Display name CAO-OMS and Reply-To hossam.elsaie@advocatehealth.org were agreed. One constraint is worth stating rather than papering over: with the relay closed as Won\'t Do (DEC-014), every OMS email is a manual draft composed in the sending mailbox, so the From name belongs to Exchange and the client cannot set it - a literal CAO-OMS display name needs a shared mailbox or a Send As grant from Advocate IT. The body is the part OMS does control, so every draft now closes with a block naming CAO-OMS, Dean\'s Office as the sender and giving the reply address explicitly. A recipient can tell a system message from the Dean writing personally, and knows where to reply. Assignment, reassignment, handoff and reminder drafts all share one sign-off constant rather than four copies of the text.\n\nNot on the sync path: OMS_SYNC_ONCE and OMS_SANITIZE are both verified byte for byte unchanged before the file is written. Testing is 345 smoke assertions plus 102 across four render harnesses.'},
  {rev:25,date:'2026-09-06',summary:'Rev 25 (client). Two register items that were sized L and were actually S, because the data already existed and nothing read it.\n\nEDITOR ATTRIBUTION (OMS-022). Records now say who last edited them. Open a Task or an Event and a line under Notes reads Last edited by name on date. This was never new information: the consolidator has stamped _updatedBy and _updatedAt on every record it writes since the collection existed, and they are present on 256 of 256 events and 17 of 18 tasks. OMS_SANITIZE strips them from the sync payload, which is correct because they are server-owned and must never round-trip back as a client edit, but ST keeps them, so this was always one render away. The patch verifies OMS_SANITIZE is byte for byte unchanged, so displaying the stamp cannot have started sending it back.\n\nResolution is written to survive OMS-043. Today the account id is a slug that happens to match a person id; after the move to email sign-in it becomes an address, so both forms are checked, and the email case-insensitively because the directory stores Margaret.Scirica and Ariana.Ball with capitals. An actor that cannot be resolved shows the raw account id rather than a blank, deliberately: a blank would suggest nobody edited the record, which would be false.\n\nEDIT HISTORY (OMS-021). assignmentHistory has been written on every owner change for the life of the collection and read by absolutely nothing - zero references in the shipped artifact. A Task that has changed owner now shows its full trail inside its own dialog: when, whether it was a first assignment or a reassignment, and to whom. The Admin Console carries the same trail across every task, next to the Revision Log. The history is sorted on a COPY, because assignmentHistory is a synced collection and reordering it in place would show as an edit to every record in it.\n\nThe task dialog renders history INLINE rather than in a second dialog, because openModal replaces #mbody and a second overlay would destroy the task being edited.\n\nNeither item adds tracking. Both are a read of what was already stored. Not on the sync path: OMS_SYNC_ONCE and OMS_SANITIZE are both verified unchanged before the file is written. Testing is now 331 smoke assertions plus 52 render assertions across two harnesses.'},
  {rev:24,date:'2026-09-06',summary:'Rev 24 (client). Three register items that are really one theme: what happens next.\n\nDEPENDENCIES (OMS-013). A task can now wait on another task. While the prerequisite is open the dependent shows as Blocked rather than Not Started, so it is visible that nobody can start it yet - the visible-but-blocked model, per DEC-003. Blocked outranks Overdue in the badge when both apply, because the actionable fact is that the work cannot begin; the due date cell still renders red so lateness is not hidden. Only the DIRECT prerequisite is consulted, which makes a dependency cycle structurally impossible rather than merely unlikely - there is no recursion to run away, and a chain still behaves correctly because completing the middle task unblocks the last. A prerequisite that is Retired counts as closed exactly like Complete, so work that was dropped cannot freeze whatever was waiting on it for ever; a deleted prerequisite is treated the same way, and deleting a task now clears the reference from its dependents the way deleting an Event clears sourceEventId.\n\nHANDOFF (OMS-014). Completing a task queues a notification draft for the owner of anything that was waiting on it. This is the remarks-to-slides handoff DEC-003 asked for. It fires on the TRANSITION into Complete, not on the state, so re-saving a finished task does not send the same handoff again.\n\nREMINDERS (OMS-006). A Remind button on Tasks shows how many tasks are due in the next three days and queues a draft for each, after listing what it will create. Deliberately NOT run on load: creating notifications when somebody merely opens OMS is a write on a read - it would sync on every page view, and two people opening it at once would race to create the same reminder. Already-overdue work is excluded because it has its own surface and a reminder about it would be noise, and an owner with no address is excluded because no notification could be created for them. Reminders are keyed on task AND due date, so clicking twice creates nothing while moving a due date earns a fresh one.\n\nConsistent with DEC-002 throughout: everything here creates a reviewed draft, nothing sends itself. Not on the sync path - OMS_SYNC_ONCE is byte for byte unchanged and the patch verifies that before writing. Testing is now 304 smoke assertions plus a separate render harness that reads the markup the code actually produces. That harness caught two of my own assertions being wrong before they could mislead: both matched the words Overdue and Blocked in the filter chips, which always render, rather than in the table body.'},
  {rev:23,date:'2026-09-06',summary:'Rev 23 (client). Four register items, in dependency order, plus one defect found while building them.\n\nCATEGORY FOR TASKS (OMS-008). Tasks now carry a Category, and deliberately the SAME list events use rather than a second one. A task created from an event inherits that event\'s category, so everything for a board meeting is findable together, and the Rev 18 rename and merge manager governs both. Three consequences had to follow or the design would have drifted: the category list is now derived from tasks as well as events, so a category used only by tasks does not vanish on reload; a rename moves tasks as well as events, so nothing is stranded on a category no longer offered; and the Categories dialog shows Events and Tasks counts side by side, with the confirmation quoting both, so the blast radius stated before a merge is the real one.\n\nSORTING (OMS-007). Title, Owner, Category, Due, Priority and Status are sortable by clicking the column heading, once for ascending and again to reverse, with an arrow marking the column in use. Priority and Status sort by meaning, not alphabetically: alphabetical priority reads High, Low, Medium, which is worse than no sorting at all. A task with no due date sorts to the bottom, because an undated task is not the most urgent thing in the office.\n\nCHECKLIST (OMS-011). Prints the tasks currently shown, grouped by the event each belongs to, with a box to tick plus owner, due date, status, category and notes. It reads from one shared definition of what is on screen, so the checklist can never disagree with the table it came from. Work not linked to an event is grouped at the end and never dropped.\n\nNEW ITEM INTAKE (OMS-001). There is now a New Item button at the top of CAO Visibility. Status is a fixed list starting at New rather than a free-text box defaulting to Pending, so new work lands in an identifiable staging bucket instead of each row spelling its own state. Required fields are enforced BEFORE the record is written: the previous code built the record and appended it unconditionally, so an empty dialog produced a blank row that then synced to canonical. Existing rows keep the status text they already hold.\n\nDEAD BUTTONS FIXED. The plus Add control on Board and on Upcoming Deadlines called the intake function with types it did not handle, so it set state and returned: the click did nothing at all, with no form and no error. Both now open a proper form, and an unhandled type says so rather than failing silently.\n\nNot on the sync path. OMS_SYNC_ONCE is byte for byte unchanged and the patch verifies that before writing. Testing grew from 189 assertions to 268: the harness now caches elements and records what is written to them, so assertions can read what the code PRODUCES rather than only what its source says. That is how the rendered column count, the sort order actually reaching the table, and the fact that an invalid intake form writes nothing are all now checked.'},
  {rev:22,date:'2026-09-06',summary:'Rev 22 (client). One vocabulary. The app called the same thing two different names depending on where you looked: the navigation tab already read Tasks, while the code, the notification wording and the Weekly Brief all still said Deliverable. Everything a user sees now says task. The notification body reads "You have been assigned a new OMS task", the label is "Task:", an untitled one is "Untitled task", the Weekly Brief section is "Tasks Due This Week" with an empty state to match, and the User Guide follows throughout. The code follows the same vocabulary: the tab id is now tasks rather than del, the nav target is go(tasks), renderTab dispatches on tasks, the render function is rTasks, and the three filter variables are taskQ, taskSt and taskOw. TWO THINGS DELIBERATELY LEFT ALONE. First, delItem and delEv keep their names, because del there abbreviates DELETE, not deliverable; renaming them would be a misreading of the abbreviation and would break every call site. A smoke assertion now pins both so a future sweep cannot take them. Second, the revision log is NOT rewritten. Earlier entries still say deliverable because that is what they said when they shipped, and an audit record that gets edited to match current vocabulary is no longer an audit record. The guard checks only outside the revision log, for exactly that reason. A smoke assertion also confirms the history is still there, so a future sweep cannot quietly erase it. Verified end to end: no stale del tab reference anywhere, the full chain from nav button through go, renderTab, rTasks and getElementById is consistent, seven historical mentions preserved in the revision log and zero outside it. One earlier assertion had to be updated rather than the code: the Rev 17 saved-views test read the old delSt variable. User Guide updated.'},
  {rev:21,date:'2026-09-06',summary:'Rev 21 (client). The sync-path release, shipped alone as agreed on 5 Sept, because OMS_SYNC_ONCE carries the id-less-record guard and is the highest-risk surface in the codebase. Two items only. (1) OMS NOW WARNS BEFORE YOU CLOSE IT WITH A SAVE IN FLIGHT. Confirmation takes twenty to thirty seconds: the change is accepted, a workflow folds it into the shared record, and only then does the status read Connected. Closing the tab in between lost the edit silently, and nothing retried it on the next load. A beforeunload guard now fires while a save is on its way, and also while earlier work is sitting unconfirmed in the local pending key that Rev 15 introduced. It stays quiet otherwise, deliberately: a prompt on every close is a prompt everybody learns to dismiss. IMPORTANTLY, THIS DID NOT REQUIRE EDITING OMS_SYNC_ONCE. The in-flight counter lives in OMS_QUEUE_SYNC, incremented when work is queued and cleared in a finally so a rejection still releases it, and the build asserts that OMS_SYNC_ONCE is byte for byte identical to the previous release. (2) CONFIRMATION IS NOTICED SOONER. OMS_WAIT_FOR slept a flat second before it looked even once, so a confirmed change could sit unnoticed for up to a second. The schedule now front-loads - 300, 300, 400, 500, 600, 800 then one second - over a longer total budget of twenty-four seconds, which also reduces spurious pending failures, since real confirmations were observed at about ten seconds. Honest expectation: the saving is under a second. The bulk of the wait is the consolidator workflow, not the poll interval. NOT IN THIS RELEASE: batching the operation POSTs. Reading lib/core.js showed that /api/operation validates a single operation object and has no array handling, so batching is a gateway change; and that the real cost is two GitHub round trips per operation, a token mint plus the write. Removing that is a gateway pull request, OPS-023, and is both cheaper and safer than parallelising a client loop over an inefficient endpoint. The operation loop therefore remains sequential, and the build asserts that too. User Guide updated.'},
  {rev:20,date:'2026-09-06',summary:'Rev 20 (client, patch). en-US spelling throughout, and a guard so the standard is enforced rather than remembered. STANDARD SET by Hossam on 6 Sept 2026: all OMS text is en-US, not en-GB. Rev 17 through 19 had introduced 19 en-GB spellings into user-facing text, all of them mine: 2 in the Calendars grid legend, which renders every time the grid is opened, 5 in the embedded User Guide, 3 in code comments and the rest in OMS_REV_LOG audit text. Every British form of the word color is now the American one, in all three letter cases, and the same for the word gray. The CSS color property was verified untouched by the sweep, since a careless replacement there would corrupt the stylesheet. A new smoke assertion fails the release on any of twenty-five en-GB spellings appearing in the artifact, and it earned its place twice within one release: first it caught an all-capitals instance the manual sweep had missed in the Rev 18 entry, and then it rejected the first draft of THIS revision-log entry, which had quoted the very spellings it was describing. The note you are reading is the corrected one. Two words are deliberately NOT in the guard list, the British spellings of center and canceled, because both can appear legitimately in imported Outlook or workbook data - a venue name, an event title - and a guard that fires on real data is a guard that gets switched off. No logic changed and nothing behaves differently; this is text only. User Guide updated.'},
  {rev:19,date:'2026-09-06',summary:'Rev 19 (client). Four changes, none of them on the sync path, which stays quarantined for its own release. (1) WEEKLY BRIEF OPENED ON THE WRONG WEEK. rBrief read ST.briefWeek, a stored canonical value, with a hardcoded fallback of 2026-06-04, and never advanced. Live canonical held 2026-06-16, twelve weeks stale, so the Brief was rendering mid-June while the stated go-live criterion was that it open on the current week. A stored week in the past is now ignored in favour of the current week; the Week of picker still selects any week for the session, so looking back at an earlier week still works, it just no longer sticks for everyone. (2) THE BRIEF HID THE WEEK\'S ACTUAL WORK. It filtered ST.events only and never read ST.tasks, so deliverables due in the displayed week were invisible. For the week of 6-12 Sept that meant two events shown and five deliverables silently omitted, including all three assignments for the 8 Sept go-live triage. Deliverables now appear under Deliverables Due This Week with owner, priority and status; Retired work is excluded, consistent with Rev 17. (3) IMPORTING A WORKBOOK NOW WARNS ABOUT CROSS-SOURCE DUPLICATES. The two calendar workbooks independently record the same real events under different titles - White Coat Ceremony - CLT against White Coat - CLT, Academic Cabinet Advance against Cabinet Advance, 2026 Wake Forest University School of Medicine State of the School against State of the School - and the import had no cross-source check, so every re-import recreated them. A same-date scan of canonical found 21 such pairs across 275 events. The import now lists what looks like a duplicate before it replaces anything, and deliberately does NOT resolve it: each workbook is canonical for its own source, so silently dropping a row would be worse than reporting the clash. Verified against ten real pairs read from canonical, all ten flagged. (4) NOTIFICATION SUBJECT STANDARD, per the 6 Sept decision. Every OMS email now leads with the OMS marker and carries a detailed summary in the subject itself: OMS | Due Tue 8 Sep 2026 | New assignment | deliverable | owner, with HIGH PRIORITY inserted directly after the marker for high-priority work. The due date is placed ahead of the title deliberately, because mail clients truncate the subject around sixty characters and the deadline is the part worth keeping; the title is the first line of the body in any case. Display name and Reply-To are NOT part of this release: OMS opens an Outlook compose deeplink that accepts only to, subject and body, so the sending identity belongs to the Power Automate relay, not to the client. User Guide updated.'},
  {rev:18,date:'2026-09-06',summary:'Rev 18 (client). User-editable event categories, and a code collision that was already live in production. (1) CATEGORIES CAN NOW BE RENAMED AND MERGED, from Calendars then Categories, editors only. Renaming rewrites every event carrying that category and goes out as ordinary update operations, because events all carry ids; the dialog shows how many events each change touches and asks for confirmation before anything is saved. Renaming a category onto a name that already exists MERGES the two, which is how near-duplicates get cleaned up: canonical revision 61 holds School of Medicine Events (8 events) alongside SOM Events (11), and Chair Meetings (1) alongside Chairs (25). A built-in category can be renamed but stays on the list afterwards, so it is always available to pick again. Nothing is written until the confirmation is accepted, and read-only accounts cannot open the dialog. (2) CATEGORY CODES NO LONGER COLLIDE. Rev 17 derived the three-letter legend code for each category in isolation, so two categories could land on the same code, and in production two did: School of Medicine Events and SOM Events BOTH rendered as SOM, across 19 events. That silently defeated the legend, whose entire purpose is that color is never the only cue for a color-blind reader. Codes are now assigned across the whole list in one deterministic pass. Built-ins keep their established codes, so ADV stays with Advocate BOD, BSM with WFUBSM BOD, BOT with WFU BOT and BRD with Board Meeting, and anything else is disambiguated against them. Every user computes the same map from the same data, so the legend agrees between browsers without anything being stored or synced. Codes cannot be set by hand, deliberately: uniqueness is then a guarantee rather than something a user has to remember to maintain. (3) A CATEGORY THAT IS NOT BUILT IN NOW GETS A REAL COLOR rather than falling back to gray. The color is derived from the name, so it is identical for every user and survives a rename. There are more categories than palette entries, so two categories can share a color; that is precisely why every color is paired with a code that cannot repeat. No change to the sync path, which stays quarantined. User Guide updated.'},
  {rev:17,date:'2026-09-06',summary:'Rev 17 (client). Seven changes, none of them on the sync path. (1) OWNER IDS BACKFILLED: every task whose owner resolves through the Rev 16 ladder now carries ownerId, so notification routing no longer depends on the display name staying put. The Rev 16 migration set ownerId only when ownerEmail was missing, so tasks that already had an address were skipped; this fills them in. It runs through the ordinary client save path - tasks all carry ids, so OMS_DIFF emits normal update operations and the audit trail is kept. An ambiguous owner string such as Hossam/Maggie is left alone rather than guessed. (2) RETIRED TASK STATUS: three tasks were closed as Complete on 5 Sept that were never delivered, so every completion figure on a Dean-facing screen overstated delivery. Retired is now a fourth status, excluded from the done numerator and from every overdue count, shown struck through in slate so it reads as withdrawn rather than done. Retired work is also no longer counted as open. While adding it, a long-standing sort defect was fixed: ord[Overdue] is 0 and the comparator read ord[x]||4, so Overdue had been sorting last among known statuses instead of first. (3) RECURRING FLAG ON EVENTS, plus a free category list. Cadence is a separate boolean, not a category value, because a category holds one value and folding cadence into it forces a false choice between Cabinet and Recurring. Categories can now be added inline from the event form; a category carried by any event is offered to everyone, which needs no new synced collection. (4) SAVED VIEWS: filter combinations on Calendars and Deliverables can be named, re-applied and deleted, stored per user in this browser. Deliberately not a synced collection. (5) AUTO-EXTENDING HORIZON: the grid now spans an unbroken run of years, so an event created beyond the loaded range extends the horizon instead of appearing as an isolated block with gaps. Capped at twelve years so one mistyped year cannot render hundreds of blocks. (6) MULTI-DAY EVENTS SPAN THE GRID: buildCalGrid filtered on a single date, so an event with an endDate rendered once, on its start date, in its start month. It now appears in every month it touches, with the day range clipped to that month and a marker on continuation months. (7) GRID LEGEND with color paired to a letter code on the pill itself, so color is never load-bearing for a color-blind reader. OMS-026 (Dean briefing export) is still blocked on the format decision and is not in this release; the three sync-path fixes remain quarantined to Rev 18. User Guide updated.'},
    {rev:16,date:'2026-09-05',summary:'Rev 16 (client). Owner resolution. (1) findPerson now works through an explicit ladder - exact name, exact email, email local-part, any name or email word, id slug, then a three-character prefix - and BINDS ONLY WHEN EXACTLY ONE PERSON MATCHES. This is what makes "Ari" reach Ari Ball and "Margaret" reach Maggie Scirica, which matters because display names and email names diverge systematically (Maggie/Margaret, Ari/Ariana), so neither a name-only nor an email-only rule was ever going to work. (2) AMBIGUITY NOW FAILS LOUDLY: a string matching two people, such as "Hossam/Maggie", blocks the save and names the candidates instead of silently picking one. (3) Adding an assignee is now a single inline First / Last / Email form inside the task dialog, replacing two chained browser prompts; all three fields are required, the address is format-checked, and an email already on file offers the existing person rather than creating a duplicate. It is inline rather than a second dialog because the app has one overlay, so a second modal would destroy the task being edited. (4) upsertPerson no longer mints id:slug(name) blindly - it appends -2, -3 and so on when a slug is taken, so two people whose names slug identically can no longer overwrite each other. User Guide updated.'},
  {rev:15,date:'2026-09-05',summary:'Rev 15 (client). Two defensive fixes; no data or layout changes. (1) SILENT-SAVE GUARD: a save that produced no syncable operation previously reported "Connected", which is how edits to id-less records were lost without warning. The sync path now checks every collection for records with no id and, when any are found, reports Unsynced with a conflict toast naming the collections, both when nothing could be sent and after an otherwise successful save. (2) OMS-005 escalated from warn to BLOCK: assigning a task to an owner with no email on file now asks for confirmation BEFORE the task is written, and cancelling stops the save entirely instead of saving a task nobody can be notified about. DATA-LAYER WORK OF 5 SEPT 2026, RECORDED HERE FOR THE AUDIT TRAIL AND NOT PART OF THIS ARTIFACT: (a) the hardened release gate shipped to CAO-OMS as a workflow-only change in four commits (scripts/release_gate.sh, gate4_preflight.py v2, data/default-state.json, oms-guide-check.yml), replacing a gate whose User Guide check accepted the bare word "Tasks"; (b) the gw and rob collections were migrated to id-bearing records by a direct edit to state/oms-state.json in CAO-OMS-Data (commit f2aecb2, snapshot 62d7b55). Until that migration neither collection had EVER synced in either direction, because OMS_MAP drops records with no id, so every CAO Visibility and Cadence grid edit had been local-only; a round-trip test now passes both ways; (c) three empty past CAO Visibility rows (2026-06-18, 2026-07-16, 2026-08-12) were deleted through the normal client path, leaving five rows with the 2026-05-21 Box link intact. User Guide updated.'},
  {rev:14,date:'2026-09-04',summary:'Cadence data-integrity fix and Rev 13 carry-over items. (1) OMS-003: removed single-click status cycling from the Cadence (RoB) grid. A double-click fired two single clicks first, so following the on-screen instruction to double-click a cell advanced its status twice before the editor opened; status is now changed only in the cell editor. (2) REV13-001: the modal header and its close control are now sticky, so the close X stays visible and operable at every scroll position in every dialog. (3) OMS-002: events now carry an optional End Date and End Time, shown in a new Ends column in Calendar list mode, with validation that the end date is not earlier than the start date; the event save path now merges onto the stored record instead of replacing it, so fields outside the edit form are no longer destroyed on edit. (4) OMS-005: assigning a task to an owner with no email on file now raises a visible warning instead of silently creating no notification. Release-gate hardening is prepared but is NOT part of this release; it ships separately as a workflow-only change. User Guide updated.'},

/* Rev 30 (OMS-048). Sign-in accounts live in the gateway, not in canonical
   state, so they are fetched rather than read from ST. Cached for the life of
   the page and refreshed after any change. Never contains a salt or hash -
   the endpoint does not return them. */
let OMS_ACCOUNTS=null;
async function omsLoadAccounts(force){
  if(OMS_ACCOUNTS&&!force)return OMS_ACCOUNTS;
  try{
    const r=await fetch(OMS_GATEWAY+'/api/users',{headers:{Authorization:'Bearer '+OMS_TOKEN()}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const x=await r.json();
    OMS_ACCOUNTS=Array.isArray(x.accounts)?x.accounts:[];
  }catch(e){OMS_ACCOUNTS=null;console.error('Could not load sign-in accounts:',e.message);}
  return OMS_ACCOUNTS;
}
function omsAccountFor(email){
  const k=String(email||'').trim().toLowerCase();
  if(!k||!OMS_ACCOUNTS)return null;
  return OMS_ACCOUNTS.find(a=>String(a.id||'').toLowerCase()===k)||null;
}
async function omsAccountAction(action,payload){
  const r=await fetch(OMS_GATEWAY+'/api/users',{method:'POST',
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+OMS_TOKEN()},
    body:JSON.stringify(Object.assign({action},payload||{}))});
  const text=await r.text();let x;try{x=JSON.parse(text)}catch{throw new Error('The account service returned an unexpected response.')}
  if(!r.ok)throw new Error(String(x.error||x.message||'The account service rejected that.'));
  await omsLoadAccounts(true);
  return x;
}

function omsToggleAddSignIn(on){const w=document.getElementById('au_pw_wrap');if(w)w.style.display=on?'':'none'}

/* ─── NOTES (Rev 34, OMS-015) ───
   A note field is a single string replaced on save, so two people working the
   same record overwrite one another with no warning - the conflict check sees
   one field changing, which is exactly what it expects. Threaded comments were
   considered and rejected: a new collection is a new sync surface and a new
   place for records to arrive without ids, which is the failure that hid in gw
   and rob for eleven revisions. Appending an attributed line costs none of it
   and answers the actual complaint, which is not knowing who wrote what. */
/* omsActorName() resolves a RAW actor string such as 'oms-hossam-elsaie' and
   returns '' when handed nothing - so calling it bare, as the first cut of this
   did, produced '[ \u00b7 06 Sep]' for everybody: an attribution with no
   attributor. The signed-in person is on OMS_USER. */
function omsMe(){
  const u=(typeof OMS_USER!=='undefined'&&OMS_USER)||{};
  return String(u.displayName||u.name||u.email||u.username||'').trim();
}
function omsNoteStamp(){
  const d=new Date();
  const day=String(d.getDate()).padStart(2,'0'),mon=d.toLocaleString('en-US',{month:'short'});
  const who=omsMe();
  /* No name means no claim about who wrote it. A dangling separator reads as a
     name that failed to load, rather than one that was never known. */
  return who?('['+who+' \u00b7 '+day+' '+mon+']'):('['+day+' '+mon+']');
}
function omsAppendNote(existing,text){
  const add=String(text||'').trim();
  if(!add)return String(existing==null?'':existing);
  const prior=String(existing==null?'':existing).replace(/\s+$/,'');
  return (prior?prior+'\n':'')+omsNoteStamp()+' '+add;
}
/* Appends into a notes field in the open dialog. The existing text is left
   exactly as it is - this adds, it never rewrites what somebody else wrote. */
function omsAddNoteTo(notesId,inputId){
  const notes=document.getElementById(notesId),box=document.getElementById(inputId);
  if(!notes||!box)return;
  const add=String(box.value||'').trim();
  if(!add){alert('Type the note first, then press Add note.');return}
  notes.value=omsAppendNote(notes.value,add);
  box.value='';
}
function omsSuggestedPassword(name){
  const raw=String(name||'').trim().split(/\s+/).pop()||'';
  const letters=raw.replace(/[^A-Za-z]/g,'');
  const surname=letters?letters.charAt(0).toUpperCase()+letters.slice(1).toLowerCase():'User';
  return surname+'-OMS-2026!';
}

/* Rev 29 (OPS-027). adminGenTempPw is DELETED, not relabeled, because
   renaming it would have left the body that writes the plaintext field.
   It wrote a password onto a PEOPLE DIRECTORY record and showed it in an
   alert, while authentication reads OMS_USERS_JSON in the gateway and never
   consults canonical people - so the password it produced could not sign
   anybody in. Three faults in one control: it did nothing, it put a
   password-shaped secret into shared state that every signed-in user can
   read through /api/state, and it generated that secret with Math.random().

/* Handle admin user saves in saveModal */
async function saveAdminUser(id){
  const name=gv('au_name').trim();
  const email=gv('au_email').trim();
  const role=gv('au_role').trim();
  const accessRole=gv('au_access');
  if(!name){alert('Name is required.');return;}
  if(!email){alert('Email is required.');return;}
  /* Rev 32. The sign-in account is created FIRST, because it is the part that
     can fail. Writing the directory entry first would leave somebody listed as
     added while their account silently was not - the exact shape of failure
     this console already had once, with a temporary password that changed no
     credential. */
  const wantSignIn=!id&&!!document.getElementById('au_signin')&&gc('au_signin');
  let issued='';
  if(wantSignIn){
    issued=gv('au_pw');
    if(String(issued||'').length<12){alert('The initial password must be at least 12 characters.');return}
    try{await omsAccountAction('create',{id:email.toLowerCase(),displayName:name,role:accessRole||'editor',password:issued});}
    catch(e){alert('Nothing was added. The sign-in account could not be created: '+e.message);return}
  }
  if(id){
    // Edit existing
    const p=ST.people.find(x=>x.id===id);
    if(!p)return;
    p.name=name;p.email=email;p.role=role;p.accessRole=accessRole;
  } else {
    // Add new
    const newId=slug(name)+'-'+Date.now().toString(36);
    /* Rev 29 (OPS-027). No tempPassword field. It was written in plaintext
       into shared state, was never read by anything, and could not sign
       anybody in - authentication does not consult this collection. */
    ST.people.push({id:newId,name,email,role,accessRole,active:true,
      createdAt:new Date().toISOString()});
  }
  save();closeModal();rAdmin();
  if(issued)alert('Sign-in created for '+name+'.\n\nId: '+email.toLowerCase()+'\nPassword: '+issued+'\n\nGive them this once. They must change it before using OMS, and it cannot be looked up later.');
}

function xlSerialToDate(s){
  if(!s && s!==0) return '';
  if(typeof s==='string'&&s.match(/\d{4}-\d{2}-\d{2}/)) return s.slice(0,10);
  if(typeof s==='string'&&s.match(/\d{1,2}\/\d{1,2}(\/\d{2,4})?/)){
    const p=s.split('/');
    const yr=p[2]?(p[2].length===2?'20'+p[2]:p[2]):new Date().getFullYear();
    return `${yr}-${String(p[0]).padStart(2,'0')}-${String(p[1]).padStart(2,'0')}`;
  }
  if(typeof s==='number'){
    const d=new Date(Math.round((s-25569)*86400*1000));
    return d.toISOString().slice(0,10);
  }
  return String(s||'');
}

function xlTimeToString(v){
  if(!v && v!==0) return '';
  if(typeof v==='string') return v;
  if(typeof v==='number'){
    const totalMin=Math.round(v*24*60);
    const h=Math.floor(totalMin/60)%24;
    const m=totalMin%60;
    const ampm=h>=12?'PM':'AM';
    const h12=h%12||12;
    return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
  }
  return '';
}

function processImportFile(file, type){
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'array',cellDates:false});
      let parsed=[];
      if(type==='events'){
        // All sheets except 'Lists' or metadata sheets
        const skip=['Lists','2026 Calendar','2027 Calendar','2028 Calendar','SOPs','Starter Template','Sample Agenda','Sheet1','Sample Chart'];
        wb.SheetNames.forEach(name=>{
          if(skip.some(s=>name.toLowerCase().includes(s)))return;
          parsed=parsed.concat(parseEventsSheet(wb.Sheets[name],name));
        });
        _importType='events';
      } else {
        // Key dates — first sheet only
        const sheet=wb.Sheets[wb.SheetNames[0]];
        parsed=parseKeyDatesSheet(sheet);
        _importType='keydates';
      }
      _importRows=parsed;
      showImportPreview(parsed, type);
    } catch(err){
      alert('Could not read file: '+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseEventsSheet(sheet, sheetName){
  const matrix=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:true});
  const headerRow=matrix.findIndex(row=>row.some(v=>String(v||'').trim()==='Event Name')&&row.some(v=>String(v||'').trim()==='Date'));
  if(headerRow<0)return [];
  const headers=matrix[headerRow].map(v=>String(v||'').trim());
  const colMap={'Event Name':'title','Title':'title','Event':'title','Date':'date','Start Date':'date','Start Time':'time','Time':'time','Time (Text)':'timeText','End Time':'endTime','Location':'location','Venue':'location',"Dean's Role":'role','Dean’s Role':'role','Role':'role','Dean Role':'role','Remarks Status':'remarks','Remarks':'remarks','Status':'remarks','Slides Status':'slides','Slides':'slides','Category':'category','Type':'category','Event Description':'notes','Description':'notes','Notes':'notes','Event Organizer':'organizer','Organizer':'organizer'};
  const results=[];
  matrix.slice(headerRow+1).forEach(values=>{
    const ev={source:'Ari',category:'Other',remarks:'',slides:'',notes:'',organizer:'',role:''};
    headers.forEach((h,i)=>{const mapped=colMap[h];if(mapped)ev[mapped]=values[i];});
    if(ev.date)ev.date=xlSerialToDate(ev.date);if(ev.time)ev.time=xlTimeToString(ev.time);if(ev.endTime)ev.endTime=xlTimeToString(ev.endTime);
    if(ev.timeText)ev.time=String(ev.timeText).trim();else if(ev.time&&ev.endTime)ev.time=ev.time+' - '+ev.endTime;
    delete ev.timeText;delete ev.endTime;ev.title=String(ev.title||'').trim();
    /* Rev 33 (OMS-016). Was the raw cell with an 'Other' default standing in
       for a blank, which is how 145 blank rows became 145 Other events. */
    ev.category=omsResolveImportCategory(ev.category,ev.title);

/* ─── CATEGORY VOCABULARY (Rev 33, OMS-016) ───
   One list, one alias table, one deriver, shared by BOTH calendar importers.

   The alias table exists because the source workbook and OMS grew separate
   words for the same things. Ari's Lists sheet offers "School of Medicine
   Events" and "Chair Meetings"; OMS has always stored "SOM Events" and
   "Chairs". The importer used to pass the cell through untouched, so filling
   that column in correctly would have put BOTH spellings on Dean-facing
   screens. Categories are user-editable (Rev 18) and the rename manager treats
   distinct strings as distinct categories, so nothing downstream merges them. */
const OMS_CATEGORY_CANON=['Advocate BOD','Alumni/Philanthropy','Board Meeting','CAO Rounds','Cabinet','Chairs',"Dean's Office",'EB OOO','FEC','HA/HS','Observed Holidays','SOM Events','Strategy Sessions','WFU BOT','WFUBSM BOD','Other'];
const OMS_CATEGORY_ALIASES={
  'school of medicine events':'SOM Events','school of medicine event':'SOM Events','som event':'SOM Events',
  'chair meetings':'Chairs','chair meeting':'Chairs','chairs meeting':'Chairs',
  'cao grand rounds':'CAO Rounds','cao round':'CAO Rounds',
  'ha/hs':'HA/HS','ha / hs':'HA/HS','ha-hs':'HA/HS','ha hs':'HA/HS',
  'wfbmc bod':'WFUBSM BOD','wfubmc bod':'WFUBSM BOD','wfubsm bod':'WFUBSM BOD','wfbmc':'WFUBSM BOD','wfubmc':'WFUBSM BOD',
  'deans office':"Dean's Office",'dean office':"Dean's Office",
  'observed holiday':'Observed Holidays','holiday':'Observed Holidays','holidays':'Observed Holidays',
  'eb ooo':'EB OOO','out of office':'EB OOO','ooo':'EB OOO',
  'advocate bod':'Advocate BOD','wfu bot':'WFU BOT','strategy session':'Strategy Sessions'
};
/* Maps a value somebody typed or picked onto the vocabulary OMS stores. An
   unrecognized value comes back AS TYPED rather than forced to Other: a
   category nobody has used yet is legitimate (Rev 18), and quietly rewriting it
   would destroy the only record of what its author meant. */
function omsCanonicalCategory(v){
  const raw=String(v==null?'':v).trim();
  if(!raw)return '';
  const k=raw.toLowerCase().replace(/[‘’]/g,"'").replace(/\s+/g,' ');
  if(OMS_CATEGORY_ALIASES[k])return OMS_CATEGORY_ALIASES[k];
  const hit=OMS_CATEGORY_CANON.find(c=>c.toLowerCase()===k);
  return hit||raw;
}
/* Derives a category from an event title. Specific named series are tested
   FIRST: "HA/HS Board Advance" contains 'board', and a generic rule running
   earlier would file a standing series under Board Meeting. */
function omsDeriveCategory(title){
  const t=String(title||'').toLowerCase();
  if(/\bha\s*[\/\-]\s*hs\b/.test(t))return 'HA/HS';
  if(/\bcao\b.*\brounds?\b/.test(t))return 'CAO Rounds';
  if(/\booo\b|out of office/.test(t))return 'EB OOO';
  if(/holiday/.test(t))return 'Observed Holidays';
  if(t.includes('fec'))return 'FEC';
  if(t.includes('chair'))return 'Chairs';
  if(t.includes('cabinet'))return 'Cabinet';
  if(t.includes('strategy')||t.includes('planning'))return 'Strategy Sessions';
  if(t.includes('advocate')&&(t.includes('board')||t.includes('academic')))return 'Advocate BOD';
  if(t.includes('wfbmc')||t.includes('wfubmc'))return 'WFUBSM BOD';
  if(t.includes('wfu bot'))return 'WFU BOT';
  if(/white coat|match day|commencement|orientation|state of the school|celebrate research/.test(t))return 'SOM Events';
  if(t.includes('board'))return 'Board Meeting';
  return 'Other';
}
/* Resolves the two sources of truth for one imported row. An explicit choice
   wins; a blank OR a literal "Other" falls through to derivation, because
   "Other" in that column is a default nobody chose - 18 of Ari's 37 filled
   rows say it, against 19 that say something useful. */
function omsResolveImportCategory(sheetValue,title){
  const explicit=omsCanonicalCategory(sheetValue);
  if(explicit&&explicit!=='Other')return explicit;
  return omsDeriveCategory(title);
}
/* Key Dates has no category column, so the title is all there is. Kept as a
   named entry point because that is what the Maggie importer calls. */
function keyDatesCategory(title){return omsDeriveCategory(title)}
function parseKeyDateLead(lead,colIndex){
  const months={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
  let year=colIndex<12?2026:2027,m,d,match;
  match=String(lead).match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  if(match){m=+match[1];d=+match[2];if(match[3])year=match[3].length===2?2000+(+match[3]):+match[3];}
  if(!match){match=String(lead).toLowerCase().match(/\b(january|february|march|april|may|june|july|august|september|october|november|december)\s+(\d{1,2})\b/);if(match){m=months[match[1]];d=+match[2];}}
  if(!match)return '';
  const dt=new Date(year,m-1,d);if(dt.getFullYear()!==year||dt.getMonth()!==m-1||dt.getDate()!==d)return '';
  return `${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function parseKeyDatesSheet(sheet){
  const matrix=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:false});
  const results=[];
  matrix.forEach((row,r)=>row.forEach((value,c)=>{
    if(typeof value!=='string')return;
    const lines=value.split(/\r?\n/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
    if(lines.length<2)return;
    const date=parseKeyDateLead(lines[0],c);if(!date)return;
    const title=lines[1];
    if(!title||/^(q1|q2|q3|q4)$/i.test(title)||/calendar view|session structure|bi-weekly|strategy sessions beginning/i.test(title))return;
    let time='',location='',notes=[];
    lines.slice(2).forEach(line=>{
      if(!time&&/\b\d{1,2}(?::\d{2})?\s*(?:am|pm|a|p)\b/i.test(line))time=line;
      else if(!location&&!/^(proxy:|location:|lola,|final prep)/i.test(line))location=line.replace(/^location:\s*/i,'');
      else notes.push(line);
    });
    if(/[&]|\band\b|\d\s*[-–]\s*\d/i.test(lines[0]))notes.unshift('Source date expression: '+lines[0]);
    results.push({id:uid(),source:'Maggie',title,date,time,location,role:'',remarks:'',slides:'',category:keyDatesCategory(title),notes:notes.join(' | ')});
  }));
  return results;
}

  const source=type==='events'?'Ari':'Maggie',seen=new Set();

  const currentCount=(ST.events||[]).filter(e=>e.source===source).length;

}

/* Rev 19 (OPS-016). The two workbooks independently record the same real events
   under different titles - "White Coat Ceremony - CLT" against "White Coat - CLT",
   "Academic Cabinet Advance" against "Cabinet Advance" - and the import had no
   cross-source check, so every re-import recreated the duplicates. A same-date
   scan of canonical found 21 such pairs across 275 events. Both workbooks are
   canonical for their own source, so this REPORTS the clash and never resolves
   it: silently dropping a row from a canonical workbook would be worse. */
const DUP_STOP=new Set(['the','and','for','with','from','meeting','meetings','series','ceremony','day','session','sessions']);
function dupTokens(t){return new Set(String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').split(' ').filter(w=>w.length>2&&!DUP_STOP.has(w)))}
function crossSourceDuplicates(rows,source){
  const other=(ST.events||[]).filter(e=>e&&e.date&&e.source!==source);
  const out=[];
  (rows||[]).forEach(r=>{
    if(!r||!r.date)return;
