   over a longer total budget. Honest expectation: the saving is under a second.

async function OMS_WAIT_FOR(ops,startRevision){

    const d=OMS_POLL_MS[Math.min(n,OMS_POLL_MS.length-1)];
    await new Promise(r=>setTimeout(r,d));
    waited+=d;
    const x=await OMS_FETCH_STATE();

function OMS_CURRENT_VERSION(state,op){const rows=Array.isArray(state&&state[op.entityType])?state[op.entityType]:[];const current=rows.find(x=>String(x.id)===String(op.entityId));return current?Number(current._version||0):0}async function OMS_ASSERT_CURRENT(ops){const latest=await OMS_FETCH_STATE();for(const op of ops){const currentVersion=OMS_CURRENT_VERSION(latest.state,op);const baseVersion=Number(op.baseVersion||0);if(baseVersion!==currentVersion)throw Object.assign(new Error('Version mismatch: this record was modified elsewhere.'),{conflict:true,status:409,operation:op,baseVersion,currentVersion})}return latest}function OMS_TOAST(message,type='success'){let t=document.getElementById('omsToast');if(!t){t=document.createElement('div');t.id='omsToast';t.className='oms-toast';document.body.appendChild(t)}t.textContent=message;t.className='oms-toast'+(type==='conflict'?' conflict':'');requestAnimationFrame(()=>t.classList.add('on'));clearTimeout(OMS_TOAST._timer);OMS_TOAST._timer=setTimeout(()=>t.classList.remove('on'),3000)}async function OMS_HANDLE_CONFLICT(e){OMS_SET_STATE('Conflict','sync-unsynced','This record was modified elsewhere. Your stale change was not applied. Refreshing to the latest shared version.');OMS_TOAST('Conflict detected: this record was modified elsewhere.','conflict');alert('Conflict detected. This record was modified elsewhere. Your stale change was not saved. OMS will now refresh to the latest shared version.');try{const x=await OMS_FETCH_STATE();ST=x.state;OMS_REVISION=x.revision;OMS_BASE=JSON.parse(JSON.stringify(ST));_dirty.clear();localStorage.removeItem(OMS_PENDING_KEY);OMS_LOCAL_SAVE();renderAll();renderNotificationBadge();OMS_SET_STATE('Connected','sync-connected','Latest shared version loaded after conflict.');const tsEl=document.getElementById('ts');if(tsEl)tsEl.textContent='Revision '+OMS_REV_LOG[0].rev;OMS_TOAST('Latest shared version loaded')}catch(refreshError){console.error(refreshError);OMS_SET_STATE('Unsynced','sync-unsynced','Conflict detected, but the latest shared version could not be loaded. Refresh the page before editing again.')}}async function OMS_SYNC_ONCE(){const ops=OMS_DIFF();const OMS_UNSYNCABLE=()=>OMS_COLLECTIONS.filter(t=>Array.isArray(ST[t])&&ST[t].some(x=>x&&x.id==null));let bad=OMS_UNSYNCABLE();if(!ops.length){if(bad.length){OMS_SET_STATE('Unsynced','sync-unsynced','Records with no id cannot be synced: '+bad.join(', ')+'. Changes to those records were NOT saved to the shared copy.');OMS_TOAST('NOT SAVED: records with no id in '+bad.join(', '),'conflict');return}OMS_SET_STATE('Connected','sync-connected','');const tsEl=document.getElementById('ts');if(tsEl)tsEl.textContent='Revision '+OMS_REV_LOG[0].rev;return}OMS_SET_STATE('Saving','sync-saving','');await OMS_ASSERT_CURRENT(ops);const start=OMS_REVISION;for(const op of ops)await OMS_POST(op);OMS_SET_STATE('Sync pending','sync-pending','The change was accepted and is awaiting canonical confirmation.');const x=await OMS_WAIT_FOR(ops,start);ST=x.state;OMS_REVISION=x.revision;OMS_BASE=JSON.parse(JSON.stringify(ST));_dirty.clear();localStorage.removeItem(OMS_PENDING_KEY);OMS_LOCAL_SAVE();renderAll();renderNotificationBadge();bad=OMS_UNSYNCABLE();const tsEl=document.getElementById('ts');if(tsEl)tsEl.textContent='Revision '+OMS_REV_LOG[0].rev;if(bad.length){OMS_SET_STATE('Unsynced','sync-unsynced','Saved, but records with no id cannot be synced: '+bad.join(', ')+'. Changes to those records were NOT saved to the shared copy.');OMS_TOAST('Partly saved: records with no id in '+bad.join(', '),'conflict')}else{OMS_SET_STATE('Connected','sync-connected','');OMS_TOAST('Save successful')}}

/* === End Gate 4 shared persistence integration === */ const NOW=new Date(); const TODAY=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate(),12,0,0); const CURM=TODAY.getMonth(); const MNA=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; const MNF=['January','February','March','April','May','June','July','August','September','October','November','December']; const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']; const CC={'SOM Events':'csom','WFU BOT':'cwfu','WFUBSM BOD':'cwfb','Advocate BOD':'cadv','Cabinet':'ccab','Strategy Sessions':'cstr','FEC':'cfec','Chairs':'cchr','Board Meeting':'cbd','Alumni/Philanthropy':'calm','Other':'coth','EB OOO':'cooo'}; const CB={'SOM Events':'by','WFU BOT':'bb','WFUBSM BOD':'bp','Advocate BOD':'bt','Cabinet':'br3','Strategy Sessions':'bp','FEC':'by','Chairs':'bsk','Board Meeting':'bp','Alumni/Philanthropy':'bt','Other':'bgr','EB OOO':'bgr'}; /* Rev 17: a letter code per category, so color is never the only cue. */ const CG={'SOM Events':'SOM','WFU BOT':'BOT','WFUBSM BOD':'BSM','Advocate BOD':'ADV','Cabinet':'CAB','Strategy Sessions':'STR','FEC':'FEC','Chairs':'CHR','Board Meeting':'BRD','Alumni/Philanthropy':'ALM','Other':'OTH','EB OOO':'OOO'}; const OMS_TASK_STATUSES=['Not Started','In Progress','Complete','Retired']; const OMS_CATS_KEY='cao_oms_categories',OMS_VIEWS_KEY='cao_oms_views',OMS_CAL_MAX_YEARS=12; let ST={},curTab='dash',calCadence='all',calSrc='overlay',calView='grid',calSearch='',sopQ='',taskQ='',taskSt='All',taskOw='All',taskCat='All',taskSort='',taskSortDir='asc'; let MC={type:null,id:null};let _guideHtml=null,_guideRole=null,_syncDebounce=null,_dirty=new Set(OMS_COLLECTIONS);;let briefWeekView=null; function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)} function dp(s){return s?new Date(s.includes('T')?s:s+'T12:00:00'):null} function fmt(s){if(!s)return'';let d=dp(s);return(d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear()} /* Rev 23 (OMS-007). Priority and Status must NOT sort alphabetically: that

    case 'category':cmp=(a,b)=>blankLast(a.category,b.category)||txt(a.category).localeCompare(txt(b.category));break;

function backfillTaskOwnerIds(){

   only cue. Codes are now assigned over the WHOLE list in one deterministic

   disambiguated. Every user computes the same map, so the legend agrees. */
function catGlyphRaw(c){
  const w=String(c||'').replace(/[^A-Za-z0-9 ]/g,' ').trim().split(/\s+/).filter(Boolean);
  if(!w.length)return'OTH';

  list.forEach(c=>{if(CG[c]){out[c]=CG[c];taken.add(CG[c])}});
  list.filter(c=>!out[c]).forEach(c=>{
    let g=catGlyphRaw(c);
    if(taken.has(g)){
      const w=String(c||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();

      for(let i=1;i+1<w.length&&!alt;i++){const t=(w[0]+w.slice(i,i+2));if(t.length===3&&!taken.has(t))alt=t}

/* Item 5. The grid spans an unbroken run of years, so an event created beyond
   the loaded range extends the horizon instead of appearing as an isolated
   block with gaps. Capped, so one mistyped year cannot render 400 blocks. */
function calEventEnd(e){const st=dp(e&&e.date);if(!st)return null;const raw=e&&e.endDate;const en=(raw&&String(raw)>=String(e.date))?dp(raw):null;return en||st}
function calYearSpan(items){
  const yrs=[];
  (items||[]).forEach(e=>{if(!e||!e.date)return;const st=dp(e.date);if(!st)return;yrs.push(st.getFullYear());const en=calEventEnd(e);if(en)yrs.push(en.getFullYear())});
  if(!yrs.length)return[];
  const cur=TODAY.getFullYear();
  // Forward only. The horizon that needs extending is the future one, so the
  // run from this year to the furthest event is filled in. Past years are kept
  // as their own blocks and NOT gap-filled: one overdue 2020 task must not drag
  // the grid back six years and render seventy empty months.
  const past=[...new Set(yrs.filter(y=>y<cur))].sort((a,b)=>a-b);
  const hi=Math.max(cur,...yrs);
  const fwd=[];for(let y=cur;y<=hi&&fwd.length<OMS_CAL_MAX_YEARS;y++)fwd.push(y);
  return [...past,...fwd].slice(0,OMS_CAL_MAX_YEARS);

function findPeople(q){
  const n=String(q||'').trim().toLowerCase();
  if(!n)return [];
  const people=(ST.people||[]).filter(p=>p&&p.active!==false);
  const local=p=>String(p.email||'').toLowerCase().split('@')[0];
  const parts=p=>{const a=String(p.name||'').toLowerCase().split(/\s+/).filter(Boolean);const b=local(p).split(/[._-]+/).filter(Boolean);return [...new Set([...a,...b])]};
  // Ladder, most specific first. A rung only counts if it matches exactly one
  // person; otherwise fall through so the caller can report the ambiguity.
  const rungs=[
    p=>String(p.name||'').toLowerCase()===n,
    p=>String(p.email||'').toLowerCase()===n,
    p=>local(p)===n,
    p=>parts(p).includes(n),
    p=>String(p.id||'')===slug(n),
    p=>parts(p).some(w=>w.startsWith(n)&&n.length>=3)

  for(const r of rungs){const hit=people.filter(r);if(hit.length)return hit}

function omsSubject(kind,task){

/* Rev 24 (OMS-014). DEC-003 called for a handoff draft when a predecessor
   completes. Fires only on the TRANSITION into Complete: re-saving an already
   complete task must not send the same handoff again, which is why previous
   status is checked rather than current status alone. Consistent with DEC-002,
   this creates a reviewed draft rather than sending anything. */
/* Rev 24 (OMS-006). Deliberately NOT run on load. Creating notifications when
   somebody merely opens OMS is a write on a read: it would sync on every page
   view, and two people opening it at once would race to create the same
   reminder. So this selects, and createDueReminders is an explicit action.
   Already-overdue work is excluded on purpose - that has its own surface and
   a reminder about it would be noise. An owner with no address is excluded
   because no notification could be created for them, and listing them would

function tasksDueSoon(days){
  const horizon=new Date(TODAY); horizon.setDate(horizon.getDate()+(Number(days)||3));
  return (ST.tasks||[]).filter(t=>{
    if(!t||!t.due)return false;
    if(isDone(t)||isRetired(t))return false;
    if(!t.ownerEmail)return false;
    const d=dp(t.due);
    return d>=TODAY&&d<=horizon;
  });
}
function createDueReminders(days){
  ST.notifications=Array.isArray(ST.notifications)?ST.notifications:[];
  let made=0;
  tasksDueSoon(days).forEach(t=>{
    /* Keyed on task AND due date, so moving a due date earns a fresh reminder
       while clicking twice does not. */
    if(ST.notifications.some(x=>x&&x.type==='due_reminder'&&String(x.taskId)===String(t.id)&&String(x.dueDate||'')===String(t.due||'')))return;
    const subject=omsSubject('Reminder',t);
    const body=['A task you own is due shortly.','',
      'Task: '+(t.title||'Untitled task'),'Owner: '+(t.owner||''),
      'Due date: '+(t.due||'Not specified'),'Priority: '+(t.priority||'Not specified'),
      'Status: '+(t.status||'Not specified'),'',
      'Open OMS: '+window.location.href,'',
      OMS_MAIL_SIGNOFF].join('\n');
    ST.notifications.unshift({id:uid(),type:'due_reminder',taskId:t.id,dueDate:t.due||'',
      recipientName:t.owner||'',recipientEmail:t.ownerEmail||'',subject:subject,body:body,
      status:'pending',createdAt:new Date().toISOString(),method:'outlook_draft'});
    made++;
  });

  return made;
}

function notifyDependentsOnCompletion(task,previous){

function createNotificationForTask(task,previous){
  ST.notifications=Array.isArray(ST.notifications)?ST.notifications:[];
  ST.assignmentHistory=Array.isArray(ST.assignmentHistory)?ST.assignmentHistory:[];
  const ownerChanged=!previous || (previous.owner||'')!==(task.owner||'') || (previous.ownerEmail||'')!==(task.ownerEmail||'');
  if(!ownerChanged)return;
  if(!task.ownerEmail)return;
  const type=previous?'assignment_changed':'assignment_created';
  const isHighPriority=String(task.priority||'').toLowerCase()==='high';
  const subject=notificationSubject(task,!!previous);
  const bodyLines=[
    previous?'An OMS task has been reassigned to you.':'You have been assigned a new OMS task.',
    '',
    ...(isHighPriority?['! IMPORTANCE: HIGH','']:[]),
    'Task: '+(task.title||'Untitled task'),
    'Owner: '+(task.owner||''),
    'Due date: '+(task.due||'Not specified'),
    'Priority: '+(task.priority||'Not specified'),
    'Status: '+(task.status||'Not specified')
  ];
  const notes=String(task.notes||'').trim();
  if(notes){bodyLines.push('','Notes:',notes);}
  bodyLines.push(
    '',
    'Open OMS: '+window.location.href,
    '',
    OMS_MAIL_SIGNOFF
  );
  const body=bodyLines.join('\n');
  const n={id:uid(),type,taskId:task.id,recipientName:task.owner,recipientEmail:task.ownerEmail,subject,body,status:'pending',createdAt:new Date().toISOString(),method:'outlook_draft'};

}

function rGuide(){

  const _gh=` <div class="guide-wrap"><div class="guide-hero"><h1>CAO Operations Management System (OMS) - User Guide</h1><p>This guide explains each screen, what it is for, and how to maintain content. Version 1.4.0 adds individual OMS sign-in and shared canonical persistence through the secure gateway. Connected means shared data loaded. Saving means a change is being sent. Sync pending means accepted but awaiting canonical confirmation. Synced means canonical state confirms the change. Unsynced means the local safety copy is not yet shared. Authentication required means the temporary session is missing or expired. OMS credentials are separate from GitHub credentials and must not be shared.</p></div><div class="guide-grid"><div><div class="guide-sec"><div class="guide-sec-hd"><h2>Getting Started</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Navigation:</strong> Use the tabs to move between Dashboard, Weekly Brief, CAO Visibility, Calendars, Cadence (RoB), SOPs, Tasks, and User Guide.</li><li><strong>Saving:</strong> Connected means shared data loaded. Saving means a change is being sent. Sync pending means accepted but not yet confirmed. After canonical confirmation, a green <strong>Save successful</strong> toast appears. Unsynced means the local safety copy has not reached shared state.</li><li><strong>Concurrent edits and stale versions:</strong> OMS sends each record's base version to the gateway. If the gateway reports a conflict, stale version, version mismatch, or HTTP 409, OMS blocks the stale write, displays a conflict alert, and reloads the latest shared state. If reload fails, OMS instructs the user to refresh before editing again.</li><li><strong>Versioning:</strong> The header badge and build stamp identify the active file version and build.</li><li><strong>Print:</strong> Print outputs the current active tab in a print friendly format.</li></ul><div class="guide-note"><strong>Important:</strong> Shared canonical data is primary. Local storage is a safety fallback only. Do not close or sign out while Unsynced work exists without reviewing the warning. OMS credentials are separate from GitHub credentials and must not be shared.</div></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Screen by Screen Guide</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Dashboard:</strong> Reviews overdue items, in progress work, items for EB review, and events in the next 30 days.</li><li><strong>Weekly Brief:</strong> Builds a date based weekly summary with locations, high attention meetings, conflicts, event review, and upcoming events.</li><li><strong>CAO Visibility:</strong> Presents an executive scan with summary KPIs and section cards for cadence, inbound requests, assignments, agendas and materials, board commitments, deadlines, review items, and FYIs.</li><li><strong>Calendars:</strong> Switch between Ari's Events, Maggie's Key Dates, Tasks, and the Master Overlay. Tasks with due dates appear automatically as Task calendar items. Event pills show open/total linked Task counts when present. Open an Event to create or review linked Tasks.</li><li><strong>Cadence (RoB):</strong> Double click a month cell to edit its activity text and status. A single click deliberately does nothing &mdash; it used to cycle the status, and because a double-click fires two single clicks first, following the on-screen instruction advanced the status twice before the editor even opened. Use Add Workstream, Edit, and Delete for row management.</li><li><strong>SOPs:</strong> Search and maintain the SOP catalog. Open linked documents from the table.</li><li><strong>Tasks:</strong> Filter tasks by status and owner, search by title, and add, edit, assign, notify, or delete tasks. Tasks created from an Event retain a reciprocal source-event link. Notification drafts include Notes when populated; high-priority tasks add ! HIGH PRIORITY to the email subject and body.</li><li><strong>Admin Console:</strong> Visible to admin accounts only. Manage users (add, edit, deactivate, reactivate, hard delete, set roles and temp passwords). Deactivate suspends access but retains the user record and can be reversed. Hard delete permanently removes the user from OMS and cannot be undone — admin accounts are protected from hard delete. The Revision Log section shows all build revisions with dates and summaries — the authoritative change history for OMS.</li></ul></div></div></div><div><div class="guide-sec"><div class="guide-sec-hd"><h2>How to Maintain Data</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Add a record:</strong> Use Add buttons on the relevant tab.</li><li><strong>Edit a record:</strong> Use Edit buttons in tables or cards, or double click a RoB cell.</li><li><strong>Delete a record:</strong> Use Delete or X and confirm.</li><li><strong>Print for leadership:</strong> Open the desired tab first, then click Print.</li></ul></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Assigning an owner</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Type less than the whole name.</strong> OMS matches a first name, a surname, or the part of an email before the @ &mdash; so <em>Ari</em>, <em>Ariana</em> and <em>Ball</em> all reach the same person. It only fills in the owner when exactly one person matches.</li><li><strong>If two people match, the save stops</strong> and lists them. A task has one owner, so something like <em>Hossam/Maggie</em> has to become two tasks or one specific name.</li><li><strong>Adding someone new</strong> opens a short form under the Owner box: first name, last name and email, all required. They join the People directory when the task saves, so notifications can reach them. If the email is already on file, OMS offers that person instead of creating a second copy.</li></ul></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>When a save is not really saved</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Watch the sync indicator, not the dialog.</strong> A dialog closing means the change reached this browser. It reaches the shared copy only when the indicator returns to <strong>Connected</strong> and the revision number advances. Do not reload while it reads <strong>Sync pending</strong> &mdash; that discards the change you just made.</li><li><strong>Records with no id cannot sync.</strong> If the indicator reads <strong>Unsynced</strong> and names one or more collections, changes to those records were not saved to the shared copy, even though they still appear on screen. Report it rather than repeating the edit; it needs a data fix, not a retry.</li><li><strong>Assigning a task to someone with no email.</strong> OMS now asks before saving. Cancelling stops the save so you can pick a name from the Owner list or add the address in People. Saving anyway is allowed, but no notification will exist and that owner will not be told.</li></ul></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Troubleshooting</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Authentication required:</strong> Sign in again when the temporary session expires. If an edit is Unsynced, restore connectivity and allow OMS to reconcile against the newest canonical state before repeating the edit.</li><li><strong>Hard delete vs. Deactivate:</strong> Deactivate suspends login access and can be reversed. Hard delete permanently removes the user record from OMS — use only when a user must be completely removed. Admin accounts cannot be hard deleted.</li><li><strong>Cadence (RoB) status no longer changes on a single click:</strong> that is deliberate as of Rev 14. Double-click the month cell and set Status in the editor. A single click previously cycled status, which meant a double-click advanced the status twice before the editor opened.</li><li><strong>Popup close control:</strong> the dialog header and its close X are sticky as of Rev 14, so the close control stays visible and clickable however far you scroll inside a long dialog.</li><li><strong>Event end dates and times:</strong> End Date and End Time are optional on any event. When set, Calendar list mode shows them in the Ends column; a multi-day event shows the end date, a same-day event shows only the end time. An end date earlier than the start date is rejected on save.</li><li><strong>No notification was created:</strong> OMS creates an assignment notification only when the owner has an email address on file. As of Rev 14 it warns you instead of failing silently. Choose an existing name from the Owner list, or add the person and address in People, then save the task again.</li><li><strong>Departed staff:</strong> Deactivate the person in People or the Admin Console rather than hard deleting them. Hard delete removes the record while any task still assigned to that person keeps their name, which leaves an owner OMS can no longer resolve and no notification will be created for.</li><li><strong>Popup content is cut off:</strong> drag the popup resize handle in its lower-right corner, or use its horizontal and vertical scrollbars.</li><li><strong>Version display:</strong> The current version appears once in the left-side elliptical badge in the OMS header.</li><li><strong>Tooltips:</strong> Hover over any button or navigation tab to see a tooltip. Tooltips automatically appear above or below depending on screen position and are visible on every screen.</li><li><strong>Sticky navigation:</strong> The navigation tab bar is fixed in place while scrolling so all tabs remain accessible without returning to the top of the page. The bar auto-adjusts if the header height changes.</li><li><strong>Encoding normalization:</strong> OMS automatically converts the legacy numeric dash encoding to an en dash with surrounding spaces when canonical or local fallback data loads.</li><li><strong>Calendar source replacement:</strong> The Events workbook replaces only Ari calendar records; the Key Dates workbook replaces only Maggie calendar records. Tasks, the other calendar source, and all non-calendar collections remain unchanged. Exact duplicate title-and-date rows inside the uploaded workbook default to Skip. A safety gate blocks Maggie replacement when fewer than 10 valid rows are parsed.</li><li><strong>Calendar controls:</strong> Calendar filters, search, List/Grid, Add Event, and Print remain sticky below the fixed header while scrolling. Calendar search preserves focus for continuous typing.</li><li><strong>Event-to-Task workflow:</strong> Open an Event and select Create Linked Task. The Task inherits the Event title and date, stores the source link, and is listed in the Event with live completion progress. Deleting an Event preserves its Tasks but clears the source-event link.</li></ul></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>What is new in Rev 17</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Retired tasks:</strong> Status now offers <strong>Retired</strong> alongside Not Started, In Progress and Complete. Use it for work that was dropped or overtaken, not delivered. A Retired task never counts as overdue, and never counts towards a completion figure. It shows struck through so it cannot be mistaken for Complete. If a task was closed as Complete but never actually delivered, change it to Retired: that is what keeps the Dashboard and the linked-task counts on an Event honest.</li><li><strong>Recurring events:</strong> The Event form has a <strong>Cadence</strong> checkbox. Tick it for anything that repeats. It is separate from Category on purpose: a Category holds one value, so recording cadence there would force a choice between, say, Cabinet and Recurring. Recurring events carry a &#8635; marker in both grid and list view. The Outlook calendar sync fills this in automatically.</li><li><strong>Adding a category:</strong> The Category list on the Event form ends with <strong>+ Add a new category</strong>. Pick it, type the name, and save the event. The new category is then offered to everyone, because it travels with the event itself. The field appears inside the Event form rather than in a second dialog, since opening a second dialog would discard the event you are editing.</li><li><strong>Saved views:</strong> On Calendars and on Tasks, set the filters you want and select <strong>+ Save view</strong> to name them. The named view appears as a chip; select it to re-apply, or select its &times; to remove it. Saved views live in your own browser and are yours alone, so they are not shared with the rest of the office and do not travel between machines.</li><li><strong>Multi-day events:</strong> An event with an End Date now appears in every month it touches, not only the month it starts in. The day range is clipped to the month shown, so a 30 December to 2 January event reads 30-31 in December and 1-2 in January. Continuation months carry a &#9654; marker.</li><li><strong>Calendar horizon:</strong> The grid covers an unbroken run of years. Create an event in a future year and that year, and every year between, appears automatically. There is nothing to configure.</li><li><strong>Grid legend:</strong> The Calendars grid opens with a legend. Every category color is paired with a three-letter code that also appears on the event itself, so the grid can be read without relying on color, and prints legibly in black and white.</li><li><strong>Owner ids:</strong> Tasks now store the owner&#39;s id as well as their name and address, so renaming somebody in People no longer risks breaking their notification routing. This was applied to existing tasks automatically. A task whose owner is written ambiguously, such as "Hossam/Maggie", is left untouched: OMS will not guess which person is meant.</li></ul><div class="guide-note">Not in Rev 17: the Dean briefing export (OMS-026) is still waiting on a decision about its format, and three improvements to the save path are held for Rev 18 so that a problem with them could never force a rollback of everything above.</div></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Editing categories</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Where:</strong> Calendars, then <strong>Categories</strong> in the toolbar. Editors only; read-only accounts cannot change them.</li><li><strong>Renaming:</strong> Change the name and every event using that category is updated in shared OMS. The dialog shows how many events each change will touch, and asks you to confirm before anything is saved.</li><li><strong>Merging:</strong> Rename a category so it exactly matches one that already exists and the two are merged, with every event moved across. The dialog marks these as MERGE so a merge can never happen by accident. This is how near-duplicates are cleaned up &mdash; for example <em>School of Medicine Events</em> into <em>SOM Events</em>, or <em>Chair Meetings</em> into <em>Chairs</em>.</li><li><strong>Imported events are categorized for you.</strong> The Dean’s Office Events workbook has a Category column, and most rows are blank. Rather than filing those as <em>Other</em>, OMS reads the event name and works the category out &mdash; boards, cabinets, chair meetings, FEC, CAO Rounds, HA/HS, out-of-office and School of Medicine events are all recognized. A category typed in the workbook always wins over the guess, except the word <em>Other</em>, which is treated as no answer.</li><li><strong>The workbook’s wording is translated, not copied.</strong> The spreadsheet offers <em>School of Medicine Events</em> and <em>Chair Meetings</em>; OMS stores <em>SOM Events</em> and <em>Chairs</em>. The importer maps between them, so filling in the workbook cannot create a second, near-identical category alongside one that already exists. Nobody needs to retype what is already there.</li><li><strong>Codes are automatic:</strong> The three-letter code beside each category is assigned for you and is always unique, so no two categories can ever show the same code in the calendar legend. You cannot set a code by hand, and you do not need to: rename the category and the code follows. Built-in categories keep their established codes &mdash; ADV for Advocate BOD, BSM for WFUBSM BOD, BOT for WFU BOT, BRD for Board Meeting.</li><li><strong>Built-in categories stay:</strong> A built-in can be renamed, but it remains on the list afterwards so it is always available to pick again. Its event count will read 0 until something uses it.</li><li><strong>Colors:</strong> A category you add gets a color automatically, and the same category always gets the same color for everyone. Nothing needs configuring, and a renamed category will not turn gray.</li></ul><div class="guide-note">Adding a category while editing an event still happens inside the event form, under Category. The Categories dialog is for renaming and merging what already exists.</div></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Weekly Brief and notifications</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>The Brief now opens on the current week.</strong> It used to open on whichever week was last saved, and never moved on its own &mdash; it was found opening on a week in June. The <strong>Week of</strong> picker still takes you to any week, past or future; it simply no longer sticks there for everyone the next time the page loads.</li><li><strong>Tasks due that week now appear in the Brief</strong>, under <em>Tasks Due This Week</em>, with owner, priority and status. Previously the Brief listed events only, so a week could look empty while several tasks were in fact due. Retired tasks are left out, the same as everywhere else.</li><li><strong>Notification subjects follow one standard.</strong> Every OMS email now reads <em>OMS | Due Tue 8 Sep 2026 | New assignment | &lt;task&gt; | &lt;owner&gt;</em>, with <em>HIGH PRIORITY</em> inserted straight after OMS when the task is high priority. The due date sits before the title on purpose: mail clients cut the subject after roughly sixty characters, and the deadline is the part worth keeping.</li><li><strong>Importing a workbook now warns about duplicates.</strong> The two calendar workbooks sometimes record the same event under different names &mdash; <em>White Coat Ceremony - CLT</em> against <em>White Coat - CLT</em>. The import checks incoming rows against events already held from the other workbook and lists anything that looks like a match before it replaces anything. It will not choose for you: each workbook is the authority for its own events, so you decide whether to import anyway or reconcile the workbooks first.</li></ul><div class="guide-note">The Brief still shows the week you pick for as long as you stay on the page. Reloading returns it to the current week.</div></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Closing OMS while a save is in flight</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>OMS now warns you before you close it with a save still in flight.</strong> Saving to shared OMS takes twenty to thirty seconds: the change is accepted, then a workflow folds it into the shared record, and only then does the status read Connected. Closing the tab in between loses the edit, and nothing retries it for you the next time you open OMS. If the browser asks whether you want to leave, the honest answer is no &mdash; wait for <strong>Connected</strong>.</li><li><strong>It also warns when earlier work is still unconfirmed</strong>, not only during the save you just made. If a previous save ended in <em>Unsynced</em>, that work is held on this browser and the warning stays until it goes through.</li><li><strong>The warning is deliberately quiet the rest of the time.</strong> You will not see it on a normal close, because a prompt that appears every time is a prompt everybody learns to dismiss.</li><li><strong>Confirmation is now noticed sooner.</strong> OMS checks for the confirmed change a few times in the first second rather than waiting a full second before looking at all. The saving is under a second: most of the wait is the shared record being updated, not OMS being slow to look.</li></ul><div class="guide-note">Still true, and worth repeating: never reload while the status reads <strong>Sync pending</strong>. Wait for Connected.</div></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Categories, sorting and checklists on Tasks</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Tasks now carry a Category</strong>, and it is the <em>same</em> list events use &mdash; not a second one. A task created from an event inherits that event&#39;s category, so everything for a board meeting can be found together. Pick <strong>+ Add a new category</strong> on the task form to add one, exactly as on an event.</li><li><strong>Renaming a category now moves tasks as well as events.</strong> The Categories dialog shows an Events count and a Tasks count side by side, and the confirmation quotes both, so you can see the full effect before anything is saved. Merging works the same way it always has.</li><li><strong>Filter by category</strong> using the new dropdown beside Owner. It lists only categories that are actually in use on tasks, so it does not fill up with meeting types nothing is assigned to.</li><li><strong>Sort by clicking a column heading.</strong> Title, Owner, Category, Due, Priority and Status are all sortable; click once for ascending, again to reverse. An arrow marks the column in use. Priority sorts High, Medium, Low and Status sorts by urgency &mdash; alphabetical order would read High, Low, Medium, which helps nobody. A task with no due date sorts to the bottom rather than the top.</li><li><strong>Checklist</strong> prints the tasks currently shown, grouped by the event each belongs to, with a box to tick, plus owner, due date, status, category and notes. It respects whatever filters and sort you have set, so narrow the list first and the checklist matches. Tasks not linked to an event are grouped at the end &mdash; they are never left out.</li></ul><div class="guide-note">Saved views now remember the category filter and the sort as well as status, owner and search. Views saved before this release still work; they simply carry no sort and open on the default order.</div></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Dependencies, handoffs and reminders</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>A task can now wait on another task.</strong> Set <em>Waiting on</em> in the task form. While the other task is still open, this one shows as <strong>Blocked</strong> rather than Not Started, so it is obvious that nobody can start it yet. Blocked is shown instead of Overdue when both apply, because the useful fact is that the work cannot begin &mdash; the due date still shows in red, so lateness is not hidden.</li><li><strong>Completing the thing it waits on sends a handoff.</strong> When you mark a task Complete, anyone who owns a task that was waiting on it gets a notification draft saying it is now theirs to start. This is the remarks-to-slides handoff. It fires only when the task <em>becomes</em> Complete, so re-saving a finished task does not send it again.</li><li><strong>Work that was dropped does not block anything.</strong> A prerequisite marked <em>Retired</em> counts as closed, exactly like Complete. Otherwise abandoning one task would freeze everything behind it with no way out. The same applies if the prerequisite is deleted.</li><li><strong>Reminders are on a button, not automatic.</strong> <em>Remind</em> on the Tasks screen shows how many tasks are due in the next three days and queues a draft for each. It asks first and lists what it will create. Clicking it twice does not duplicate anything; changing a due date does earn a fresh reminder.</li><li><strong>Nothing sends itself.</strong> Every one of these is a draft in Notifications for you to review and send, the same as an assignment notification.</li></ul><div class="guide-note">Reminders are deliberately not created when you open OMS. Doing that would write to shared OMS every time anyone loaded the page, and two people opening it at once would race to create the same reminder. Already-overdue tasks are left out too &mdash; the Dashboard already surfaces those, and a reminder about something that is already late is noise.</div></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Who changed what</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Records now say who last edited them.</strong> Open a Task or an Event and a small line under Notes reads <em>Last edited by &lt;name&gt; on &lt;date&gt;</em>. This was never new information &mdash; shared OMS has been recording it on every save all along &mdash; it simply had nowhere to appear.</li><li><strong>Assignment history is visible at last.</strong> A Task that has changed owner shows the full trail inside its own dialog: when, whether it was a first assignment or a reassignment, and to whom. The Admin Console carries the same trail across every task.</li><li><strong>If a name cannot be resolved you will see the raw account id</strong> rather than a blank. That is deliberate: a blank would suggest nobody edited the record, which would be false.</li></ul><div class="guide-note">This is a read of what was already stored, not new tracking. Nothing extra is recorded, and the editor stamp is still stripped from what OMS sends when you save &mdash; it belongs to shared OMS, which sets it, and must not be sent back as if it were an edit you made.</div></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Passwords and the forced change</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Initial passwords are issued as <em>&lt;surname&gt;-OMS-2026!</em></strong> and are therefore guessable by anyone who knows the pattern. That is acceptable only because the holder must change the password before they can use OMS &mdash; the forced change is the control that makes the scheme safe, not a convenience.</li><li><strong>Sign-in holds at a change-password screen</strong> when the account is flagged, and there is no way past it. An older session carrying the flag is cleared rather than honored, so a session opened before the change cannot be used to skip it.</li><li><strong>The current password is required to set a new one.</strong> A stolen session on its own must not be enough to lock the real owner out of their own account.</li><li><strong>Sign-in accounts are now managed from the Admin Console.</strong> Each row shows whether that person can sign in, and offers <em>Create sign-in</em>, <em>Reset password</em>, and <em>Disable</em> or <em>Enable sign-in</em>. A directory entry and a sign-in account are still different things: somebody can be assignable without being able to log in, and usually should be.</li></ul><div class="guide-note">Nobody, including an administrator, can look up an existing password. OMS stores a salted one-way scramble, so a forgotten password is reissued rather than recovered.</div></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Standing meetings, SOP reviews, notes and logged calls</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Standing or one-off:</strong> On Calendars, <strong>Standing only</strong> shows the meetings marked <em>Recurring</em> on the event, and <strong>One-off only</strong> shows everything else. Click the same chip again to go back to everything. This is separate from category on purpose &mdash; a Chairs meeting is a Chairs meeting whether it stands or not, so cadence is its own filter rather than a second set of categories.</li><li><strong>SOPs have a review date.</strong> Set <em>Review due</em> on any procedure and the SOPs table shows it, marking anything past its date as <strong>Overdue</strong>. Leave it blank for procedures that do not need reviewing.</li><li><strong>An SOP owner is matched to the directory,</strong> the same way a task owner is. A name matching two people is refused rather than guessed at. A name matching nobody is still accepted &mdash; but nothing can remind them.</li><li><strong>Notes are added to, not typed over.</strong> Use <strong>Add note</strong> and what you write is appended on its own line with your name and the date. Whatever was already there is untouched, so two people writing on the same record no longer overwrite one another. The Notes box is still directly editable when you genuinely need to correct something.</li><li><strong>Log a call or an email OMS did not send.</strong> Open <strong>Notifications</strong> and use <em>Log a communication OMS did not send</em>. It records who, how, when and what, alongside the drafts OMS generates, so the history sits in one place. It does not send anything.</li></ul></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>What each access level can and cannot do</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Editing is genuinely enforced.</strong> A read-only account is not simply shown fewer buttons. The gateway refuses any change it sends, so read-only means read-only even if somebody works around the screen.</li><li><strong>Admin actions are genuinely enforced too.</strong> Creating, disabling or removing sign-in accounts is checked by the gateway, not just hidden from the menu.</li><li><strong>Reading is not segmented. OMS has one read tier.</strong> Every account that can sign in can see everything OMS holds &mdash; every task, event, SOP and directory entry &mdash; regardless of access level. Access levels control who can <em>change</em> things, not who can <em>see</em> them.</li><li><strong>What follows from that:</strong> anything a read-only colleague must not see does not belong in OMS. Do not put it in a note, a task title or a remark and rely on an access level to hide it. There is no setting that will.</li></ul></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Managing who can sign in</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>The Sign-in column tells you where each person stands:</strong> <em>Can sign in</em>, <em>Must set password</em> if they have not yet changed the one you issued, <em>Sign-in disabled</em>, or <em>No sign-in</em> for a directory entry with no account.</li><li><strong>Add User creates both</strong> a directory entry and a sign-in account in one step, unless you untick <em>Also create a sign-in account</em> for somebody who only needs to be assignable. The account is created first, so if it fails nothing is added at all and nobody is left listed in the directory without the sign-in you meant them to have.</li><li><strong>Create sign-in</strong> does the same for somebody already in the directory. It needs an email address, because that address <em>is</em> the sign-in id. You set the first password and it is shown once, in clear, so you can read it out. They must change it before they can use OMS.</li><li><strong>The password box is prefilled with a suggestion</strong> built from the person&#39;s surname, and you can type over it. Punctuation is stripped so it can be dictated without spelling anything out &mdash; <em>Il&#39;Giovine</em> suggests <em>Ilgiovine-OMS-2026!</em>. The same suggestion is produced whether the account is created here or issued from the gateway, so one person cannot end up with two different passwords depending on the route.</li><li><strong>Reset password</strong> issues a new one and re-arms that requirement, because a password you chose is a password you know.</li><li><strong>Disable sign-in</strong> blocks access without deleting anything, and is reversible. <strong>Deactivating or deleting someone in the directory now blocks or removes their sign-in too</strong> &mdash; previously it changed only the directory, so a deactivated person could still log in.</li><li><strong>You cannot disable or delete your own account</strong>, and you cannot remove the last active administrator. Both would leave nobody able to undo it, and there is no way back in from the outside.</li></ul><div class="guide-note">Passwords are never stored anywhere OMS can read them back. If one is lost, reset it &mdash; there is nothing to look up.</div></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Email subject lines</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Every OMS email follows one pattern:</strong> <em>OMS | HIGH PRIORITY | Due Tue 8 Sep 2026 | New assignment | &lt;task&gt; | &lt;owner&gt;</em>. <em>HIGH PRIORITY</em> appears only when the task is high priority, and the due date sits before the title on purpose &mdash; mail clients cut the subject after roughly sixty characters, and the deadline is the part worth keeping.</li><li><strong>The middle word says why you are getting it:</strong> <em>New assignment</em>, <em>Reassigned</em>, <em>Ready to start</em> when something you were waiting on is finished, or <em>Reminder</em> when a due date is close.</li><li><strong>Fixed in this release:</strong> handoff and reminder emails were leaving out <em>HIGH PRIORITY</em>, so an urgent task could be nudged with a subject that looked routine. All four kinds now come from the same place, so they cannot drift apart again.</li></ul></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Logging a new item</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>There is now a <span style="white-space:nowrap">+ New Item</span> button</strong> at the top of the CAO Visibility screen, so logging something no longer means hunting for the small + Add in a card corner.</li><li><strong>Status is a fixed list, and new work starts in <em>New</em>.</strong> It used to be a free-text box defaulting to Pending, which meant every item could spell its own state and nothing sat in an identifiable staging bucket. Existing items keep the wording they already have.</li><li><strong>Required fields are enforced.</strong> An incoming item needs an Item, a board item needs a Board and an Item, and a deadline needs a Deadline and a Due Date. Required fields are marked with a red asterisk. Previously an empty form saved a blank row, which then reached shared OMS.</li><li><strong>+ Add now works on every card.</strong> On Board and on Upcoming Deadlines that button did nothing at all &mdash; no form, no error, no clue why. Both open a proper form now.</li></ul></div></div></div></div></div>`;_guideRole=role;document.getElementById('guide').innerHTML=_guideHtml=_gh;} function openEvModal(id){
  let e=id?ST.events.find(x=>x.id===id):{source:'Ari',category:'Other',remarks:'',slides:''};MC={type:'ev',id};
  const catOpts=eventCategories().map(c=>`<option ${e.category===c?'selected':''}>${esc(c)}</option>`).join('');
  const links=id?linkedTasksHtml(id):'';
  openModal(id?'Edit Event':'Add Event',`<div class="fr"><div class="fg"><label>Title</label><input class="fc" id="f_title" value="${esc(e.title||'')}"></div><div class="fg"><label>Date</label><input type="date" class="fc" id="f_date" value="${e.date||''}"></div></div><div class="fr"><div class="fg"><label>End Date</label><input type="date" class="fc" id="f_enddate" value="${e.endDate||''}"></div><div class="fg"><label>End Time</label><input class="fc" id="f_endtime" value="${esc(e.endTime||'')}" placeholder="Optional, e.g. 4:30 PM"></div></div><div class="fr"><div class="fg"><label>Time</label><input class="fc" id="f_time" value="${esc(e.time||'')}"></div><div class="fg"><label>Source</label><select class="fc" id="f_src"><option ${e.source==='Ari'?'selected':''}>Ari</option><option ${e.source==='Maggie'?'selected':''}>Maggie</option></select></div></div><div class="fr"><div class="fg"><label>Category</label><select class="fc" id="f_cat" onchange="omsToggleNewCat(this.value==='__new__')">${catOpts}<option value="__new__">+ Add a new category...</option></select><div id="f_newcat" style="display:none;margin-top:6px"><input class="fc" id="f_cat_new" placeholder="New category name"><div class="im">Saved with the event, then offered to everyone.</div></div></div><div class="fg"><label>Location</label><input class="fc" id="f_loc" value="${esc(e.location||'')}"></div></div><div class="fr"><div class="fg"><label>Role</label><input class="fc" id="f_role" value="${esc(e.role||'')}"></div><div class="fg"><label>Organizer</label><input class="fc" id="f_org" value="${esc(e.organizer||'')}"></div></div><div class="fr"><div class="fg"><label>Remarks</label><input class="fc" id="f_rem" value="${esc(e.remarks||'')}"></div><div class="fg"><label>Slides</label><input class="fc" id="f_slides" value="${esc(e.slides||'')}"></div></div><div class="fg"><label>Cadence</label><label style="display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12px"><input type="checkbox" id="f_recurring" ${e.recurring?'checked':''}> Recurring event</label><div class="im">Kept separate from Category on purpose: a category holds one value, so folding cadence into it would force a false choice. The Outlook sync populates this field.</div></div><div class="fg"><label>Notes</label><textarea class="fc" id="f_notes">${esc(e.notes||'')}</textarea></div>${(function(){const st=recordStamp(e);return st?`<div class="im" style="margin:2px 0 8px">${esc(st)}</div>`:''})()}${links}`,'ev',id);
}
