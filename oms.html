function rGuide(){
  const role=guideRoleName();
  if(_guideHtml&&_guideRole===role){document.getElementById('guide').innerHTML=_guideHtml;return;}
  if(role!=='admin'){_guideRole=role;document.getElementById('guide').innerHTML=_guideHtml=guideFor(role);return;}
  const _gh=` <div class="guide-wrap"><div class="guide-hero"><h1>CAO Operations Management System (OMS) - User Guide</h1><p>This guide explains each screen, what it is for, and how to maintain content. OMS uses individual sign-in and shared canonical persistence through the secure gateway. Connected means shared data loaded. Saving means a change is being sent. Sync pending means accepted but awaiting canonical confirmation. Synced means canonical state confirms the change. Unsynced means the local safety copy is not yet shared. Authentication required means the temporary session is missing or expired. OMS credentials are separate from GitHub credentials and must not be shared.</p></div><div class="guide-grid"><div><div class="guide-sec"><div class="guide-sec-hd"><h2>Getting Started</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Navigation:</strong> Use the tabs to move between Dashboard, Weekly Brief, CAO Visibility, Calendars, Cadence (RoB), SOPs, Tasks, and User Guide.</li><li><strong>Saving:</strong> Connected means shared data loaded. Saving means a change is being sent. Sync pending means accepted but not yet confirmed. After canonical confirmation, a green <strong>Save successful</strong> toast appears. Unsynced means the local safety copy has not reached shared state.</li><li><strong>Concurrent edits and stale versions:</strong> OMS sends each record's base version to the gateway. If the gateway reports a conflict, stale version, version mismatch, or HTTP 409, OMS blocks the stale write, displays a conflict alert, and reloads the latest shared state. If reload fails, OMS instructs the user to refresh before editing again.</li><li><strong>Versioning:</strong> The header badge and build stamp identify the active file version and build.</li><li><strong>Print:</strong> Print outputs the current active tab in a print friendly format.</li></ul><div class="guide-note"><strong>Important:</strong> Shared canonical data is primary. Local storage is a safety fallback only. Do not close or sign out while Unsynced work exists without reviewing the warning. OMS credentials are separate from GitHub credentials and must not be shared.</div></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Screen by Screen Guide</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Dashboard:</strong> Reviews overdue items, in progress work, items for EB review, and events in the next 30 days.</li><li><strong>Weekly Brief:</strong> Builds a date based weekly summary with locations, high attention meetings, conflicts, event review, and upcoming events.</li><li><strong>CAO Visibility:</strong> Presents an executive scan with summary KPIs and section cards for cadence, inbound requests, assignments, agendas and materials, board commitments, deadlines, review items, and FYIs.</li><li><strong>Calendars:</strong> Switch between Ari's Events, Maggie's Key Dates, Tasks, and the Master Overlay. Tasks with due dates appear automatically as Task calendar items. Event pills show open/total linked Task counts when present. Open an Event to create or review linked Tasks.</li><li><strong>Cadence (RoB):</strong> Double click a month cell to edit its activity text and status. A single click deliberately does nothing &mdash; it used to cycle the status, and because a double-click fires two single clicks first, following the on-screen instruction advanced the status twice before the editor even opened. Use Add Workstream, Edit, and Delete for row management. <strong>A workstream added here now carries an identifier of its own</strong>, which is what lets it reach the shared record &mdash; before Rev 38 a new row was held only on the computer that added it, disappeared on the next reload, and held the whole session in Unsynced until then.</li><li><strong>SOPs:</strong> Search and maintain the SOP catalog. Open linked documents from the table.</li><li><strong>Tasks:</strong> Filter tasks by status and owner, search by title, and add, edit, assign, notify, or delete tasks. Tasks created from an Event retain a reciprocal source-event link. Notification drafts include Notes when populated; high-priority tasks add ! HIGH PRIORITY to the email subject and body.</li><li><strong>Admin Console:</strong> Visible to admin accounts only. Manage users (add, edit, deactivate, reactivate, delete, set access levels, issue and reset sign-ins). Changing a person's access level changes the level their sign-in account is enforced at. Deactivate blocks their sign-in and retains the directory record, and can be reversed. These controls wait for the gateway's answer before the directory record changes, so a refused change leaves everything as it was, and the change lands on the record as it stands when the answer arrives. Delete permanently removes the user from OMS, sign-in account included, and cannot be undone — admin accounts are protected from hard delete. The Revision Log section shows all build revisions with dates and summaries — the authoritative change history for OMS.</li></ul></div></div></div><div><div class="guide-sec"><div class="guide-sec-hd"><h2>How to Maintain Data</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Add a record:</strong> Use Add buttons on the relevant tab.</li><li><strong>Edit a record:</strong> Use Edit buttons in tables or cards, or double click a RoB cell.</li><li><strong>Delete a record:</strong> Use Delete or X and confirm.</li><li><strong>Print for leadership:</strong> Open the desired tab first, then click Print.</li></ul></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Assigning an owner</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Type less than the whole name.</strong> OMS matches a first name, a surname, or the part of an email before the @ &mdash; so <em>Ari</em>, <em>Ariana</em> and <em>Ball</em> all reach the same person. It only fills in the owner when exactly one person matches.</li><li><strong>If two people match, the save stops</strong> and lists them. A task has one owner, so something like <em>Hossam/Maggie</em> has to become two tasks or one specific name.</li><li><strong>Adding someone new</strong> opens a short form under the Owner box: first name, last name and email, all required. They join the People directory when the task saves, so notifications can reach them. If the email is already on file, OMS offers that person instead of creating a second copy.</li></ul></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>When a save is not really saved</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Watch the sync indicator, not the dialog.</strong> A dialog closing means the change reached this browser. It reaches the shared copy only when the indicator returns to <strong>Connected</strong> and the revision number advances. Do not reload while it reads <strong>Sync pending</strong> &mdash; that discards the change you just made.</li><li><strong>Records with no id cannot sync.</strong> If the indicator reads <strong>Unsynced</strong> and names one or more collections, changes to those records were not saved to the shared copy, even though they still appear on screen. Report it rather than repeating the edit; it needs a data fix, not a retry.</li><li><strong>Assigning a task to someone with no email.</strong> OMS now asks before saving. Cancelling stops the save so you can pick a name from the Owner list or add the address in People. Saving anyway is allowed, but no notification will exist and that owner will not be told.</li></ul></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Troubleshooting</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Authentication required:</strong> Sign in again when the temporary session expires. If an edit is Unsynced, restore connectivity and allow OMS to reconcile against the newest canonical state before repeating the edit.</li><li><strong>Hard delete vs. Deactivate:</strong> Deactivate blocks sign-in and can be reversed. Hard delete permanently removes the user record and their sign-in account from OMS — use only when a user must be completely removed. Admin accounts cannot be hard deleted.</li><li><strong>Cadence (RoB) status no longer changes on a single click:</strong> that is deliberate as of Rev 14. Double-click the month cell and set Status in the editor. A single click previously cycled status, which meant a double-click advanced the status twice before the editor opened.</li><li><strong>Popup close control:</strong> the dialog header and its close X are sticky as of Rev 14, so the close control stays visible and clickable however far you scroll inside a long dialog.</li><li><strong>Event end dates and times:</strong> End Date and End Time are optional on any event. When set, Calendar list mode shows them in the Ends column; a multi-day event shows the end date, a same-day event shows only the end time. An end date earlier than the start date is rejected on save.</li><li><strong>No notification was created:</strong> OMS creates an assignment notification only when the owner has an email address on file. As of Rev 14 it warns you instead of failing silently. Choose an existing name from the Owner list, or add the person and address in People, then save the task again.</li><li><strong>Departed staff:</strong> Deactivate the person in People or the Admin Console rather than hard deleting them. Hard delete removes the record while any task still assigned to that person keeps their name, which leaves an owner OMS can no longer resolve and no notification will be created for.</li><li><strong>Popup content is cut off:</strong> drag the popup resize handle in its lower-right corner, or use its horizontal and vertical scrollbars.</li><li><strong>Version display:</strong> The current version appears once in the left-side elliptical badge in the OMS header.</li><li><strong>Tooltips:</strong> Hover over any button or navigation tab to see a tooltip. Tooltips automatically appear above or below depending on screen position and are visible on every screen.</li><li><strong>Sticky navigation:</strong> The navigation tab bar is fixed in place while scrolling so all tabs remain accessible without returning to the top of the page. The bar auto-adjusts if the header height changes.</li><li><strong>Encoding normalization:</strong> OMS automatically converts the legacy numeric dash encoding to an en dash with surrounding spaces when canonical or local fallback data loads.</li><li><strong>Calendar source replacement:</strong> The Events workbook replaces only Ari calendar records; the Key Dates workbook replaces only Maggie calendar records. Tasks, the other calendar source, and all non-calendar collections remain unchanged. Exact duplicate title-and-date rows inside the uploaded workbook default to Skip. A safety gate blocks Maggie replacement when fewer than 10 valid rows are parsed.</li><li><strong>Calendar controls:</strong> Calendar filters, search, List/Grid, Add Event, and Print remain sticky below the fixed header while scrolling. Calendar search preserves focus for continuous typing.</li><li><strong>Event-to-Task workflow:</strong> Open an Event and select Create Linked Task. The Task inherits the Event title and date, stores the source link, and is listed in the Event with live completion progress. Deleting an Event preserves its Tasks but clears the source-event link.</li></ul></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>What is new in Rev 17</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Retired tasks:</strong> Status now offers <strong>Retired</strong> alongside Not Started, In Progress and Complete. Use it for work that was dropped or overtaken, not delivered. A Retired task never counts as overdue, and never counts towards a completion figure. It is marked with a Retired badge so it cannot be mistaken for Complete. If a task was closed as Complete but never actually delivered, change it to Retired: that is what keeps the Dashboard and the linked-task counts on an Event honest. <strong>Events and SOPs retire the same way,</strong> from a <strong>Status</strong> box on their own form. A meeting that no longer happens should be Retired rather than deleted: it stays on the calendar marked Retired, keeps its history and its linked tasks, and drops out of the 30-day count and the Weekly Brief. Delete is the only thing that destroys a record.</li><li><strong>Recurring meetings:</strong> The Event form has a <strong>Recurring</strong> checkbox. Tick it for anything that repeats. It is separate from Category on purpose: a Category holds one value, so recording it there would force a choice between, say, Cabinet and a repeating meeting. Recurring meetings carry a &#8635; marker in both grid and list view. <strong>Nothing fills this in for you</strong> &mdash; tick it on the event. What you tick by hand <strong>survives a re-import</strong>: the import preview carries it forward for any row that still matches an event OMS already holds from that source by date and title, shows a <strong>Recurring</strong> column so you can see what it worked out before anything is written, and lets you mark or unmark any row there. A row whose title or date has moved matches nothing, and starts again from the title rule. Neither workbook carries a cadence column, so a title reading Daily, Weekly, Bi-weekly, Monthly, Bi-monthly, Quarterly, Semi-annual, Standing or Recurring is also treated as recurring &mdash; <em>annual</em> deliberately is not, since an annual gala is a one-off, not a recurring meeting.</li><li><strong>Adding a category:</strong> Two ways. The Category list on the Event form ends with <strong>+ Add a new category</strong>: pick it, type the name, and save the event. Or open <strong>Categories</strong> on the Calendars screen and use <strong>Add a category</strong> there, which is the place to set one up before anything uses it. The field appears inside the Event form rather than in a second dialog, since opening a second dialog would discard the event you are editing. A category you add is saved to shared OMS, so everybody has it as soon as the save confirms, whether you add it in the Categories dialog or type it into the Category box on an event, task or SOP. It did not work that way until Rev 70: categories lived in each person's browser, so a name you invented stayed invisible to everyone else until a record happened to use it. Rev 71 finished the job by removing the browser copy altogether &mdash; anything left in one was moved into shared OMS the next time that person opened OMS.</li><li><strong>Deleting a category:</strong> The Categories dialog has a <strong>Delete</strong> button against every category that was added, and deleting a shared one removes it for everybody. It only removes one that nothing is using: if events, tasks or SOPs still carry it the dialog says how many and refuses, because the list is also built from what the records actually carry and the category would simply come back. To get rid of one that is in use, rename it into another category, which merges them. Built-in categories cannot be deleted at all; they can be renamed but stay on the list so they are always available.</li><li><strong>Renaming reaches the shared list too.</strong> A rename rewrites every event, task and SOP carrying the old name and renames the shared category itself, in one save. That is why renaming a category nothing is using still sticks.</li><li><strong>Saved views:</strong> On Calendars and on Tasks, set the filters you want and select <strong>+ Save view</strong> to name them. The named view appears as a chip; select it to re-apply, or select its &times; to remove it. Saved views live in your own browser and are yours alone, so they are not shared with the rest of the office and do not travel between machines.</li><li><strong>Multi-day events:</strong> An event with an End Date now appears in every month it touches, not only the month it starts in. The day range is clipped to the month shown, so a 30 December to 2 January event reads 30-31 in December and 1-2 in January. Continuation months carry a &#9654; marker.</li><li><strong>Calendar horizon:</strong> The grid covers an unbroken run of years. Create an event in a future year and that year, and every year between, appears automatically. There is nothing to configure.</li><li><strong>Grid legend:</strong> The Calendars grid opens with a legend. Every category color is paired with a three-letter code that also appears on the event itself, so the grid can be read without relying on color, and prints legibly in black and white.</li><li><strong>Owner ids:</strong> Tasks now store the owner&#39;s id as well as their name and address, so renaming somebody in People no longer risks breaking their notification routing. This was applied to existing tasks automatically. A task whose owner is written ambiguously, such as "Hossam/Maggie", is left untouched: OMS will not guess which person is meant.</li></ul><div class="guide-note">Not in Rev 17: the Dean briefing export (OMS-026) is still waiting on a decision about its format, and three improvements to the save path are held for Rev 18 so that a problem with them could never force a rollback of everything above.</div></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Editing categories</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Where:</strong> Calendars, then <strong>Categories</strong> in the toolbar. Editors only; read-only accounts cannot change them.</li><li><strong>Renaming:</strong> Change the name and every event using that category is updated in shared OMS. The dialog shows how many events each change will touch, and asks you to confirm before anything is saved.</li><li><strong>Merging:</strong> Rename a category so it exactly matches one that already exists and the two are merged, with every event moved across. The dialog marks these as MERGE so a merge can never happen by accident. This is how near-duplicates are cleaned up &mdash; for example <em>School of Medicine Events</em> into <em>SOM Events</em>, or <em>Chair Meetings</em> into <em>Chairs</em>.</li><li><strong>Imported events are categorized for you.</strong> The Dean’s Office Events workbook has a Category column, and most rows are blank. Rather than filing those as <em>Other</em>, OMS reads the event name and works the category out &mdash; boards, cabinets, chair meetings, FEC, CAO Rounds, HA/HS, out-of-office and School of Medicine events are all recognized. A category typed in the workbook always wins over the guess, except the word <em>Other</em>, which is treated as no answer.</li><li><strong>The workbook’s wording is translated, not copied.</strong> The spreadsheet offers <em>School of Medicine Events</em> and <em>Chair Meetings</em>; OMS stores <em>SOM Events</em> and <em>Chairs</em>. The importer maps between them, so filling in the workbook cannot create a second, near-identical category alongside one that already exists. Nobody needs to retype what is already there.</li><li><strong>Codes are automatic:</strong> The three-letter code beside each category is assigned for you and is always unique, so no two categories can ever show the same code in the calendar legend. You cannot set a code by hand, and you do not need to: rename the category and the code follows. Built-in categories keep their established codes &mdash; ADV for Advocate BOD, BSM for WFUBSM BOD, BOT for WFU BOT, BRD for Board Meeting.</li><li><strong>Built-in categories stay:</strong> A built-in can be renamed, but it remains on the list afterwards so it is always available to pick again. Its event count will read 0 until something uses it.</li><li><strong>Colors:</strong> A category you add gets a color automatically, and the same category always gets the same color for everyone. Nothing needs configuring, and a renamed category will not turn gray.</li></ul><div class="guide-note">Adding a category while editing an event still happens inside the event form, under Category. The Categories dialog is for renaming and merging what already exists.</div></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Weekly Brief and notifications</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>The Brief now opens on the current week.</strong> It used to open on whichever week was last saved, and never moved on its own &mdash; it was found opening on a week in June. The <strong>Week of</strong> picker still takes you to any week, past or future; it simply no longer sticks there for everyone the next time the page loads.</li><li><strong>Tasks due that week now appear in the Brief</strong>, under <em>Tasks Due This Week</em>, with owner, priority and status. Previously the Brief listed events only, so a week could look empty while several tasks were in fact due. Retired tasks are left out, the same as everywhere else.</li><li><strong>Notification subjects follow one standard.</strong> Every OMS email now reads <em>OMS | Due Tue 8 Sep 2026 | New assignment | &lt;task&gt; | &lt;owner&gt;</em>, with <em>HIGH PRIORITY</em> inserted straight after OMS when the task is high priority. The due date sits before the title on purpose: mail clients cut the subject after roughly sixty characters, and the deadline is the part worth keeping.</li><li><strong>Importing a workbook now warns about duplicates.</strong> The two calendar workbooks sometimes record the same event under different names &mdash; <em>White Coat Ceremony - CLT</em> against <em>White Coat - CLT</em>. The import checks incoming rows against events already held from the other workbook and lists anything that looks like a match before it replaces anything. It will not choose for you: each workbook is the authority for its own events, so you decide whether to import anyway or reconcile the workbooks first. <strong>A workbook that would shrink a calendar is also queried.</strong> If it offers fewer than half the records OMS already holds for that owner &mdash; usually because a sheet was skipped or the layout changed &mdash; the replacement has to be <strong>typed out a second time with both numbers</strong> on screen before anything is removed.</li></ul><div class="guide-note">The Brief still shows the week you pick for as long as you stay on the page. Reloading returns it to the current week.</div></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Closing OMS while a save is in flight</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>OMS now warns you before you close it with a save still in flight.</strong> Saving to shared OMS takes twenty to thirty seconds: the change is accepted, then a workflow folds it into the shared record, and only then does the status read Connected. Closing the tab in between loses the edit, and nothing retries it for you the next time you open OMS. If the browser asks whether you want to leave, the honest answer is no &mdash; wait for <strong>Connected</strong>.</li><li><strong>It also warns when earlier work is still unconfirmed</strong>, not only during the save you just made. If a previous save ended in <em>Unsynced</em>, that work is held on this browser and the warning stays until it goes through.</li><li><strong>The warning is deliberately quiet the rest of the time.</strong> You will not see it on a normal close, because a prompt that appears every time is a prompt everybody learns to dismiss.</li><li><strong>Confirmation is now noticed sooner.</strong> OMS checks for the confirmed change a few times in the first second rather than waiting a full second before looking at all. The saving is under a second: most of the wait is the shared record being updated, not OMS being slow to look.</li></ul><div class="guide-note">Still true, and worth repeating: never reload while the status reads <strong>Sync pending</strong>. Wait for Connected.</div></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Categories, sorting and checklists on Tasks</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Tasks now carry a Category</strong>, and it is the <em>same</em> list events use &mdash; not a second one. A task created from an event inherits that event&#39;s category, so everything for a board meeting can be found together. Pick <strong>+ Add a new category</strong> on the task form to add one, exactly as on an event.</li><li><strong>Renaming a category moves tasks and SOPs as well as events.</strong> The Categories dialog shows an Events count, a Tasks count and a SOPs count side by side, and the confirmation quotes all three, so you can see the full effect before anything is saved. Merging works the same way it always has.</li><li><strong>Filter by category</strong> using the new dropdown beside Owner. It lists only categories that are actually in use on tasks, so it does not fill up with meeting types nothing is assigned to.</li><li><strong>Sort by clicking a column heading.</strong> Title, Owner, Category, Due, Priority and Status are all sortable; click once for ascending, again to reverse. An arrow marks the column in use. Priority sorts High, Medium, Low and Status sorts by urgency &mdash; alphabetical order would read High, Low, Medium, which helps nobody. A task with no due date sorts to the bottom rather than the top.</li><li><strong>Checklist</strong> prints the tasks currently shown, grouped by the event each belongs to, with a box to tick, plus owner, due date, status, category and notes. It respects whatever filters and sort you have set, so narrow the list first and the checklist matches. Tasks not linked to an event are grouped at the end &mdash; they are never left out.</li></ul><div class="guide-note">Saved views now remember the category filter and the sort as well as status, owner and search. Views saved before this release still work; they simply carry no sort and open on the default order.</div></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Dependencies, handoffs and reminders</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>A task can now wait on another task.</strong> Set <em>Waiting on</em> in the task form. While the other task is still open, this one shows as <strong>Blocked</strong> rather than Not Started, so it is obvious that nobody can start it yet. Blocked is shown instead of Overdue when both apply, because the useful fact is that the work cannot begin &mdash; the due date still shows in red, so lateness is not hidden.</li><li><strong>Completing the thing it waits on sends a handoff.</strong> When you mark a task Complete, anyone who owns a task that was waiting on it gets a notification draft saying it is now theirs to start. This is the remarks-to-slides handoff. It fires only when the task <em>becomes</em> Complete, so re-saving a finished task does not send it again.</li><li><strong>Work that was dropped does not block anything.</strong> A prerequisite marked <em>Retired</em> counts as closed, exactly like Complete. Otherwise abandoning one task would freeze everything behind it with no way out. The same applies if the prerequisite is deleted.</li><li><strong>Reminders are on a button, not automatic.</strong> <em>Remind</em> on the Tasks screen shows how many tasks are due in the next three days and queues a draft for each. It asks first and lists what it will create. Clicking it twice does not duplicate anything; changing a due date does earn a fresh reminder.</li><li><strong>Nothing sends itself.</strong> Every one of these is a draft in Notifications for you to review and send, the same as an assignment notification.</li></ul><div class="guide-note">Reminders are deliberately not created when you open OMS. Doing that would write to shared OMS every time anyone loaded the page, and two people opening it at once would race to create the same reminder. Already-overdue tasks are left out too &mdash; the Dashboard already surfaces those, and a reminder about something that is already late is noise.</div></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Who changed what</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Records now say who last edited them.</strong> Open a Task or an Event and a small line under Notes reads <em>Last edited by &lt;name&gt; on &lt;date&gt;</em>. This was never new information &mdash; shared OMS has been recording it on every save all along &mdash; it simply had nowhere to appear.</li><li><strong>Assignment history is visible at last.</strong> A Task that has changed owner shows the full trail inside its own dialog: when, whether it was a first assignment or a reassignment, and to whom. The Admin Console carries the same trail across every task.</li><li><strong>If a name cannot be resolved you will see the raw account id</strong> rather than a blank. That is deliberate: a blank would suggest nobody edited the record, which would be false.</li></ul><div class="guide-note">This is a read of what was already stored, not new tracking. Nothing extra is recorded, and the editor stamp is still stripped from what OMS sends when you save &mdash; it belongs to shared OMS, which sets it, and must not be sent back as if it were an edit you made.</div></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Passwords and the forced change</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Initial passwords follow a predictable form</strong> and are therefore guessable by anyone who works out the shape, which is why every one of them must be replaced before the account can change anything. The form is deliberately not written down here: this guide is served from a public page</li><li><strong>Sign-in holds at a change-password screen</strong> when the account is flagged, and there is no way past it. An older session carrying the flag is cleared rather than honored, so a session opened before the change cannot be used to skip it.</li><li><strong>The current password is required to set a new one.</strong> A stolen session on its own must not be enough to lock the real owner out of their own account.</li><li><strong>Sign-in accounts are now managed from the Admin Console.</strong> Each row shows whether that person can sign in, and offers <em>Create sign-in</em>, <em>Reset password</em>, and <em>Disable</em> or <em>Enable sign-in</em>. A directory entry and a sign-in account are still different things: somebody can be assignable without being able to log in, and usually should be.</li></ul><div class="guide-note">Nobody, including an administrator, can look up an existing password. OMS stores a salted one-way scramble, so a forgotten password is reissued rather than recovered.</div></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>If a save says Unsynced</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Read which of the two it is &mdash; the banner says.</strong> <em>Your change reached shared OMS</em> means it is safely with the service and only the fold into the shared record is still to come. <em>did not reach shared OMS</em> means it is still only on this computer, and waiting will not change that.</li><li><strong>If it reached shared OMS, do nothing.</strong> <strong>OMS keeps checking every few seconds until it does</strong>, then clears the banner and shows <em>Save confirmed</em> by itself. You do not have to refresh the page to find out. Reloading is harmless here, but it is not needed. A save that touches several records &mdash; a task with an owner is the task, its notification and its history row &mdash; is sent to shared OMS as one request, so either all of it reaches the service or none of it does, and it is folded in by one run rather than three. While a save confirms, OMS asks shared OMS only for its revision number and reads the full record only once that number has moved. If the shared record is holding a change that could not be folded in, the Connected banner says so; that is for an administrator, and your own saves are unaffected.</li><li><strong>If it did not reach shared OMS, do not reload.</strong> That would discard the edit. Press Save again once the connection is back.</li><li><strong>You can keep working while a save is confirming.</strong> An edit made while an earlier one is still confirming is kept and sent as soon as that one lands. If a save could not reach shared OMS at all and the page is then reloaded, the reload cannot restore it: the banner says so, with the time of the work that was lost, instead of asking you to stay on a page that no longer holds it. Do not repeat the <em>same</em> edit: that is how one change becomes two, and the first one is not lost. A save refused because the account is read-only, or because its password has not been set yet, leaves nothing pending: there is no prompt on leaving the page, because nothing typed could have been saved.</li><li><strong>The counters on the Dashboard are buttons.</strong> Overdue Items, Due in 3 Days and In Progress each open the task list already filtered to what they counted, and Events Next 30 Days opens the calendar. <strong>Due in 3 Days</strong> is the one to watch: overdue work is already late, and this is the work that can still be finished on time.</li><li><strong>Mine narrows the Dashboard to your own work.</strong> The Everyone and Mine chips at the top scope the three task counters, Overdue Items, Due in 3 Days and In Progress, to the tasks you own; the cards below them are office-wide. It is matched through the staff directory rather than by spelling, so it still finds you where the calendar says Ari and the address book says Ariana. Pressing a counter with Mine on opens the task list with its Owner filter set to <em>Mine (owned by you)</em>, which is matched the same way, so the number and the list agree.</li><li><strong>You can change the status of several tasks at once.</strong> Tick the box beside each task on the Tasks screen, or the box in the heading row to take every task the filter is showing, then choose a status in the bar that appears. It asks first, applies only to the rows the current filter shows, and sends the whole change to shared OMS as one save.</li><li><strong>On the Tasks screen, Copy makes a second record from one you already have.</strong> Use it for work that comes round again. The copy takes a new name ending in (copy), starts at Not Started, is not waiting on anything, and opens for you to edit. It is saved to shared OMS straight away, so Cancel on the dialog does not remove it; if you did not mean to keep it, delete the copy. No notification is sent to anybody.</li><li><strong>The page tells the browser which servers it may talk to.</strong> Both OMS pages carry a Content Security Policy naming the one gateway they may call and the one address the spreadsheet library may load from, and forbidding plugins, frames from other pages and any change to the page's base address. Because OMS is a single file with its scripts inside it, the policy cannot forbid inline script, so it does not stop an injected script from running; its value is that such a script could not send anything anywhere except the gateway. GitHub Pages cannot set response headers, so the policy is a tag in the page.</li><li><strong>A search box you type into keeps the cursor.</strong> The boxes on Tasks, SOPs and Calendars filter the list as you type, which redraws the list underneath them. The box keeps focus and your cursor keeps its place, so a search can be typed straight through, corrected in the middle of a word, or pasted into, like any other field. Until Rev 67 those three boxes took one letter and then dropped focus to the page, so a search had to be typed one letter and one click at a time. The box in the header never redraws the page at all, so it was never affected. The same now holds for the filter dropdowns on those screens and the week picker on the Weekly Brief: after a choice the keyboard stays on the control you just used, instead of jumping back to the top of the page.</li><li><strong>One search box finds everything.</strong> The box in the header searches tasks, events, SOPs and people at once, and the results are grouped by type in that order, at most five per group. Matches that start with what you typed rank above matches that merely contain it, and a match in a title ranks above a match in an owner, note or location. Enter opens the highlighted result, the first by default; the arrow keys move the highlight; Escape clears the box. It adds to the search boxes on each screen, which still filter their own table in place, and does not replace them.</li><li><strong>Task templates create the standard tasks for an event.</strong> A template, kept under <em>Task templates</em> in the Categories dialog on the Calendars tab, names the tasks an event of one category always needs, each with its days before or after the event, an owner and a priority. When an event of that category is added by hand, the Add Event dialog offers to create them as linked tasks dated from the event; untick the box to add the event alone. Imported events never trigger a template, so a re-import cannot multiply tasks, and editing an event never applies one. The tasks are ordinary linked tasks: no notification drafts are written for them, and deleting a template later keeps the tasks it already made. Template changes are saved with their own Save template button, separately from category renames.</li><li><strong>OMS is usable on a phone, and designed for a desk.</strong> On a screen narrower than about 600 pixels the header wraps instead of running off the edge, the counters and cards stack in one column, the tab bar scrolls sideways, tables scroll inside their own frame, and form fields are sized so the phone does not zoom in when you tap one. Checked at 375 and 768 pixels on 7 Sept 2026; the calendar grid and the Cadence grid are still easier to read on a tablet or larger.</li><li><strong>Any grid can be exported to a spreadsheet, and the export can be narrowed to a date range.</strong> Tasks, Calendars, SOPs, Cadence and the Admin directory each have an Export button. On Tasks, Calendars, SOPs and Cadence it opens a dialog first: choose From and To, or leave both blank for everything shown. Tasks range on the due date, Calendars on the event date, SOPs on the review due date, and Cadence on the month columns the range spans &mdash; that grid records a month and no year, so twelve months or more writes every month. A multi-day event is included when any of its days fall inside the range. There is no date range on the Admin directory, because a person record carries no date, so the whole directory is written. The file holds the rows as the screen shows them, following the current filter and sort, and a second sheet named About this export records the screen, the date range, the filter, how many rows the range left out, who exported it, when, and the canonical revision it was exported at. Calendars export the list whichever view is showing. Rows with no date are left out while a range is set, and the second sheet of the file counts them, so a short export is never a silent one. The range is remembered until you reload the page, and it is shown in the dialog before anything is written. It is a copy: changes made in the spreadsheet do not reach OMS.</li><li><strong>OMS reopens where you left it.</strong> The tab you were on and the filters you set are remembered on this computer, so a screen you use every day is waiting for you rather than needing to be rebuilt. It is per browser and is never shared, and if your access level changes you are returned to the Dashboard instead of a tab you can no longer open.</li><li><strong>Save and Cancel stay in view.</strong> On a long dialog the footer with the buttons stays at the bottom of the window while the fields scroll; you do not have to scroll to the end to save.</li><li><strong>Links are checked before they are followed.</strong> A link saved on a record is kept only if it is a web (http, https) or mailto link; a bare address such as <em>example.org/page</em> is stored as https. Anything else is refused when you save, and an old value of any other shape shows as text rather than a link.</li><li><strong>Signing out also clears the local copy.</strong> OMS keeps a copy of shared data on this browser so it can show something if the gateway is unreachable. Sign Out removes that copy along with the session, so nothing readable is left behind on a shared machine. It is rebuilt at the next sign-in. Saved views and remembered categories are yours and stay.</li><li><strong>A Key Dates sheet that does not state its year is asked for its period.</strong> Instead of refusing the file, the Import screen asks for the start and end of the period the sheet covers, reads the dates into that period, and reports how many rows the sheet placed outside it and how many carried a date it could not read, as two separate counts. The period may be as long as the sheet needs; there is no upper limit. A sheet that does state its year is read as before.</li><li><strong>Incoming, For Review, Board and Deadline rows can be edited.</strong> Each row has Edit beside Delete; the dialog is the one used to add the row, prefilled, and saving changes only what you changed.</li><li><strong>Your role is confirmed with the gateway at sign-in</strong>, and an account that still has to set its password is sent back to the sign-in page to do so before it sees anything else.</li><li><strong>The spreadsheet reader is verified before it runs.</strong> Importing a workbook uses <strong>the one piece of code OMS loads from anywhere but itself</strong>, and the browser now checks it against a fingerprint and refuses to run it if it has changed. Nothing about importing is different; it is simply no longer possible for that file to be swapped out underneath you.</li><li><strong>Other people's changes arrive on their own.</strong> While OMS is open and idle it looks for new shared work about once a minute and brings it in, so a colleague's task appears without you saving or reloading. It never does this while you have unsaved work, a save in flight, or a dialog open &mdash; and a tab in the background stops looking until you come back to it.</li><li><strong>Two people can edit the same record at once, as long as they touch different fields.</strong> A save now sends only what you actually changed, so your edit to the notes and somebody else's to the due date both survive. Editing the <em>same</em> field is still a conflict, and OMS still tells you &mdash; naming the record and the fields. When that happens only the change to that record is set aside; everything else in the same save still goes through.</li><li><strong>The checking slows down, it does not stop.</strong> The first couple of minutes are checked every few seconds, and after that OMS keeps watching in the background at a slower rate &mdash; a confirmation an hour later is still noticed. It says so on the banner when it changes pace, and at that point reloading is safe if you would rather look than wait.</li><li><strong>OMS will not re-send it either.</strong> If you save something else while an earlier change is still confirming, only the new one is sent &mdash; the earlier one is already with shared OMS and <strong>is not sent twice</strong>. Confirmation then waits for both, so <em>Connected</em> never appears while any part of your work is still outstanding.</li><li><strong>Confirmed means your change is really there.</strong> OMS checks that the shared record holds what you asked for, not merely that something somewhere changed. So a colleague saving at the same moment no longer counts as confirmation of your save, and if somebody edited the same field first you are told your change was not applied and shown the latest version &mdash; rather than being told it saved.</li><li><strong>Keep working if you want to.</strong> If you edit something else while it is still confirming, OMS will not overwrite what you are typing &mdash; it waits, and your next save carries everything.</li><li><strong>The one it cannot fix by waiting</strong> is <em>Authentication required</em>, which means the session expired. Sign in again; your local work is still on this browser.</li></ul></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Recurring meetings, SOP reviews, notes and logged calls</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Out-of-office entries appear like any other event.</strong> They record when the Dean is away rather than a meeting to attend, and there is one row per day of an absence. Until Rev 68 they were hidden behind a chip; they are now shown by default and carry their own category badge, so they can be searched, filtered by category and exported like anything else.</li><li><strong>Recurring or one-off:</strong> On Calendars, the <strong>&#8635; Recurring</strong> chip shows the meetings marked <em>Recurring</em> on the event, and <strong>One-off only</strong> shows everything else. Click the same chip again to go back to everything. This is separate from category on purpose &mdash; a Chairs meeting is a Chairs meeting whether it repeats or not, so cadence is its own filter rather than a second set of categories.</li><li><strong>SOPs have a review date.</strong> Set <em>Review due</em> on any procedure and the SOPs table shows it, marking anything past its date as <strong>Overdue</strong>. Leave it blank for procedures that do not need reviewing. Anything due within the next 30 days, or already past its date, is also listed under <strong>SOP Reviews Due</strong> on the Dashboard, so a lapsed procedure is visible without opening the SOPs tab.</li><li><strong>SOPs carry a category,</strong> chosen from the same list events and tasks use &mdash; deliberately the same list, so a procedure can be found alongside the work it governs and there is only one set of names to keep tidy. The SOPs table can be filtered by it, and a category invented on an SOP is offered everywhere afterwards.</li><li><strong>Searching SOPs reads the notes too,</strong> not only the process name and the owner, so a procedure can be found by something written about it rather than only by what it is called.</li><li><strong>An SOP owner is matched to the directory,</strong> the same way a task owner is: a name matching two people is refused rather than guessed at, and a name matching nobody is still accepted. Unlike a task owner, an SOP owner is never emailed by OMS at all. A review that is due or overdue shows on the SOPs table and in <strong>SOP Reviews Due</strong> on the Dashboard, and that is the whole of it.</li><li><strong>Notes are added to, not typed over.</strong> Use <strong>Add note</strong> and what you write is appended on its own line with your name and the date. Whatever was already there is untouched, so two people writing on the same record no longer overwrite one another. The Notes box is still directly editable when you genuinely need to correct something.</li><li><strong>Log a call or an email OMS did not send.</strong> Open <strong>Notifications</strong> and use <em>Log a communication OMS did not send</em>. It records who, how, when and what, alongside the drafts OMS generates, so the history sits in one place. It does not send anything.</li></ul></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>What each access level can and cannot do</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Editing is genuinely enforced.</strong> A read-only account is not simply shown fewer buttons. The gateway refuses any change it sends, so read-only means read-only even if somebody works around the screen.</li><li><strong>Admin actions are genuinely enforced too.</strong> Creating, disabling or removing sign-in accounts is checked by the gateway, not just hidden from the menu.</li><li><strong>A refused save now says why.</strong> If a read-only account tries to change something, the banner reads <strong>Read only</strong> and says nothing was saved &mdash; it used to say the session had expired, which was untrue and sent people to sign in again for no reason. If an account has not yet set its own password, the banner reads <strong>Password change required</strong>. In both cases the edit stays on screen and OMS stops pretending that waiting or retrying will help.</li><li><strong>An initial password has to be replaced before you can change anything.</strong> Until it is, the account can read OMS normally but not save. The box that sets it appears on the sign-in page, so if you are already signed in, <strong>sign out and sign in again</strong> and OMS will ask you for one.</li><li><strong>Reading is not segmented. OMS has one read tier.</strong> Every account that can sign in can see everything OMS holds &mdash; every task, event, SOP and directory entry &mdash; regardless of access level. Access levels control who can <em>change</em> things, not who can <em>see</em> them.</li><li><strong>What follows from that:</strong> anything a read-only colleague must not see does not belong in OMS. Do not put it in a note, a task title or a remark and rely on an access level to hide it. There is no setting that will.</li></ul></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Managing who can sign in</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>The Sign-in column tells you where each person stands:</strong> <em>Can sign in</em>, <em>Must set password</em> if they have not yet changed the one you issued, <em>Sign-in disabled</em>, or <em>No sign-in</em> for a directory entry with no account.</li><li><strong>Add User creates both</strong> a directory entry and a sign-in account in one step, unless you untick <em>Also create a sign-in account</em> for somebody who only needs to be assignable. The account is created first, so if it fails nothing is added at all and nobody is left listed in the directory without the sign-in you meant them to have.</li><li><strong>Create sign-in</strong> does the same for somebody already in the directory. It needs an email address, because that address <em>is</em> the sign-in id. You set the first password and it is shown once, in clear, so you can read it out. They must change it before they can use OMS.</li><li><strong>The password box is prefilled with a suggestion</strong> built from the person&#39;s surname, and you can type over it. Punctuation is stripped so it can be dictated without spelling anything out &mdash; an apostrophe in a surname is flattened rather than spelled out. The same suggestion is produced whether the account is created here or issued from the gateway, so one person cannot end up with two different passwords depending on the route.</li><li><strong>Reset password</strong> issues a new one and re-arms that requirement, because a password you chose is a password you know.</li><li><strong>Disable sign-in</strong> stops the next sign-in without deleting anything, and is reversible. <strong>Deactivating or deleting someone in the directory now blocks or removes their sign-in too</strong> &mdash; previously it changed only the directory, so a deactivated person could still log in.</li><li><strong>It ends a session that is already open, within about a minute.</strong> Disabling, deleting or moving somebody to read-only takes effect on their next action, not at their next sign-in &mdash; the service checks the account itself rather than trusting the pass they were issued when they signed in. There is no need to ask anyone to sign out, and no need to rotate anything.</li><li><strong>You cannot disable or delete your own account</strong>, and you cannot remove the last active administrator. Both would leave nobody able to undo it, and there is no way back in from the outside.</li></ul><div class="guide-note">Passwords are never stored anywhere OMS can read them back. If one is lost, reset it &mdash; there is nothing to look up.</div></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Email subject lines</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>Every OMS email follows one pattern:</strong> <em>OMS | HIGH PRIORITY | Due Tue 8 Sep 2026 | New assignment | &lt;task&gt; | &lt;owner&gt;</em>. <em>HIGH PRIORITY</em> appears only when the task is high priority, and the due date sits before the title on purpose &mdash; mail clients cut the subject after roughly sixty characters, and the deadline is the part worth keeping.</li><li><strong>The middle word says why you are getting it:</strong> <em>New assignment</em>, <em>Reassigned</em>, <em>Ready to start</em> when something you were waiting on is finished, or <em>Reminder</em> when a due date is close.</li><li><strong>Fixed in this release:</strong> handoff and reminder emails were leaving out <em>HIGH PRIORITY</em>, so an urgent task could be nudged with a subject that looked routine. All four kinds now come from the same place, so they cannot drift apart again.</li></ul></div></div><div class="guide-sec"><div class="guide-sec-hd"><h2>Logging a new item</h2></div><div class="guide-sec-bd"><ul class="guide-list"><li><strong>There is now a <span style="white-space:nowrap">+ New Item</span> button</strong> at the top of the CAO Visibility screen, so logging something no longer means hunting for the small + Add in a card corner.</li><li><strong>Status is a fixed list, and new work starts in <em>New</em>.</strong> It used to be a free-text box defaulting to Pending, which meant every item could spell its own state and nothing sat in an identifiable staging bucket. Existing items keep the wording they already have.</li><li><strong>Required fields are enforced.</strong> An incoming item needs an Item, a board item needs a Board and an Item, and a deadline needs a Deadline and a Due Date. Required fields are marked with a red asterisk. Previously an empty form saved a blank row, which then reached shared OMS.</li><li><strong>+ Add now works on every card.</strong> On Board and on Upcoming Deadlines that button did nothing at all &mdash; no form, no error, no clue why. Both open a proper form now.</li></ul></div></div></div></div></div>`;_guideRole=role;document.getElementById('guide').innerHTML=_guideHtml=_gh;} function openEvModal(id){
  let e=id?ST.events.find(x=>x.id===id):{source:'Ari',category:'Other',remarks:'',slides:''};MC={type:'ev',id};
  const catOpts=eventCategories().map(c=>`<option ${e.category===c?'selected':''}>${esc(c)}</option>`).join('');
  const links=id?linkedTasksHtml(id):'';
  openModal(id?'Edit Event':'Add Event',`<div class="fr"><div class="fg"><label for="f_title">Title</label><input class="fc" id="f_title" value="${esc(e.title||'')}"></div><div class="fg"><label for="f_date">Date</label><input type="date" class="fc" id="f_date" value="${esc(e.date||'')}"></div></div><div class="fr"><div class="fg"><label for="f_enddate">End Date</label><input type="date" class="fc" id="f_enddate" value="${esc(e.endDate||'')}"></div><div class="fg"><label for="f_endtime">End Time</label><input class="fc" id="f_endtime" value="${esc(e.endTime||'')}" placeholder="Optional, e.g. 4:30 PM"></div></div><div class="fr"><div class="fg"><label for="f_time">Time</label><input class="fc" id="f_time" value="${esc(e.time||'')}"></div><div class="fg"><label for="f_src">Source</label><select class="fc" id="f_src"><option ${e.source==='Ari'?'selected':''}>Ari</option><option ${e.source==='Maggie'?'selected':''}>Maggie</option></select></div></div><div class="fr"><div class="fg"><label for="f_cat">Category</label><select class="fc" id="f_cat" onchange="omsToggleNewCat(this.value==='__new__');omsRefreshTemplateOffer(this.value)">${catOpts}<option value="__new__">+ Add a new category...</option></select><div id="f_newcat" style="display:none;margin-top:6px"><input class="fc" id="f_cat_new" placeholder="New category name"><div class="im">Saved with the event, then offered to everyone.</div></div></div><div class="fg"><label for="f_loc">Location</label><input class="fc" id="f_loc" value="${esc(e.location||'')}"></div></div><div class="fg" id="f_tpl_block">${id?'':omsTemplateOfferHtml(e.category)}</div><div class="fr"><div class="fg"><label for="f_role">Role</label><input class="fc" id="f_role" value="${esc(e.role||'')}"></div><div class="fg"><label for="f_org">Organizer</label><input class="fc" id="f_org" value="${esc(e.organizer||'')}"></div></div><div class="fr"><div class="fg"><label for="f_rem">Remarks</label><input class="fc" id="f_rem" value="${esc(e.remarks||'')}"></div><div class="fg"><label for="f_slides">Slides</label><input class="fc" id="f_slides" value="${esc(e.slides||'')}"></div></div>${omsStatusField('f_ev_status',e.status)}<div class="fg"><label>Recurring</label><label style="display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12px"><input type="checkbox" id="f_recurring" ${e.recurring?'checked':''}> Recurring meeting</label><div class="im">Kept separate from Category on purpose: a category holds one value, so folding this into it would force a false choice. Nothing fills this in for you &mdash; tick it here. It is then carried forward when that source is re-imported, for any row that still matches this event by date and title; a row whose title or date has moved matches nothing and starts again from the title rule. The import preview shows what it worked out for every row before anything is written.</div></div><div class="fg"><label for="f_notes">Notes</label><textarea class="fc" id="f_notes">${esc(e.notes||'')}</textarea></div>${(function(){const st=recordStamp(e);return st?`<div class="im" style="margin:2px 0 8px">${esc(st)}</div>`:''})()}${links}`,'ev',id);

  omsIntakeUpsert('deadlines',o);closeModal();save();rDash();rBoard();
} else if(t==='robws'){ const ws=gv('f_rob_ws').trim(); if(!ws){alert('Workstream name required');return}
  /* Rev 38. This branch used to push {ws,cells,st} with NO id, which is the
     exact defect the 5 Sept 2026 migration was run to clear out of gw and rob.
     The migration repaired the rows that existed; nothing repaired the code
     that makes new ones. OMS_MAP keeps a record only when id != null and both
     sides of the sync diff use it, so a workstream added here emitted no
     operation in any direction: it never reached canonical, it vanished on the
     next reload, and the Rev 15 guard held the whole session in Unsynced
     naming rob for as long as the row was in ST.
     The condition was also wrong on its own terms - `id===0 || id!==null` is
     true for every value except null, including undefined, so a modal opened
     without an index would have indexed ST.rob by undefined. Number.isInteger
     is the same test openRobWsModal uses to decide Add versus Edit. */
  if(Number.isInteger(id)&&ST.rob[id]){ST.rob[id].ws=ws}
  else{ST.rob.push({id:omsRobId(ws),ws:ws,cells:Array(12).fill(''),st:Array(12).fill('')})}
  closeModal();save();rRoB();   } else if(t==='acct'){
    const p=(ST.people||[]).find(x=>x.id===id);if(!p){closeModal();return}
    const pw=gv('acct_pw');
    if(String(pw||'').length<12){alert('The password must be at least 12 characters.');return}
    const creating=MC.mode==='create';
    (async()=>{
      try{
        if(creating){const chosen=gv('acct_role')||'editor';await omsAccountAction('create',{id:String(p.email).toLowerCase(),displayName:p.name,role:chosen,password:pw});/* Rev 52 (A-11); Rev 56: re-resolve after the await */const p2=(ST.people||[]).find(x=>x.id===id)||p;p2.accessRole=chosen;_dirty.add('people');save();}
        else{const a=omsAccountFor(p.email);if(!a)throw new Error('That person has no sign-in account.');
             await omsAccountAction('reset',{id:a.id,password:pw});}
        closeModal();rAdmin();
        alert((creating?'Sign-in created for ':'Password reset for ')+p.name+'.\n\nId: '+String(p.email).toLowerCase()+'\nPassword: '+pw+'\n\nGive them this once. They must change it before using OMS, and it cannot be looked up later.');
      }catch(e){alert(e.message)}
    })();
    return;
} else if(t==='adminUser'){saveAdminUser(null);return;
  } else if(t==='adminEditUser'){saveAdminUser(id);return;
  } else if(t==='robcell'){ const parts=String(id).split(':'); const ri=parseInt(parts[0],10), ci=parseInt(parts[1],10); if(Number.isNaN(ri)||Number.isNaN(ci)){alert('Unable to update cell');return} ST.rob[ri].cells[ci]=gv('f_rob_cell'); ST.rob[ri].st[ci]=gv('f_rob_status'); closeModal();save();rRoB(); } } function delEv(id){const links=linkedTasks(id);const msg=links.length?`Delete this event? ${links.length} linked Task(s) will be preserved but their source-event link will be cleared.`:'Delete event?';if(!confirm(msg))return;links.forEach(t=>{t.sourceEventId='';t.sourceEventTitle='';});ST.events=ST.events.filter(x=>x.id!==id);save();rCal();rTasks();} function delItem(arr,id){
  if(!confirm('Delete?'))return;
  /* Rev 24 (OMS-013). Clear the reference before removing the record, the same
     way deleting an Event clears sourceEventId on its Tasks. A dangling
     dependsOn would not block - isBlocked treats it as unblocked - but it

  if(arr==='tasks'){(ST.tasks||[]).forEach(t=>{if(t&&String(t.dependsOn||'')===String(id))t.dependsOn=''})}
  ST[arr]=ST[arr].filter(x=>x.id!==id);save();renderAll()
}

const OMS_REV_LOG=[
  {rev:74,date:'2026-09-09',summary:'Rev 74 (OMS-026). The export takes a date range. Rev 63 gave every grid an Export button and it wrote everything the screen showed, which is why the row stayed open: a Dean briefing wants one week or one quarter, and the only thing in OMS that could narrow by date was the Weekly Brief, which prints and produces no file.\n\nWHAT IT DOES. The Export button on Tasks, Calendars, SOPs and Cadence opens a dialog first. Choose From and To, or leave both blank and it exports everything the screen shows, exactly as before. Tasks range on the due date, Calendars on the event or task date, SOPs on the review due date. Cadence ranges on the month COLUMNS the range spans, because that grid records a month and no year; twelve months or more writes every month, and a range across the year end selects its months in the grid\'s own order. A multi-day event is included when any of its days fall inside the range, not only when it starts inside it, so a conference straddling the boundary is not lost - and the export asks calEventEnd where an event ends rather than keeping a fourth copy of that rule.\n\nTHE ADMIN DIRECTORY HAS NO RANGE, and says so. A person record carries no date, so there is nothing to range on; its button still exports at once, its tooltip and the User Guide state the reason, and its About sheet fills the Date range cell with that reason rather than leaving it blank. A binding refuses to let the Directory be wired to the dialog while those three pieces of text stand.\n\nTHE RANGE NARROWS, IT DOES NOT REPLACE. omsRangeSplit is applied on top of omsTaskRows, omsCalItems and omsSopRows, which still decide what is in scope, so the Rev 63 rule holds in the direction that matters: a screen filter cannot be honored on screen and ignored in the file. With no range chosen omsRangeSplit is not a filter at all - it hands the list straight back, undated rows included - and that first line is load-bearing, because a task with no due date must not quietly leave every export in the system. Only a range somebody typed can drop a row.\n\nA SHORT EXPORT IS NEVER A SILENT ONE. The About sheet now records the range in words, how many rows fell outside it, and how many carried no date at all; the Filter and sort cell carries the range too, so one cell tells the whole story; and the toast says how many rows the range left out. A range that matches nothing is refused by name - "no row falls inside 9/1/2026 to 9/30/2026" - rather than writing a header-only spreadsheet, and the range is left set so it can be widened.\n\nWHY A DIALOG AND NOT TWO BOXES IN THE TOOLBAR. The Rev 44 idle refresh redraws every screen every sixty seconds and would wipe a half-typed date; OMS_MODAL_OPEN() is what holds it off, and only a dialog is behind that guard. The shared modal footer\'s Save belongs to saveModal and would sync nothing here, so the dialog hides it and carries its own Export, Clear the range and Cancel; openModal restores it for the next dialog, which is the trap in hiding it at all and has its own assertion. The chosen range is remembered while the page is open, because a briefing range is usually the same range on Calendars and on Tasks, and the dialog always shows it before anything is written, so it can never be applied unseen. It is deliberately not stored: a reload starts blank rather than cropping tomorrow\'s export to last week.\n\nTEXT AND GUARDS. Four Rev 63 reachability bindings moved with the wiring and check 12 caught all four the moment it changed; the on-screen proof they carried is now one binding that requires the dialog inside rTasks, rCal, rSOPs and rRoB, which is stronger than four separate existence checks. The editor and read-only guide never mentioned export at all, though both accounts have the button - reading the screen and reading the file are the same permission - and now carry it, in a section renamed Printing and exporting. GATE CHECK 17 is new: test/export_range_negative.py breaks the artifact seven ways and requires the smoke suite to catch each, because three of the four things the interface now promises are promises about what OMS does NOT do, and those are worth only as much as a check that would notice them starting to be false.\n\nVERIFIED LIVE against the shipped artifact and a copy of canonical at revision 113, in a local read-only harness: Calendars 293 items narrowed to 30 for September 2026 with 263 recorded as left out; Tasks 18 to 9 with the range carried across from Calendars and shown in the dialog first; Cadence writing Oct, Nov and Dec only, seven workstreams, "3 of 12" columns; the Directory 8 rows with the range explicitly not applicable; an empty range refused with no file written; the footer back on the next ordinary dialog. Canonical revision unchanged and no collection dirty after every probe, so nothing was written. The multi-day overlap could not be exercised on live data because canonical holds no multi-day event; it is covered by the smoke suite and by mutant two of check 17.'},
  {rev:73,date:'2026-09-08',summary:'Rev 73 (DEC-033). The SOP Owner field and the User Guide both said an owner matching nobody was still accepted but no reminder could reach them, which reads as though a matched owner could be reminded. None can, and none ever could: every writer of ST.notifications is a task path, the SOP save branch ends at rSOPs() and queues nothing, and nothing anywhere reads a SOP\'s stored address. Both strings now say what actually happens - an ambiguous name is refused, an unmatched name is accepted, no SOP owner is emailed, and a review that is due or overdue shows on the SOPs table and in SOP Reviews Due on the Dashboard. The SOP record keeps ownerId and ownerEmail, unread and now marked as such at the write site, because dropping a field from canonical is a migration with nothing to gain and ownerId is what would make an owner resolvable if an SOP reminder is ever built. New gate check 16 mutates the artifact four ways and requires the suite to catch each, because a claim about what the software does NOT do is worth only as much as a check that would notice it starting to. User Guide updated.'},
  {rev:72,date:'2026-09-08',summary:'Rev 72 (FAB-48, found while fact-checking an email). A task keeps its own copy of its owner\'s address and nothing kept that copy true: correcting somebody in People touches no task, Copy clones whatever the source held, and the boot backfill only fills an address that is MISSING, never one that is wrong. Two records reassigned away from their previous owner still carried her address, so Remind on a task the grid showed as somebody else\'s would have drafted the email to her. All three notification builders now resolve the recipient through omsOwnerAddress when the draft is built - owner name first, then ownerId so a renamed person still routes, then the stored copy - and never write the correction back, because a write on a read is the Rev 50 trap. Resolution tries active people then inactive ones, and uses exact rungs only, so the directory\'s three-character prefix match cannot decide where mail goes. A reminder already queued to a superseded address is retired rather than left live, both on reassignment and on the next Remind. Gate check 7 rebuilt: it grepped the diff for guide markup and so could not see a sentence added to a guide section, while any edit touching one of two long lines counted; it now hashes the guide\'s brace-matched source region, with its own negative control. User Guide updated.'},
  {rev:71,date:'2026-09-08',summary:'Rev 71 (Hossam\'s instruction: a category is canonical, not something that lives in a browser). Rev 70 made new categories canonical but kept reading the old per-browser list so that a name added before it shipped did not vanish from the screen of whoever typed it. That left two homes for one thing, which is the split the change existed to close: a category could still be real on one machine and nowhere else, and the dialog needed a this-computer-only label and a Share button to explain it. Nothing reads or writes browser storage for categories now. The old list is drained once at boot, after the role is known, and the key is deleted: a name that is not built-in, not already a record and not already carried by a record becomes a canonical record, and in the ordinary case where there is nothing to move the drain deletes a redundant key and writes nothing. A read-only account never writes but the key still goes. A category typed into the Category box on an event, task or SOP form also creates a canonical record now, where it used to be remembered locally, so the vocabulary is the same for everybody however it was created. The Share button and the this-computer-only state went with the store they described, leaving two states a category can be in: a record of its own, or carried by the records using it. One existing assertion moved rather than being deleted: A-13 still proves a refused form leaves no category behind and a saved one keeps it, now checked where a category actually lives.'},
  {rev:70,date:'2026-09-07',summary:'Rev 70 (FAB-47, DEC-032: categories become shared canonical data). A category used to live in whichever browser typed it, so a name one person invented stayed invisible to everyone else until a record happened to use it, and Delete could only ever remove an unused one because the list was rebuilt from the records themselves. There is now a categories collection in canonical, landed across all three repositories: data OPS-042 added it to the consolidator allow-list, the canonical validator and the operation schema, and drives a category through create, rename and delete in the consolidator test; gateway OMS-067 allows the entity type, with five checks that exercise it rather than trusting the allow-list entry; and the client joins the collection to OMS_COLLECTIONS so it syncs like anything else. A record is an id and a name, because events, tasks and SOPs reference a category by name: a rename is therefore an update to the category record AND a rewrite of every record carrying the old string, sent as one save, and renaming a category nothing uses now persists where before it was silently dropped because no record changed. The per-browser list is still read so a name added before this shipped does not vanish from that person\'s screen, but it is no longer written; the dialog labels such a row this computer only and offers a Share button that promotes it. The right-hand column now says where every category lives.'},
  {rev:69,date:'2026-09-07',summary:'Rev 69 (finishing Rev 68\'s rename). Rev 68 said one word for one bit and left three strings a person can actually read still saying standing: the Cadence line written onto the About this export sheet of a calendar export, the Mark standing and Not standing toggle buttons in the import preview, and the User Guide sentence about an annual gala. All three now say recurring, and two assertions name those surfaces so the next miss fails the build. The internal filter token calCadence equals standing and the importer\'s title-word regex are deliberately unchanged: the token keeps saved calendar views working, and the regex matches words that appear in event titles rather than anything on screen. Found by the Rev 68 register and QA audit, which read the shipped artifact rather than the release note.'},
  {rev:68,date:'2026-09-07',summary:'Rev 68 (Hossam\'s calendar and category changes of 7 Sept 2026). The Out of office chip is gone from Calendars and so is the filter behind it: out-of-office entries are ordinary events now, searchable, filterable by category and exported like anything else. Fifteen exist, all in 2026. The Dashboard\'s Events Next 30 Days counter still excludes them, which is a different question and deliberately unchanged. The Standing only chip is renamed Recurring and keeps its circular arrow. Rev 53 had unified three words onto Standing, so renaming the chip alone would have rebuilt exactly the split that fixed: the whole user-facing vocabulary moves together, across the chip, the event form, the calendar legend and markers, the import preview column and badge, the export column and the User Guide. The stored field has always been recurring, so the word on screen now matches the data. The internal filter token is unchanged, so saved views still apply. The Categories dialog can now add a category and delete one. Add takes effect at once; a duplicate is refused whatever its case. Delete is offered only for a category nothing is using, because the list is rebuilt from what the records carry and a name still in use would simply come back; a category in use is refused with its counts and pointed at rename-to-merge, and a built-in can never be removed. Renames still apply on Save. Gate check 15 was hardened in the same change: its tokenizer mishandled nested template literals and regexes containing a quote, so function spans were wrong and the containment test was reporting on the wrong function while still passing.'},
  {rev:67,date:'2026-09-07',summary:'Rev 67 (FAB-40, and the reason it recurred). A search box destroyed itself as you typed: the handler re-ran the renderer that draws the box, innerHTML replaced the element, focus fell to the page body and every character after the first was lost. Verified live on 7 Sept 2026 - typing cabinet into the Tasks box left c. Rev 12 fixed exactly this for the Calendars box in one place and nothing generalised it or bound it, so the Tasks and SOPs boxes carried the same defect beside the fix for fifty-odd revisions, and five filter dropdowns and the Weekly Brief week picker carried the milder form of it, dropping a keyboard user back to the top of the document after every choice. All eight now route through one synchronous helper, omsRerenderKeepingCaret, which captures focus and the caret before the render and restores both immediately afterwards. Synchronous is the point: the Rev 12 mechanism deferred the restore to a requestAnimationFrame callback, which loses keystrokes typed inside the gap, never runs at all while the tab is hidden or throttled, and is stubbed to a no-op by the smoke harness so no assertion could ever have exercised it. Gate check 15 with its negative control now enumerates every control in the artifact, works out which renderer draws it, and refuses any that re-renders itself without coming through the helper.'},
  {rev:66,date:'2026-09-07',summary:'Rev 66 (FAB-08, Content Security Policy). Both pages now carry a Content-Security-Policy meta tag, because GitHub Pages cannot set response headers. It names the one gateway the page may connect to and the one pinned host the spreadsheet library may load from, allows the inline styles and the one data-URI icon the page uses, and forbids plugins, form posts elsewhere and any change to the base address. OMS is a single file with its scripts inside it, so inline script must stay allowed and the policy does not stop an injected script from running; its value is that such a script could not send anything anywhere except the gateway. Verified in a local harness serving the artifact with the gateway host rewritten: no violations, state loads, SheetJS loads, the search icon draws, export serializes. The User Guide says exactly what the policy does and does not do.'},
  {rev:65,date:'2026-09-07',summary:'Rev 65 (one search box, and task templates; OMS-009 and OMS-010). A box in the header searches tasks, events, SOPs and people at once. Results are grouped by type in a fixed order, at most five per group; a title that starts with what was typed ranks above one that contains it, and a title match ranks above a match in an owner, note or location. Enter opens the highlighted result, the arrow keys move it, Escape clears; it supplements the per-screen boxes and does not replace them. Task templates: a template, edited under Task templates in the Categories dialog, names the standard tasks an event of one category always needs, each with days before or after the event, an owner and a priority. When an event of that category is added by hand, the Add Event dialog offers to create them as linked tasks dated from the event, and the box can be unticked. The importers never apply a template, so a re-import cannot multiply tasks, and editing an event never applies one. taskTemplates joins OMS_COLLECTIONS so the collection syncs like the others; the consolidator and the operation schema had allowed it since the data side was built.'},
  {rev:64,date:'2026-09-07',summary:'Rev 64 (phone layout, from the 375 and 768 pixel checks run on 7 Sept 2026 against Rev 63 in a local harness serving the shipped artifact with real canonical data). At 768 pixels everything passed: the header fits, the counters fall to two columns, the calendar grid to two, the tab bar scrolls sideways, tables scroll inside their frame, and the task dialog is centered with its footer in view. At 375 pixels two things failed. The header did not wrap, ran about 245 pixels past the viewport and made the whole page scroll sideways, with People, Notifications and Sign Out off the edge; and every form field was 12 to 13 pixels, which makes a phone zoom in when one is tapped. Below 600 pixels the header now wraps and form fields are 16 pixels. Nothing changes at desktop widths. The User Guide says what a phone can expect.'},
