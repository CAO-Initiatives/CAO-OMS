const OMS_GATEWAY='https://cao-oms-gateway.vercel.app';

let OMS_BASE={},OMS_REVISION=null,OMS_SYNC_READY=false,OMS_SYNC_CHAIN=Promise.resolve(),OMS_USER={};let OMS_SYNC_INFLIGHT=0;

function OMS_LOCAL_SAVE(){try{localStorage.setItem(OMS_LOCAL_KEY,JSON.stringify({state:ST,revision:OMS_REVISION,savedAt:new Date().toISOString()}));localStorage.removeItem('cao_oms_v132_startup_fixed')}catch(e){}const t=document.getElementById('ts');if(t)t.textContent='Local copy '+new Date().toLocaleTimeString()}
function OMS_NORMALIZE_LEGACY_DASHES(value){
  let changed=0;
  function walk(v){
    if(typeof v==='string'){
      const next=v.replace(/&amp;#128451;\s*/g,' – ').replace(/&#128451;\s*/g,' – ');
      if(next!==v)changed++;
      return next;
    }
    if(Array.isArray(v))return v.map(walk);
    if(v&&typeof v==='object')Object.keys(v).forEach(k=>{v[k]=walk(v[k]);});
    return v;
  }
  walk(value);return changed;
}
function OMS_SANITIZE(x){const o=JSON.parse(JSON.stringify(x));delete o._version;delete o._updatedAt;delete o._updatedBy;return o}
function OMS_MAP(a){const m=new Map();(Array.isArray(a)?a:[]).forEach(x=>{if(x&&x.id!=null)m.set(String(x.id),x)});return m}
/* Rev 44. An update used to send the WHOLE record as `changes`, and the whole
   prior record as `baseValues`. That defeated the one piece of concurrency
   control the consolidator has.

   consolidate.py writes a same-field conflict when a key appears in BOTH
   baseValues and changes and canonical has moved underneath. Send every key and
   every key overlaps, so ANY two edits to the same record collide - even when
   they touch nothing in common. Reproduced against the real consolidator: A
   edits the title, B edits the notes, B is rejected with "same-field conflict:
   title" and B's note is gone. Send only what changed and both apply.

   Rev 34's guide sentence - "two people writing on the same record no longer
   overwrite one another" - was true of the attributed-note control and false of
   everything else, for this reason.

   Two things this does NOT change, deliberately. A create still sends the whole
   record, because there is nothing to diff against. And a key REMOVED from a
   record is still not removed in canonical: the consolidator merges with
   dict.update(), which cannot delete, and that was equally true when the whole
   record was sent. Setting a field to empty works; making it vanish does not.

   It also shrinks what the operation log keeps forever, which is the retention
   problem from the other direction. */
function OMS_CHANGED_KEYS(before,after){
  const a=OMS_SANITIZE(before),b=OMS_SANITIZE(after),keys=[],base={},changes={};
  for(const k of Object.keys(b)){
    /* Rev 52 (D-03). A key the record did not have used to be left out of baseValues (undefined does not survive JSON), so the consolidator could not verify it and, since OPS-038, files a conflict for it. null does survive, and compares equal to an absent key on the other side. */if(JSON.stringify(a[k])!==JSON.stringify(b[k])){keys.push(k);changes[k]=b[k];base[k]=a[k]===undefined?null:a[k]}
  }
  return {keys,base,changes};
}
function OMS_DIFF(){const ops=[];for(const type of OMS_COLLECTIONS){if(!_dirty.has(type))continue;const before=OMS_MAP(OMS_BASE[type]),after=OMS_MAP(ST[type]);for(const [id,v] of after){const b=before.get(id);if(!b)ops.push({entityType:type,entityId:id,action:'create',baseVersion:0,changes:OMS_SANITIZE(v)});else{const d=OMS_CHANGED_KEYS(b,v);if(d.keys.length)ops.push({entityType:type,entityId:id,action:'update',baseVersion:Number(b._version||0),baseValues:d.base,changes:d.changes})}}for(const [id,b] of before)if(!after.has(id))ops.push({entityType:type,entityId:id,action:'delete',baseVersion:Number(b._version||0)})}return ops}
async function OMS_FETCH_STATE(){const r=await fetch(OMS_GATEWAY+'/api/state',{headers:{Authorization:'Bearer '+OMS_TOKEN()}});const text=await r.text();let x;try{x=JSON.parse(text)}catch{throw new Error('State service returned non-JSON')}if(r.status===401||r.status===403)throw Object.assign(new Error('Authentication required'),{auth:true});if(!r.ok||!x.state)throw new Error(x.error||'State read failed');if(x.state.schemaVersion!==2)throw new Error('Unsupported schema version');return x}
/* Rev 60. The gateway accepts a whole save in one POST (OMS-064): one inbox
   file, one commit, one consolidator run, where a task with an owner used to
   be three of each in series. Null until the gateway has answered a batch;
   false if it refused the shape, after which operations go one by one exactly
   as before, so an older gateway is a slower path and not a broken one. */
let OMS_BATCH_OK=null;
async function OMS_POST_BATCH(ops){
  if(OMS_BATCH_OK===false||ops.length<2)return null;
  try{const x=await OMS_POST({operations:ops});if(!x||x.accepted!==true||!Array.isArray(x.operationIds)||x.operationIds.length!==ops.length)throw new Error('Batch not accepted');OMS_BATCH_OK=true;return x}

}
/* Rev 60 (D-12). /api/revision is a few hundred bytes from the manifest; the
   state file is about 180 KB. Every poll used to fetch the state to learn that
   nothing had changed. Ask for the revision first and fetch the state only
   when it has moved. Null means the endpoint is unavailable - an older
   gateway, or a blip - and the caller fetches the state as it always did. The
   manifest also carries the consolidator's own verdict on the shared record,
   which the Connected banner now repeats when it is not 'ready'. */

  if(!OMS_REVISION_EP)return null;
  try{const r=await fetch(OMS_GATEWAY+'/api/revision',{headers:{Authorization:'Bearer '+OMS_TOKEN()}});if(r.status===401||r.status===403)throw Object.assign(new Error('Authentication required'),{auth:true});if(r.status===404||r.status===405){OMS_REVISION_EP=false;return null}if(!r.ok)return null;const x=JSON.parse(await r.text());if(!Number.isInteger(x.revision))return null;OMS_CANON_STATUS=typeof x.status==='string'?x.status:'';return x.revision}

async function OMS_POST(op){const r=await fetch(OMS_GATEWAY+'/api/operation',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+OMS_TOKEN()},body:JSON.stringify(op)});const text=await r.text();let x;try{x=JSON.parse(text)}catch{throw new Error('Operation service returned non-JSON')}if(r.status===401)throw Object.assign(new Error('Authentication required'),{auth:true});
/* Rev 41. Every 403 used to be reported as 'Authentication required', which is
   only true of a 401. Two of them are not an expired session at all, and both
   were telling the user something false and unactionable:

   - A READ-ONLY ACCOUNT saving. The gateway has refused this since the role
     check went in, and the screen said the session had expired. It had not, and
     signing in again would change nothing.
   - AN INITIAL PASSWORD NOT YET CHANGED (OMS-053, gateway). The refusal is new,
     the misreporting would not have been: without this the save would land in
     the generic Unsynced branch, which tells people to press Save again - and
     Save can never work until the password is set.

   Branch on the gateway's `code`, never on its prose: the message is written
   for a person and gets improved, the code is written for this line. */
if(r.status===403){const code=String(x.code||''),msg=String(x.error||x.message||'');
  if(code==='password_change_required')throw Object.assign(new Error(msg||'Set a new password before changing shared data.'),{mustChange:true,status:403});
  if(code==='read_only'||/read.?only/i.test(String(x.error||'')))throw Object.assign(new Error('This account can read OMS but not change it.'),{readOnly:true,status:403});

/* Rev 21 (REV19-003). True while a save is on its way to canonical, or while
   work is sitting in the local pending key that Rev 15 introduced. Closing the
   tab in either state loses the edit, because confirmation takes tens of
   seconds and nothing is retried on the next load. Deliberately NOT implemented
   inside OMS_SYNC_ONCE: that function carries the id-less-record guard and is
   the highest-risk surface in the codebase, so the counter is kept in
   OMS_QUEUE_SYNC and the guarded function is left byte for byte alone. */
function OMS_SYNC_PENDING(){
  let stored=false;
  try{stored=!!localStorage.getItem(OMS_PENDING_KEY)}catch(e){}
  return OMS_SYNC_INFLIGHT>0||stored;

/* Rev 21 (REV19-002). The old loop slept a flat second before it looked even
   once, so a confirmation could sit unnoticed for up to a second and the first
   check never happened early. This front-loads the checks and then backs off,
   over a longer total budget. Honest expectation: the saving is under a second.
   The bulk of the wait is the consolidator workflow folding the operation into
   the state file, not the poll interval - and the larger cost is upstream
   anyway, at two GitHub round trips per operation (OPS-023). */
const OMS_POLL_MS=[300,300,400,500,600,800,1000];
/* ─── WHAT COUNTS AS CONFIRMATION (Rev 36) ───
   This used to return as soon as canonical's revision was greater than the one
   we started from. That is not the same proposition as "my change was applied",
   and consolidate.py says so in its own comment: it increments the revision
   ONCE PER BATCH, "including conflicts/invalid operations". So the revision
   moves when an operation is REJECTED, and it moves when somebody ELSE's save
   is folded in while ours is still queued.

   In both cases the old code adopted canonical wholesale, cleared the dirty
   set, deleted the local pending copy and reported "Save successful" - while
   the screen reverted to the value the user had just changed. That is the same
   shape as the defect Rev 15 fixed at the other end of the pipe: a save that
   did nothing reporting that it had.

   So confirmation now means the operations are VISIBLE IN CANONICAL. A create
   must be there, a delete must be gone, and an update's own fields must hold
   the values it asked for. Anything else is either still pending or was
   rejected, and those are different answers that need different endings. */
function OMS_LANDED_ONE(state,op){
  const rows=Array.isArray(state&&state[op.entityType])?state[op.entityType]:[];

  if(op.action==='create')return cur?'applied':'pending';
  if(op.action==='delete'){

/* Rev 54 (A-05). Resolving an owner and OFFERING an owner are two different questions and this filter answered both with one rule. Deactivating somebody made every task they still own unresolvable: each save prompted for an email address that was already on file, and typing it created a SECOND person holding the same address, splitting the routing and the history in two. Resolution now sees inactive people; ownerSelectHtml still offers only active ones, plus whoever currently owns the record. */
function findPeople(q,includeInactive,exactOnly){
  const n=String(q||'').trim().toLowerCase();
  if(!n)return [];
  const people=(ST.people||[]).filter(p=>p&&(includeInactive||p.active!==false));
  const local=p=>String(p.email||'').toLowerCase().split('@')[0];
  const parts=p=>{const a=String(p.name||'').toLowerCase().split(/\s+/).filter(Boolean);const b=local(p).split(/[._-]+/).filter(Boolean);return [...new Set([...a,...b])]};
  // Ladder, most specific first. A rung only counts if it matches exactly one
  // person; otherwise fall through so the caller can report the ambiguity.
  const rungs=[
    p=>String(p.name||'').toLowerCase()===n,
    p=>String(p.email||'').toLowerCase()===n,
    p=>local(p)===n,
    p=>parts(p).includes(n),
    p=>String(p.id||'')===slug(n),
    p=>parts(p).some(w=>w.startsWith(n)&&n.length>=3)
  ];
  /* Rev 72 (FAB-48). exactOnly drops the last rung. The ladder's tail is a
     3-character prefix match, which is right for somebody typing into a box
     and wrong for deciding where an email goes: "Kat" would bind Katie even
     when the record already names somebody else. Addressing passes the flag;
     every interactive caller keeps the full ladder. */
  const use=exactOnly?rungs.slice(0,5):rungs;
  for(const r of use){const hit=people.filter(r);if(hit.length)return hit}
  return [];
}
function findPerson(nameOrEmail,includeInactive,exactOnly){
  // Binds ONLY when unambiguous. Two matches must never silently become one.
  const hits=findPeople(nameOrEmail,includeInactive,exactOnly);
  return hits.length===1?hits[0]:null;
}
function ownerAmbiguity(nameOrEmail){
  const hits=findPeople(nameOrEmail);

function upsertPerson(name,email,role){

  name=String(name||'').trim(); email=String(email||'').trim(); role=String(role||'').trim();
  if(!name){alert('Name is required.');return null;}
  if(!email){alert('Email is required for notifications.');return null;}
  ST.people=Array.isArray(ST.people)?ST.people:seedPeople();
  /* Rev 54 (A-05). Look inactive people up too, or re-adding somebody who was deactivated mints a duplicate id holding the same address. Finding them revives the record that already exists, with its history. */
  let p=findPerson(email,true)||findPerson(name,true);
  if(p){p.name=name;p.email=email;p.role=role||p.role||'';p.active=true;p.updatedAt=new Date().toISOString();}
  else{let base=slug(name),cand=base,k=2;while((ST.people||[]).some(x=>x&&x.id===cand)){cand=base+'-'+(k++)}p={id:cand,name,email,role,active:true,createdAt:new Date().toISOString()};ST.people.push(p);}

/* Rev 61. AT RISK IS NOT tasksDueSoon, AND THIS IS WHY IT IS A SECOND

   not already finished or retired. Overdue work is deliberately NOT at risk. It
   has its own counter, and the point of this one is work that can still be

function tasksAtRisk(days){

    if(!t||!t.due)return false;
    if(isDone(t)||isRetired(t))return false;

/* Rev 72 (FAB-48). A task carries its own copy of its owner's address, so the
   three notification builders can address a draft without a directory lookup.
   That copy goes stale and nothing corrected it: changing somebody's address
   in People rewrites the person and leaves every task of theirs pointing at
   the old one, Copy clones whatever the source held, and the boot backfill
   returns early when an address is merely WRONG rather than missing.
   Found live on 7 Sept 2026. Two tasks reassigned away from Rachel Woodside
   still carried her address, so Remind on a task the grid showed as Maggie's
   would have drafted an email to Rachel saying "Owner: Maggie Scirica".
   The address is resolved when the draft is built and never written back: a
   write on a read is the Rev 50 trap. Resolution is name first, because the
   owner name is what the grid shows and what the body states; ownerId is the

   produce a draft is unchanged - only where the draft is addressed. */
function omsOwnerAddress(rec){
  if(!rec)return '';

     people here would send a deactivated owner's mail through the stale
     ownerId - the very defect this exists to stop - while trying inactive
     FIRST would let a deactivated namesake outrank the live person. */
  const byName=rec.owner?(findPerson(rec.owner,false,true)||findPerson(rec.owner,true,true)):null;
  if(byName&&String(byName.email||'').trim())return String(byName.email).trim();
  const byId=rec.ownerId?(ST.people||[]).find(x=>x&&String(x.id)===String(rec.ownerId)):null;

function createDueReminders(days){

    const _to=omsOwnerAddress(t);

       addressed somewhere else before writing a new one, or correcting an
       address in People leaves two live drafts about one task addressed to
       two people. Remind is an explicit action the user confirmed, so this is
       not a write on a read - the Rev 50 trap - and reassignment is handled
       separately by omsStaleDueReminders. */
    (ST.notifications||[]).forEach(x=>{

/* Rev 54 (A-10). The other half. A pending reminder addressed to whoever used to own the task is not merely redundant - opening it drafts an email telling somebody to finish work that is no longer theirs. Reassigning marks those stale; the bell counts only pending, so they leave the badge, and the queue says why they are still listed rather than hiding them. */
function omsStaleDueReminders(task,previous){
  if(!task||!previous)return 0;
  const now=omsOwnerAddress(task).trim().toLowerCase();
  /* Rev 72 (FAB-48). A draft records the address it was addressed to when it
     was WRITTEN. Comparing a fresh lookup of `previous` against that frozen
     value matches nothing the moment the two drift - which is the entire
     condition this revision exists for, and covers every draft already in
     canonical, since those were addressed from the stored field. So match the
     UNION: what the previous record resolves to today, and the raw copy it
     still carries. Anything already addressed to the new owner is excluded,
     so a correct draft is never retired. */
  const was=[omsOwnerAddress(previous),previous.ownerEmail]
    .map(v=>String(v||'').trim().toLowerCase())
    .filter((v,i,a)=>v&&v!==now&&a.indexOf(v)===i);
  if(!was.length)return 0;
  let k=0;
  (ST.notifications||[]).forEach(n=>{
    if(!n||n.type!=='due_reminder'||n.status!=='pending')return;
    if(String(n.taskId)!==String(task.id))return;
    if(was.indexOf(String(n.recipientEmail||'').trim().toLowerCase())<0)return;

function decodeHtmlEntities(value){
  const map={amp:'&',lt:'<',gt:'>',quot:'"',apos:"'",nbsp:' ',mdash:'\u2014',ndash:'\u2013',hellip:'\u2026'};

/* Rev 34 (OMS-029). The register asked for communication tracking. Most of it
   already existed: OMS drafts an email, openNotificationDraft opens it and
   markNotificationSent records that a person sent it. The gap was everything
   OMS did NOT generate - a call, a forwarded thread, a conversation in a
   corridor - which left no trace at all.

   A separate communications collection was rejected. Notifications already
   carry recipient, subject, body, method, status and timestamps; a second
   collection would double the sync surface and add another place for records
   to arrive without ids, which is the failure that hid in gw and rob for
   eleven revisions. A logged entry is a notification that was already sent. */
function omsLogCommunication(){
  if(!OMS_IS_EDITOR()){alert('Read-only access.');return}
  const who=gv('lc_name').trim(),email=gv('lc_email').trim(),subject=gv('lc_subject').trim();
  const method=gv('lc_method'),summary=gv('lc_body').trim(),when=gv('lc_when');
  if(!who){alert('Who it went to is required.');return}
  if(!subject){alert('A subject or short description is required.');return}
  const person=who?findPerson(who):null;
  const at=when?new Date(when+'T12:00:00').toISOString():new Date().toISOString();
  ST.notifications=Array.isArray(ST.notifications)?ST.notifications:[];
  ST.notifications.unshift({id:uid(),type:'logged',taskId:'',
    recipientName:person?person.name:who,
    recipientEmail:email||(person?(person.email||''):''),
    subject:subject,body:summary,method:method||'Email',
    status:'sent_by_user',createdAt:new Date().toISOString(),sentAt:at,
    loggedBy:omsMe()});
  save();renderNotificationBadge();openNotificationsModal();
}

/* ─── Rev 74 (OMS-026): the export takes a date range ───
   Rev 63 gave every grid an Export button that wrote everything the screen
   showed. A Dean briefing wants one week, or one quarter, not the whole
   calendar - which is what OMS-026 has asked for since 30 July 2026 - and the
   Weekly Brief, the only thing that could narrow by date, printed one week and
   produced no file.

   The range is applied ON TOP of the screen's own list function, never instead
   of it: omsTaskRows, omsCalItems and omsSopRows still decide what is in
   scope, and the range narrows what they returned. That keeps the Rev 63 rule
   - a filter cannot be honored on screen and ignored in the file - true in the
   direction that matters, and the file says which way it was narrowed. The
   About sheet records the range, how many rows fell outside it and how many
   carried no date at all, because a short export that does not say why it is
   short is how an item goes missing from a briefing.

   Which date each screen ranges on, and it is the date the screen itself
   shows, not a second interpretation of it:
     Calendars  the event or task date. A multi-day event is included when any
                of its days fall inside the range, not only when it starts
                inside it, so a conference spanning the boundary is not lost.
     Tasks      the due date.
     SOPs       the review due date.
     Cadence    the month COLUMNS the range spans. That grid stores a month and
                no year, so a range of twelve months or more is every month.
   The Admin directory has no range: a person record carries no date, so there
   is nothing to range on and its button still exports at once. The tooltip and
   the guide both say so, and a binding refuses to let it be wired to the
   dialog while they do.

   The chosen range is remembered while the page is open, because a briefing
   range is usually the same range on Calendars and on Tasks. It is never
   applied unseen: the dialog shows it before anything is written, and every
   file states it. It is deliberately NOT stored - a reload starts blank rather
   than quietly cropping tomorrow's export to last week. */
let _expScreen='',_expRange={start:'',end:''};
function omsExportRangeActive(){return !!(_expRange.start||_expRange.end)}
function omsExportRangeLabel(){const a=_expRange.start,b=_expRange.end;if(!a&&!b)return 'None; every row the screen showed';if(a&&b)return fmt(a)+' to '+fmt(b);return a?('From '+fmt(a)+' onwards'):('Up to '+fmt(b))}
/* A row is in range when ITS OWN SPAN OVERLAPS the range, which for everything
   except a multi-day event is a single day compared twice. Strings, not Dates:
   these are all yyyy-mm-dd and Rev 54 spent a release on timezone arithmetic
   that string comparison does not have. */
function omsInExportRange(first,last){const s=String(first||'');if(!s)return false;let e=String(last||s);if(e<s)e=s;if(_expRange.start&&e<_expRange.start)return false;if(_expRange.end&&s>_expRange.end)return false;return true}
/* Splits a list into what the range keeps, what it excludes, and what has no
   date to judge. The first line is load-bearing: with NO range chosen this is
   not a filter at all, it hands the list straight back, undated rows included,
   which is exactly what Rev 63 wrote and what every existing export still
   does. Only a range the user typed can drop a row. */
function omsRangeSplit(rows,firstOf,lastOf){
  if(!omsExportRangeActive())return {rows:rows,outside:0,undated:0};
  const kept=[];let outside=0,undated=0;
  for(const r of rows){
    const d=String(firstOf(r)||'');
    if(!d){undated++;continue}
    if(omsInExportRange(d,lastOf?lastOf(r):d))kept.push(r);else outside++;
  }
  return {rows:kept,outside:outside,undated:undated};
}
/* The Cadence grid's month columns, as indices into MNA. A range of twelve
   months or more, or one that makes no sense, is every month. A range that
   wraps the year end - November to February - selects Jan, Feb, Nov and Dec,
   and they stay in the grid's own order so the header still reads left to
   right the way the screen does. */
function omsExportRangeMonths(){
  const every=MNA.map((m,i)=>i);
  if(!omsExportRangeActive())return every;
  const a=_expRange.start?dp(_expRange.start):null,b=_expRange.end?dp(_expRange.end):null;
  if(a&&!b)return every.filter(i=>i>=a.getMonth());
  if(!a&&b)return every.filter(i=>i<=b.getMonth());
  const span=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
  if(span<0||span>=MNA.length-1)return every;
  const keep=new Set();for(let k=0;k<=span;k++)keep.add((a.getMonth()+k)%MNA.length);
  return every.filter(i=>keep.has(i));
}
/* The dialog. It is a modal rather than two boxes in the toolbar on purpose:
   the Rev 44 idle refresh redraws every screen every sixty seconds and would
   wipe a half-typed date out of a toolbar, and OMS_MODAL_OPEN() is what stops
   it while a dialog is up. The shared footer's Save belongs to saveModal and
   would sync nothing here, so this dialog hides it and carries its own
   buttons; openModal puts it back for the next dialog. */
function omsExportRangeDialog(screen){
  _expScreen=String(screen||'');
  const what=_expScreen==='Tasks'?'Only tasks whose <strong>due date</strong> falls inside the range are written.'
    :_expScreen==='Calendar'?'Only events and task due dates inside the range are written. A multi-day event is included when any of its days fall inside the range.'
    :_expScreen==='SOPs'?'Only procedures whose <strong>review due date</strong> falls inside the range are written.'
    :'The Cadence grid records a month and no year, so the range picks the <strong>month columns</strong> it spans: 1 January to 31 March writes Jan, Feb and Mar. Twelve months or more writes every month.';
  openModal('Export '+_expScreen,
    `<div class="im" style="margin-bottom:12px">${what} The screen&#39;s own filters, search and sort still apply, and the range narrows what they gave. Leave both dates blank to export everything the screen shows.</div>`
    +`<div class="fr"><div class="fg"><label for="exp_start">From</label><input type="date" class="fc" id="exp_start" value="${esc(_expRange.start)}"></div>`
    +`<div class="fg"><label for="exp_end">To</label><input type="date" class="fc" id="exp_end" value="${esc(_expRange.end)}"></div></div>`
    +`<div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn bn" onclick="omsExportRangeApply()" data-tip="Write the file for this range.&#10;The range is remembered for your next&#10;export until you reload the page.">Export</button>`
    +`<button class="btn bo" onclick="omsExportRangeClear()" data-tip="Empty both dates, so Export writes&#10;everything the screen shows.">Clear the range</button>`
    +`<button class="btn bg2" onclick="closeModal()" data-tip="Close this dialog without exporting.">Cancel</button></div>`
    +`<div class="im" style="margin-top:12px">Rows with no date are left out while a range is set, and the second sheet of the file counts them, so a short export is never a silent one.</div>`,
    'exp',null);
  const ft=document.getElementById('mft');if(ft)ft.style.display='none';
}
function omsExportRangeClear(){_expRange={start:'',end:''};const a=document.getElementById('exp_start'),b=document.getElementById('exp_end');if(a)a.value='';if(b)b.value='';}
function omsExportRangeApply(){
  const a=String(gv('exp_start')||''),b=String(gv('exp_end')||'');
  const ok=v=>!v||/^\d{4}-\d{2}-\d{2}$/.test(v);
  if(!ok(a)||!ok(b)){alert('Enter each date as a date, or leave it blank.');return}
  if(a&&b&&b<a){alert('The range ends before it starts.');return}
  _expRange={start:a,end:b};
  closeModal();
  omsExportRangeRun();
}
/* One dispatcher, so the four writers are reachable from the dialog and a
   binding can prove it. */
function omsExportRangeRun(){
  const s=_expScreen;
  if(s==='Tasks')return omsExportTasks();
  if(s==='Calendar')return omsExportCalendar();
  if(s==='SOPs')return omsExportSops();
  if(s==='Cadence')return omsExportRob();
  return null;
}
function omsExportAbout(screen,filter,count,cut){
  const rows=[['About this export',''],['Screen',screen],['Rows',count],['Filter and sort',filter]];
  if(!cut){rows.push(['Date range','Not applicable: a person record carries no date, so the whole directory is written'])}
  else{
    rows.push(['Date range',omsExportRangeLabel()]);
    if(omsExportRangeActive()){
      if(cut.months!=null)rows.push(['Month columns written',cut.months+' of '+MNA.length]);
      else{rows.push(['Rows left out by the range',cut.outside]);rows.push(['Rows with no date, left out',cut.undated])}
    }
  }
  return rows.concat([['Exported at',new Date().toLocaleString()],['Exported by',(OMS_USER&&(OMS_USER.displayName||OMS_USER.name))||''],
    ['Canonical revision',OMS_REVISION],['OMS build','Rev '+OMS_REV_LOG[0].rev],
    ['Note','The rows are what the screen showed at the moment of export, following its filter and sort. This file is a copy: changes made to it do not reach OMS.']]);
}
function omsExportGrid(screen,header,rows,filter,cut){
  if(typeof XLSX==='undefined'||!XLSX.utils||!XLSX.writeFile){alert('The spreadsheet library did not load, so nothing can be exported. Reload the page and try again.');return null}
  /* Rev 74. A header-only spreadsheet is not an answer to a question about a
     week. Only the range can produce one here - a screen showing nothing has
     always written an empty file and that is not this release's business - so
     the refusal names the range and leaves the range set, ready to be widened. */
  if(cut&&omsExportRangeActive()&&!rows.length){
    alert('Nothing to export: no row falls inside '+omsExportRangeLabel()+'. Widen the range, or clear it to export everything the screen shows.');
    return null;
  }
  const shown=cut&&omsExportRangeActive()?filter+'; Date range: '+omsExportRangeLabel():filter;
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet([header].concat(rows));
  ws['!cols']=header.map((h,i)=>({wch:Math.min(60,Math.max(String(h).length,...rows.map(r=>String(r[i]==null?'':r[i]).length))+2)}));
  XLSX.utils.book_append_sheet(wb,ws,String(screen).slice(0,31));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(omsExportAbout(screen,shown,rows.length,cut)),'About this export');
  const name=omsExportFilename(screen);
  XLSX.writeFile(wb,name);
  const left=cut&&omsExportRangeActive()?(Number(cut.outside||0)+Number(cut.undated||0)):0;
  OMS_TOAST('Exported '+rows.length+' row'+(rows.length===1?'':'s')+' to '+name+(left?' ('+left+' left out by the range)':''));
  return name;
}

function omsExportRob(){

     written, over the months the range spans. */

/* ─── Rev 65: ONE SEARCH BOX ───
   Search was per screen: four boxes, each blind to the other three record
   types, so finding "the Cabinet thing" meant guessing which screen held it.
   This box in the header searches tasks, events, SOPs and people at once. It
   SUPPLEMENTS the per-screen boxes and does not replace them: those filter a
   table in place, which is a different job from finding one record.
   Ranking is deliberately simple and explained in the guide: a title that
   starts with what was typed ranks above one with a word that starts with it,
   which ranks above one that merely contains it, which ranks above a match in
   a secondary field (owner, notes, location, email). Groups are always in the
   same order, at most five per group, so the eye learns where to look. */
function omsSearchRank(q,fields){
  const n=String(q||'').toLowerCase();const p=String(fields[0]||'').toLowerCase();
  if(p.startsWith(n))return 0;
  if(p.split(/\s+/).some(w=>w.startsWith(n)))return 1;
  if(p.includes(n))return 2;
  if(fields.slice(1).some(f=>String(f||'').toLowerCase().includes(n)))return 3;
  return -1;
}
function omsGlobalSearch(q){
  q=String(q||'').trim();if(q.length<2)return [];
  const take=(list,type,title,fields,label,sub)=>{
    const items=(list||[]).filter(Boolean).map(x=>({x,r:omsSearchRank(q,fields(x))})).filter(o=>o.r>=0)
      .sort((a,b)=>a.r-b.r||String(fields(a.x)[0]||'').localeCompare(String(fields(b.x)[0]||'')))
      .slice(0,5).map(o=>({type,id:String(o.x.id),label:label(o.x),sub:sub(o.x),rank:o.r}));
    return items.length?[{type,title,items}]:[];
  };
  return [].concat(
    take(ST.tasks,'tasks','Tasks',x=>[x.title,x.owner,x.notes,x.category],x=>x.title||'Untitled task',x=>[x.owner||'Unassigned',taskDisplayStatus(x),x.due?'Due '+fmt(x.due):''].filter(Boolean).join(' · ')),
    take((ST.events||[]).filter(x=>x&&!isRetired(x)),'events','Events',x=>[x.title,x.location,x.category,x.notes],x=>x.title||'Untitled event',x=>[fmt(x.date),x.category,x.location].filter(Boolean).join(' · ')),
    take(ST.sops,'sops','SOPs',x=>[x.process,x.owner,x.notes,x.category],x=>x.process||'Untitled SOP',x=>[x.owner,x.category].filter(Boolean).join(' · ')),
    take((ST.people||[]).filter(x=>x&&x.active!==false),'people','People',x=>[x.name,x.email,x.role],x=>x.name||'',x=>[x.role,x.email].filter(Boolean).join(' · ')));
}
let _gsIdx=0,_gsFlat=[];
function omsGlobalSearchHide(){const r=document.getElementById('gsres');if(r){r.hidden=true;r.innerHTML=''}_gsFlat=[];_gsIdx=0}

function omsGlobalSearchKey(ev){

/* ─── Rev 65: TASK TEMPLATES (OMS-009 / OMS-010) ───
   Storage and sync existed before the client did: taskTemplates has been in
   the consolidator's allow-list and the operation schema since the data side
   was built, and nothing read or wrote it. Shape, decided 7 Sept 2026:
     {id:'tpl-<slug>', name, category, lines:[{title, offsetDays, owner, priority}]}
   A template binds to an EVENT CATEGORY, because that is the one vocabulary
   events, tasks and SOPs already share, and it is edited from the Categories
   dialog, which already owns that vocabulary. It is applied at ONE moment: when
   an event of that category is added by hand, the Add Event dialog offers to
   create the lines as linked tasks dated from the event. The importers never
   apply a template, so a re-import cannot multiply tasks, and editing an event
   never applies one, so nothing is created twice. Tasks made this way are
   ordinary linked tasks with no special marker: they can be edited, retired or
   deleted like any other, and deleting the template later keeps them. */
function omsTemplates(){return Array.isArray(ST.taskTemplates)?ST.taskTemplates.filter(Boolean):[]}
function omsTemplatesFor(cat){const c=String(cat||'');return omsTemplates().filter(t=>String(t.category||'')===c&&Array.isArray(t.lines)&&t.lines.length)}

function omsAddDays(iso,n){const d=dp(iso);if(!d||isNaN(d))return '';d.setDate(d.getDate()+(Number(n)||0));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function omsOffsetLabel(n){n=Number(n)||0;return n===0?'on the day':(Math.abs(n)+' day'+(Math.abs(n)===1?'':'s')+(n<0?' before':' after'))}

}
function omsRefreshTemplateOffer(cat){const b=document.getElementById('f_tpl_block');if(b)b.innerHTML=(cat==='__new__')?'':omsTemplateOfferHtml(cat)}

function omsTemplateLineHtml(l){

function omsEditTemplate(id){

function omsSaveTemplate(){
  if(!OMS_IS_EDITOR()){alert('Read-only access.');return}
  const id=String(gv('tpl_id')||''),name=String(gv('tpl_name')||'').trim(),cat=String(gv('tpl_cat')||'').trim();
  if(!name){alert('Give the template a name.');return}
  if(!cat){alert('Choose the category it applies to.');return}
  const rows=[].slice.call(document.querySelectorAll('#tpl_lines tr.tpl-line'));
  const val=(r,c)=>{const el=r.querySelector(c);return el?String(el.value||''):''};
  const lines=rows.map(r=>({title:val(r,'.tpl-title').trim(),offsetDays:Number(val(r,'.tpl-days'))||0,owner:val(r,'.tpl-owner'),priority:val(r,'.tpl-pri')||'Medium'})).filter(l=>l.title);
  if(!lines.length){alert('A template needs at least one task line with a title.');return}
  if(!Array.isArray(ST.taskTemplates))ST.taskTemplates=[];
  const i=id?ST.taskTemplates.findIndex(x=>x&&String(x.id)===id):-1;
  const rec={id:i>=0?id:omsTemplateId(name),name,category:cat,lines};

}
function omsDeleteTemplate(id){
  if(!OMS_IS_EDITOR()){alert('Read-only access.');return}
  const t=omsTemplates().find(x=>String(x.id)===String(id));if(!t)return;
  if(!confirm('Delete the template "'+t.name+'"?\n\nTasks already created from it are kept.'))return;

  OMS_EDIT_SEQ++;_dirty.add('taskTemplates');OMS_QUEUE_SYNC();

}

function omsTaskRows(){
