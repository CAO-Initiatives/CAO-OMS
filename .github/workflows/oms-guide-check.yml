name: OMS Release Gate Check

# Broadened from oms.html only. The old trigger meant a change to the gate
# itself, to index.html, to the preflight or to data/ ran no checks at all.
on:
  push:
    branches: [main]
    paths:
      - 'oms.html'
      - 'index.html'
      - 'data/**'
      - 'test/**'
      - 'scripts/**'
      - 'gate4_preflight.py'
      # CLAUDE.md was missing from this list, so a commit that changed only
      # CLAUDE.md deployed with no checks at all - including check 13, which
      # exists to police that exact file. Confirmed against the Actions API:
      # e5d8fae, whose message is "CLAUDE.md: refresh figures that had drifted
      # six revisions out of date", ran one workflow and it was Pages.
      - 'CLAUDE.md'
      - '.github/workflows/oms-guide-check.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  oms-release-gate:
    name: OMS Delivery Checklist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run release gate
        run: |
          chmod +x scripts/release_gate.sh
          ./scripts/release_gate.sh HEAD~1

      # The gate checks that the artifact is well FORMED. This checks that it
      # BEHAVES. The gw/rob defect passed every gate check ever written.
      - name: Behavioral smoke test
        run: node test/smoke.mjs oms.html
