name: OMS Release Gate Check

# Broadened from oms.html only. The old trigger meant a change to the gate
# itself, to index.html, to the preflight or to data/ ran no checks at all.
on:
  push:
    branches: [main]
    paths:
      - 'oms.html'
      - 'index.html'
      - 'data/**'
      - 'gate4_preflight.py'
      - 'scripts/release_gate.sh'
      - '.github/workflows/oms-guide-check.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  oms-release-gate:
    name: OMS Delivery Checklist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run release gate
        run: |
          chmod +x scripts/release_gate.sh
          ./scripts/release_gate.sh HEAD~1
