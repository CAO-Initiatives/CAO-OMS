
name: OMS Release Gate Check

on:
  push:
    branches: [main]
    paths:
      - 'oms.html'

jobs:
  oms-release-gate:
    name: OMS Delivery Checklist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run OMS release gate checks
        run: |
          echo "======================================"
          echo "OMS RELEASE GATE — Delivery Checklist"
          echo "======================================"

          DIFF=$(git diff HEAD~1 HEAD -- oms.html)
          PASS=true

          CHANGED_LINES=$(echo "$DIFF" | grep -c "^+" || echo "0")
          echo "Changed lines: $CHANGED_LINES"

          if [ "$CHANGED_LINES" -gt 5 ]; then
            GUIDE_CHANGED=$(echo "$DIFF" | grep -cE "^\+.*(guide-wrap|guide-hero|guide-sec|User Guide|Navigation:|Admin|Import|Tasks)" || echo "0")
            if [ "$GUIDE_CHANGED" -eq 0 ]; then
              echo "FAIL CHECK 1: Non-cosmetic change but User Guide NOT updated."
              PASS=false
            else
              echo "PASS CHECK 1: User Guide updated."
            fi
          else
            echo "PASS CHECK 1 SKIPPED: Cosmetic-only change."
          fi

          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_LEN=${#COMMIT_MSG}
          if [ "$COMMIT_LEN" -lt 10 ]; then
            echo "FAIL CHECK 2: Commit message too short."
            PASS=false
          else
            echo "PASS CHECK 2: Commit message OK ($COMMIT_LEN chars)."
          fi

          VERSION=$(grep -oE 'vbadge">v[0-9]+\.[0-9]+\.[0-9]+' oms.html | head -1 | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' || echo "NOT FOUND")
          if [ "$VERSION" = "NOT FOUND" ]; then
            echo "FAIL CHECK 3: Version badge missing."
            PASS=false
          else
            echo "PASS CHECK 3: Version badge present ($VERSION)."
          fi

          SCRIPT_OPEN=$(grep -c "<script" oms.html || echo "0")
          SCRIPT_CLOSE=$(grep -c "</script>" oms.html || echo "0")
          if [ "$SCRIPT_OPEN" -ne "$SCRIPT_CLOSE" ]; then
            echo "FAIL CHECK 4: Mismatched script tags."
            PASS=false
          else
            echo "PASS CHECK 4: Script tags balanced ($SCRIPT_OPEN)."
          fi

          SHEETJS=$(grep -c "cdn.sheetjs.com" oms.html || echo "0")
          if [ "$SHEETJS" -eq 0 ]; then
            echo "FAIL CHECK 5: SheetJS CDN missing."
            PASS=false
          else
            echo "PASS CHECK 5: SheetJS present."
          fi

          GATEWAY=$(grep -c "OMS_GATEWAY" oms.html || echo "0")
          if [ "$GATEWAY" -eq 0 ]; then
            echo "FAIL CHECK 6: OMS_GATEWAY missing."
            PASS=false
          else
            echo "PASS CHECK 6: OMS_GATEWAY present."
          fi

          ADMIN=$(grep -c "rAdmin" oms.html || echo "0")
          if [ "$ADMIN" -eq 0 ]; then
            echo "FAIL CHECK 7: Admin Console missing."
            PASS=false
          else
            echo "PASS CHECK 7: Admin Console present."
          fi

          echo "======================================"
          if [ "$PASS" = "true" ]; then
            echo "ALL CHECKS PASSED — Deploy approved."
          else
            echo "ONE OR MORE CHECKS FAILED — Deploy blocked."
            exit
